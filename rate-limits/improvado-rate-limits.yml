limit_count: 0
note: >-
  Improvado publishes a rate-limits page for the Embedded API v3 that confirms limits are ENFORCED but
  states no values. Verbatim, the entire page reads: "All API methods enforce rate limits (maximum
  number of requests per period of time). Exact mechanism (including rate limit values, informational
  headers and errors) will be described later." No numeric limit, no response header name, and no
  exhaustion status code is published for the REST API. limit_count is therefore an honest 0 — the
  provider has documented the existence of throttling without documenting the contract, which means an
  agent cannot back off correctly. This is a real, fixable gap on the provider's side, not a gap in our
  measurement.
