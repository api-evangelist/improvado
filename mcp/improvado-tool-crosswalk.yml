source: mcp/improvado-mcp.yml + llms/improvado-llms.txt (Embedded API v3 operation list)
type: ToolCrosswalk
note: >-
  Improvado runs three non-identical projections of one data core, and this file records where they
  diverge. (1) The Embedded API v3 REST surface at https://embedded.improvado.io — fully documented
  (METHOD + path) in the developer portal and its llms.txt, but Improvado publishes NO OpenAPI for it,
  so there are no operationIds to bind to; the `rest:` column therefore carries the documented
  METHOD + path, which is the strongest identifier the provider actually publishes. (2) The customer
  MCP server at report.improvado.io — 83 enumerated OAuth-gated tools (Improvado advertises 84). (3) The public Agent Ask API at
  agent.improvado.io — the ONE surface with a real OpenAPI (openapi/improvado-agent-ask-openapi.json).
  Live tools/list is auth-gated (HTTP 401), so tool input schemas could not be read; bindings below are
  mapped by NAME AND SEMANTICS against the published REST reference, and confidence is set honestly.
  Nothing here is invented — every tool name comes from Improvado's published tool reference and every
  REST path from Improvado's published API reference.
surfaces:
  openapi:
    file: openapi/improvado-agent-ask-openapi.json
    covers: Public Agent Ask API only (1 operation, agent.improvado.io)
    gated: false
  rest_documented:
    docs: https://developers.improvado.io/api
    machine_readable: llms/improvado-llms.txt
    covers: Improvado Embedded API v3 (embedded.improvado.io)
    openapi_published: false
    note: Documented operations only; no OpenAPI, so no operationIds exist to bind.
  mcp:
    url: https://report.improvado.io/experimental/agent/api/mcp-customer/v1/invoke/
    tools: 83 enumerated (84 advertised — see coverage.tools_count_discrepancy_note)
    gated: true
    gate: OAuth (scope mcp:customer); POST tools/list returns HTTP 401 anonymously
  graphql:
    present: false
