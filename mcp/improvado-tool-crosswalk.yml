coverage:
  tools_advertised_by_provider: 84
  tools_enumerated_in_reference: 83
  tools_count_discrepancy_note: >-
    Improvado states "84 tools" repeatedly in prose, but its own published tool reference (Appendix C)
    enumerates 83 across twelve categories whose stated per-category counts also sum to 83
    (5+5+3+9+8+4+6+7+13+3+11+9). Recorded as found rather than reconciled — the 84th tool is not named
    anywhere public, and a live authenticated tools/list would be needed to settle it.
  tools_mapped_to_rest: 27
  tools_session_only: 1
  mcp_only: 55
  accounted: 83
  distinct_rest_operations_bound: 29
  rest_documented_operations: 47
  rest_only_capabilities: 12
  openapi_operations_total: 1
  note: >-
    Counts are of DOCUMENTED operations, not spec-parsed operationIds — Improvado publishes no OpenAPI
    for the Embedded API v3. The two surfaces overlap on roughly half the ETL core and diverge
    completely at the edges: Discovery API, warehouse SQL, governance, notebooks and documents exist
    only on MCP; webhooks, workspace provisioning, template authoring and the embed iframe exist only
    on REST.
