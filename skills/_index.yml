  skills under provider_published[] are first-party work distributed as a Codex plugin alongside the
  customer MCP server; Improvado's MCP documentation tells users to install it by repo slug ("Codex
  pulls the plugin from the Improvado repository") and the repo's .codex-plugin/plugin.json declares
  author.name "Improvado", developerName "Improvado", the Improvado brand colour #FF3186 and the
  Improvado logo — which is how first-party ownership was established despite the repository sitting
  under a non-Improvado GitHub account. Names and descriptions are captured VERBATIM from each
