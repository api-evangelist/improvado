- aid: improvado:improvado-automated-recipes-api
  name: Improvado Automated Recipes API
  description: >-
    Deploy and operate automated recipes through the v3.1 API.


    An automated recipe turns a template into a SQL view in your workspace destination,

    built from the extractions the template needs.


    **Deploying a recipe takes four calls, in this order:**


    1. `GET /api/v3.1/automated-recipe-templates/` - pick a template.

    2. `POST /api/v3.1/automated-recipes/` - create the recipe. It is created empty.

    3. `PUT /api/v3.1/automated-recipes/{recipe_id}/` - supply data sources, connections
       and accounts. **This step is mandatory.**
    4. `POST /api/v3.1/automated-recipes/{recipe_id}/build/` - start the build, then poll
       `GET /api/v3.1/automated-recipes/{recipe_id}/` until `state` is `ready_to_work`
       or `failed`.

    Every path ends with a slash; a `301` means the slash is missing from your URL.

    With a bearer token the workspace is the one the token was issued for; with cookie

    authentication, send the workspace id in the `X-IM-WORKSPACE-ID` header.

    All errors use one envelope - see [Errors](/errors).


    See the [Deploying recipes](/recipes) guide for the full flow.
  humanURL: https://developers.improvado.io/api
  baseURL: https://embedded.improvado.io
  tags:
  - Automated Recipes
