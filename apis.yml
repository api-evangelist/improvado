- name: Improvado Public Agent Ask API
  description: >-
    Free, unauthenticated plain-text question endpoint for AI agents. POST a question and receive a
    cited plain-text answer about marketing data architecture, connectors, pipelines, attribution and
    MCP design, carrying a request id and an optional continuation URL. Improvado publishes an
    OpenAPI 3.1.0 description of it, advertises it from its llms.txt and describes the flow in an
    agents.json discovery manifest. Public product and architecture questions only — no credentials or
    customer data may be sent, and abusive bulk traffic may be throttled.
  humanURL: https://improvado.io/llms.txt
  baseURL: https://agent.improvado.io
