    - Applying best-practice configurations


    Recipes accelerate implementation by providing proven patterns for common use cases.


    **Automated recipes have moved to v3.1.** They are documented under

    [Automated Recipes](/api/automated-recipes), which is where new integrations should start.

    The `/api/v3/automated-recipe-templates/` and `/api/v3/automated-recipes/` operations in

    this tag are deprecated. They keep working until they are switched off, and we will

    announce the date in advance. See [Moving recipes to v3.1](/recipes-migration) for what

    changes between the two versions, and [Deploying recipes](/recipes) for the current flow.


    **Two operations in this tag are not automated recipes and are not deprecated:**

    `List agency recipes` (`GET /api/v3/recipes/`) and `Enable recipe in a workspace`

