- name: Improvado Customer MCP
  description: >-
    Hosted, remote Model Context Protocol server exposing Improvado's marketing data platform to any
    MCP client (Claude, ChatGPT/Codex, Gemini CLI, Antigravity, Cursor) as 83 published tools across
    twelve categories: warehouse SQL, live Discovery API passthrough to 1,000+ upstream ad and
    analytics platforms, ETL extract/load/run management, custom Temporal pipelines, Marketing Data
    Governance rules, AI recipes and notebooks, dashboards, documents and workspace control.
    JSON-RPC 2.0 over HTTP, gated by OAuth 2.0 (authorization code + PKCE, scope mcp:customer) against
    the customer's existing Improvado account, with workspace-scoped 15-minute sessions. The endpoint
    host is the customer's own tenant domain. Metered and sold: MCP actions per week is a priced quota
    on every plan tier including the free one.
  humanURL: https://improvado.io/docs-section-topic/improvado-mcp
  baseURL: https://report.improvado.io
