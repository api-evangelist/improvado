aid: improvado
name: Improvado
description: Improvado is a marketing intelligence and AI-agent platform that connects, extracts, transforms,
  and loads data from 876+ marketing, advertising, sales, and analytics sources into governed data pipelines,
  warehouses, and BI tools. Its Embedded API v3 (base https://embedded.improvado.io, all paths under /api/v3/)
  gives agencies and platforms programmatic, workspace-scoped control over data sources, connections and
  accounts, extraction templates and extracts, destinations, data tables, loads, automated recipes, custom
  roles, and webhook endpoints for load, transformation, and extraction lifecycle events. Authentication
  is HTTP Basic for workspace management and short-lived Bearer tokens for workspace-scoped resources.
  The platform maintains a SOC 2 / HIPAA / GDPR trust center, a public status page, a dated API changelog,
  and a responsible-disclosure security program.
