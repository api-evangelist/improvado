openapi: 3.2.0
info:
  title: Improvado Embedded API v3 Recipes API
  version: 3.0.0
  description: 'Improvado Embedded API V3 provides programmatic access to data extraction, transformation, and loading capabilities.


    ## Authentication


    This API supports multiple authentication methods depending on the endpoint:


    ### Basic Authentication

    Used for workspace-agnostic operations such as:

    - Creating access tokens (`POST /api/v3/token`)

    - Listing workspaces (`GET /api/v3/workspaces`)

    - Managing workspaces (`POST /api/v3/workspaces`, `GET /api/v3/workspaces/{id}`, `PUT /api/v3/workspaces/{id}`)

    - Getting iframe URLs (`POST /api/v3/get_iframe_url`)

    - Listing available recipes (`GET /api/v3/recipes/`)

    etc.


    **Format**: `Authorization: Basic `


    ### Bearer Token Authentication

    Used for workspace-scoped operations after obtaining a token from `/api/v3/token`. The token is scoped to a specific workspace.


    **Format**: `Authorization: Bearer `


    ### Cookie Authentication

    Alternative to Bearer token for browser-based integrations. When using cookie authentication, you must include the workspace ID in the request header.


    **Cookie**: `dts_session_id=`


    **Required Header**: `X-IM-WORKSPACE-ID: `


    ## Workspace Scoping


    Most API operations are workspace-scoped. After authenticating with Basic Auth, obtain a workspace-specific token using `POST /api/v3/token` with the desired `workspace_id`. This token provides access only to resources within that workspace, ensuring isolation between different customers or projects.


    ## Errors


    The automated recipe operations under `/api/v3.1/automated-recipe*` and

    `GET /api/v3.1/connections/{connection_id}/accounts/` return errors as

    `{"code": "...", "message": "...", "details": {...}}`. Branch on `code`, never on the

    message text. See Errors for the catalogue of codes and the shape of `details`.


    All other operations return errors as `{"detail": "error description"}`.'
servers:
- url: https://embedded.improvado.io
tags:
- name: Recipes
  x-zudoku-collapsed: true
  description: 'Work with pre-built recipes that automate common data pipeline workflows.


    Recipes are templated workflows that combine multiple API operations into reusable patterns.

    They simplify common tasks like:

    - Setting up end-to-end data pipelines (source → extract → load → destination)

    - Configuring multiple related extracts at once

    - Applying best-practice configurations


    Recipes accelerate implementation by providing proven patterns for common use cases.


    **Automated recipes have moved to v3.1.** They are documented under

    Automated Recipes, which is where new integrations should start.

    The `/api/v3/automated-recipe-templates/` and `/api/v3/automated-recipes/` operations in

    this tag are deprecated. They keep working until they are switched off, and we will

    announce the date in advance. See Moving recipes to v3.1 for what

    changes between the two versions, and Deploying recipes for the current flow.


    **Two operations in this tag are not automated recipes and are not deprecated:**

    `List agency recipes` (`GET /api/v3/recipes/`) and `Enable recipe in a workspace`

    (`POST /api/v3/workspaces/{id}/recipes`). They use Basic authentication, work with the

    recipes available to your agency rather than with automated recipes, and have no v3.1

    replacement.'
paths:
  /api/v3/workspaces/{id}/recipes:
    post:
      operationId: api_v3_workspace_enable_recipe
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl -X POST 'https://embedded.improvado.io/api/v3/workspaces/1/recipes' \\\n  -u \"$IMPROVADO_USER:$IMPROVADO_PASSWORD\" \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"recipe_id\": 1}'\n"
      summary: Enable recipe in a workspace
      description: Enables a specific recipe for a given workspace
      parameters:
      - in: path
        name: id
        description: Workspace ID
        schema:
          type: integer
        required: true
        examples:
          workspace_enable_recipe:
            value:
              id: 1
      tags:
      - Recipes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipe_id:
                  type: integer
                  description: Recipe ID
            examples:
              workspace_enable_recipe:
                value:
                  recipe_id: 1
      responses:
        '204':
          description: Recipe is enabled
        '401':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrong_auth:
                  value:
                    detail: Error Message
        '403':
          description: Recipe pipeline is disabled for agency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                recipe_pipeline_disabled:
                  value:
                    detail: Error Message
        '404':
          description: Workspace or Recipe Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                workspace_or_recipe_not_found:
                  value:
                    detail: Error Message
      security:
      - basicAuth: []
  /api/v3/recipes/:
    get:
      operationId: api_v3_recipes_list
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl 'https://embedded.improvado.io/api/v3/recipes/' \\\n  -u \"$IMPROVADO_USER:$IMPROVADO_PASSWORD\"\n"
      summary: List agency recipes
      description: Get list of recipes available for agency
      tags:
      - Recipes
      responses:
        '200':
          description: Get list of recipes available for agency
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
              examples:
                recipes_list:
                  value:
                  - id: 1
                    title: Recipe 1
                  - id: 2
                    title: Recipe 2
        '401':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrong_auth:
                  value:
                    detail: Error Message
      security:
      - basicAuth: []
  /api/v3/automated-recipe-templates/:
    get:
      deprecated: true
      operationId: api_v3_automated_recipe_templates_list
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl 'https://embedded.improvado.io/api/v3/automated-recipe-templates/' \\\n  -H \"Authorization: Bearer $TOKEN\"\n"
      summary: DEPRECATED List automated recipe templates
      description: 'Deprecated: use `GET /api/v3.1/automated-recipe-templates/`. This version stays available until it is switched off; see Moving recipes to v3.1.


        When the recipes service fails, this version answers `500` with an HTML page, and an error in the `4xx` range can arrive with a body that is not JSON. It also repeats the request to the recipes service up to three times, create included, so a create can run twice. v3.1 does neither: every error is `{code, message, details}`, and a request is repeated only when it provably never reached the service.


        Returns a paginated list of available automated recipe templates that can be used to create automated recipes.'
      tags:
      - Recipes
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Page number for pagination
        required: false
      - in: query
        name: page_size
        schema:
          type: integer
          default: 20
          maximum: 100
        description: Number of results per page (max 100)
        required: false
      - in: query
        name: search
        schema:
          type: string
        description: Search templates by name
        required: false
      - in: query
        name: data_sources
        schema:
          type: string
        description: Filter by data sources (comma-separated list, e.g., "google_analytics,facebook_ads")
        required: false
      responses:
        '200':
          description: List of automated recipe templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAutomatedRecipeTemplateList'
              examples:
                templates_list:
                  value:
                    count: 15
                    next: /api/v3/automated-recipe-templates/?page=2
                    previous: null
                    results:
                    - id: 123
                      title: Marketing Attribution Model
                      description: Multi-touch attribution analysis combining GA4, Facebook Ads, and Google Ads data
                      data_sources:
                      - name: google_analytics
                        title: Google Analytics
                      - name: facebook_ads
                        title: Facebook Ads
                      created_at: 2024-01-15 10:30:00+00:00
                      updated_at: 2024-02-20 14:45:00+00:00
                    - id: 124
                      title: E-commerce Sales Dashboard
                      description: Comprehensive sales analytics with product performance metrics
                      data_sources:
                      - name: shopify
                        title: Shopify
                      created_at: 2024-01-20 09:15:00+00:00
                      updated_at: 2024-02-18 11:20:00+00:00
        '401':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v3/automated-recipe-templates/{template_id}/:
    get:
      deprecated: true
      operationId: api_v3_automated_recipe_templates_retrieve
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl 'https://embedded.improvado.io/api/v3/automated-recipe-templates/123/' \\\n  -H \"Authorization: Bearer $TOKEN\"\n"
      summary: DEPRECATED Get automated recipe template detail
      description: 'Deprecated: use `GET /api/v3.1/automated-recipe-templates/{template_id}/`. This version stays available until it is switched off; see Moving recipes to v3.1.


        When the recipes service fails, this version answers `500` with an HTML page, and an error in the `4xx` range can arrive with a body that is not JSON. It also repeats the request to the recipes service up to three times, create included, so a create can run twice. v3.1 does neither: every error is `{code, message, details}`, and a request is repeated only when it provably never reached the service.


        Returns detailed information about a specific automated recipe template, including its tree structure and dependencies.'
      tags:
      - Recipes
      parameters:
      - in: path
        name: template_id
        schema:
          type: integer
        required: true
        description: Automated recipe template ID
        examples:
          template_detail:
            value: 123
      responses:
        '200':
          description: Automated recipe template details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomatedRecipeTemplateDetail'
              examples:
                template_detail:
                  value:
                    id: 123
                    title: Marketing Attribution Model
                    description: Multi-touch attribution analysis combining GA4, Facebook Ads, and Google Ads data
                    data_sources:
                    - name: google_analytics
                      title: Google Analytics
                    - name: facebook_ads
                      title: Facebook Ads
                    level: 0
                    children:
                    - id: 124
                      title: GA4 Base Data
                      level: 1
                      parent_id: 123
                      children: []
                    - id: 125
                      title: Facebook Ads Base Data
                      level: 1
                      parent_id: 123
                      children: []
                    dependencies_count: 2
                    output_columns:
                    - name: date
                      type: date
                      user_kind: date_key
                    - name: campaign_name
                      type: string
                      user_kind: dimension
                    - name: cost
                      type: number
                      user_kind: metric
                    created_at: 2024-01-15 10:30:00+00:00
                    updated_at: 2024-02-20 14:45:00+00:00
        '401':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    detail: Not found.
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v3/automated-recipes/:
    get:
      deprecated: true
      operationId: api_v3_automated_recipes_list
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl 'https://embedded.improvado.io/api/v3/automated-recipes/?state=Ready%20to%20work' \\\n  -H \"Authorization: Bearer $TOKEN\"\n"
      summary: DEPRECATED List automated recipes
      description: 'Deprecated: use `GET /api/v3.1/automated-recipes/`. This version stays available until it is switched off; see Moving recipes to v3.1.


        When the recipes service fails, this version answers `500` with an HTML page, and an error in the `4xx` range can arrive with a body that is not JSON. It also repeats the request to the recipes service up to three times, create included, so a create can run twice. v3.1 does neither: every error is `{code, message, details}`, and a request is repeated only when it provably never reached the service.


        Returns a paginated list of automated recipes in the workspace.'
      tags:
      - Recipes
      parameters:
      - in: query
        name: template_id
        schema:
          type: integer
        description: Filter by template ID
        required: false
      - in: query
        name: state
        schema:
          type: string
          enum:
          - Extracting Data
          - Building Dependencies
          - Ready to work
          - Failed
        description: 'Filter by recipe state. The value is matched exactly and is case-sensitive: an unrecognized value returns 200 with an empty page rather than an error, so a filter written with different casing silently reports no recipes.

          '
        required: false
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Page number for pagination
        required: false
      - in: query
        name: page_size
        schema:
          type: integer
          default: 20
          maximum: 100
        description: Number of results per page (max 100)
        required: false
      responses:
        '200':
          description: List of automated recipes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAutomatedRecipeList'
              examples:
                recipes_list:
                  value:
                    count: 3
                    next: null
                    previous: null
                    results:
                    - recipe_id: '12647075758935484548'
                      template_id: 285
                      template_title: Cross-Channel Dashboard
                      title: Cross-Channel Automated test
                      state: Ready to work
                      workspace_id: 456
                      created_at: 2025-11-17 16:09:18.754810+00:00
                      updated_at: 2025-11-17 16:11:39.756697+00:00
                    - recipe_id: '12647075758935484549'
                      template_id: 285
                      template_title: Cross-Channel Dashboard
                      title: Cross-Channel Q2 2025
                      state: Extracting Data
                      workspace_id: 456
                      created_at: 2025-04-01 09:15:00+00:00
                      updated_at: 2025-04-02 11:20:00+00:00
        '401':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      deprecated: true
      operationId: api_v3_automated_recipes_create
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl -X POST 'https://embedded.improvado.io/api/v3/automated-recipes/' \\\n  -H \"Authorization: Bearer $TOKEN\" \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"template_id\": 123, \"title\": \"Cross-Channel\"}'\n"
      summary: DEPRECATED Create automated recipe
      description: 'Deprecated: use `POST /api/v3.1/automated-recipes/`. This version stays available until it is switched off; see Moving recipes to v3.1.


        When the recipes service fails, this version answers `500` with an HTML page, and an error in the `4xx` range can arrive with a body that is not JSON. It also repeats the request to the recipes service up to three times, create included, so a create can run twice. v3.1 does neither: every error is `{code, message, details}`, and a request is repeated only when it provably never reached the service.


        Creates an automated recipe from a template. The recipe is created **empty** - no data sources, no connections, no accounts - so the next call must be PUT /api/v3/automated-recipes/{recipe_id}/.


        **Only one recipe per template per workspace.** A second create from the same template returns 400 with `existing_recipe_ids`; treat that as "already deployed" and reuse one of the returned recipes.


        **The output table name is derived from the template''s title, not from `title` in this body.** `title` names the recipe in the UI and has no effect on the table. Two deployments of the same template with different titles produce the same table name. Uniqueness of that name is scoped to (agency, workspace), so the same name repeating across workspaces is expected and correct - do not try to make table names unique across your fleet. To learn the physical name, take `datatable_id` from this response and call GET /api/v3/data-tables/{data_table_id}, then read `sql_name`.'
      tags:
      - Recipes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - template_id
              properties:
                template_id:
                  type: integer
                  description: ID of the automated recipe template
                title:
                  type: string
                  description: Recipe name. If not specified, template name is used
            examples:
              create_recipe:
                value:
                  template_id: 123
                  title: Q1 2024 Marketing Attribution
              create_recipe_no_title:
                value:
                  template_id: 123
      responses:
        '201':
          description: Automated recipe created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomatedRecipeCreateResponse'
              examples:
                recipe_created:
                  value:
                    recipe_id: '12647075758935484548'
                    template_id: 285
                    title: Cross-Channel Automated test
                    state: Extracting Data
                    datatable_id: 9876543
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomatedRecipeCreateError'
              examples:
                template_not_found:
                  value:
                    detail: Template not found or not automated
                validation_error:
                  value:
                    template_id:
                    - This field is required.
                recipe_from_template_already_exists:
                  summary: A recipe from this template already exists in this workspace
                  value:
                    detail: You already have a recipe from this template in this workspace. Use update/build to change account settings, or resetup to update the recipe from the template.
                    existing_recipe_ids:
                    - '12647075758935484548'
                table_name_already_used:
                  summary: The output table name derived from the template is taken
                  value:
                    detail: This table name is already used. Please, change the table name
                    conflicting_recipe_ids:
                    - '12647075758935484549'
        '401':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_permission:
                  value:
                    detail: You do not have permission to perform this action.
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v3/automated-recipes/{recipe_id}/:
    get:
      deprecated: true
      operationId: api_v3_automated_recipes_retrieve
