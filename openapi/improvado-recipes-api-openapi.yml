    put:
      deprecated: true
      operationId: api_v3_automated_recipes_update
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl -X PUT 'https://embedded.improvado.io/api/v3/automated-recipes/12647075758935484548/' \\\n  -H \"Authorization: Bearer $TOKEN\" \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"data_sources\": [\"facebook\"],\n        \"connections\": [\n          {\n            \"connection_id\": 69909,\n            \"connection_data_source\": \"facebook\",\n            \"accounts\": [{\"id\": 3559308, \"account_id\": \"act_750501968745425\"}]\n          }\n        ],\n        \"sync_from_date\": \"2026-01-01\"\n      }'\n"
      summary: DEPRECATED Update automated recipe configuration
      description: 'Deprecated: use `PUT /api/v3.1/automated-recipes/{recipe_id}/`. This version stays available until it is switched off; see Moving recipes to v3.1.


        When the recipes service fails, this version answers `500` with an HTML page, and an error in the `4xx` range can arrive with a body that is not JSON. It also repeats the request to the recipes service up to three times, create included, so a create can run twice. v3.1 does neither: every error is `{code, message, details}`, and a request is repeated only when it provably never reached the service.


        Supplies the configuration of an automated recipe: data sources, connections and accounts. A recipe created by POST is empty, so this call is a required step of every deployment, not an optional edit.


        **The payload is the complete configuration, and it is append-only.** Send every data source, every connection and every account the recipe should have, including the ones it already has. Sending a delta fails: removing a data source, a connection or an account that is already configured returns 400 and nothing is saved. There is no way to remove an account, a connection or a data source from a recipe through this call. If the set has to shrink, delete the recipe with DELETE /api/v3/automated-recipes/{recipe_id}/ and deploy it again from the same template.


        Returns 200 with an empty body. Read the recipe back with GET /api/v3/automated-recipes/{recipe_id}/ to confirm what was stored.'
      tags:
      - Recipes
      parameters:
      - in: path
        name: recipe_id
        schema:
          type: string
        required: true
        description: Automated recipe ID (numeric string)
        examples:
          recipe_update:
            value: '12647075758935484548'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomatedRecipeUpdateRequest'
            examples:
              update_recipe:
                value:
                  data_sources:
                  - google_analytics
                  - facebook_ads
                  connections:
                  - connection_id: 789
                    connection_data_source: google_analytics
                    accounts:
                    - id: 1
                      account_id: UA-12345678-1
                  sync_from_date: 2024-01-01
      responses:
        '200':
          description: Recipe configuration updated successfully (empty body)
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  value:
                    data_sources:
                    - This field is required.
                    connections:
                    - This field is required.
                invalid_data_source:
                  value:
                    data_sources:
                    - 'Data sources not allowed for this recipe: invalid_source'
                accounts_not_objects:
                  summary: accounts[] items must be objects, not bare identifiers
                  value:
                    connections:
                    - accounts:
                      - non_field_errors:
                        - Invalid data. Expected a dictionary, but got str.
                data_source_removed:
                  summary: A configured data source is missing from the payload
                  value:
                    data_sources:
                    - 'Cannot remove existing data sources: facebook. You can only add new data sources.'
                connection_removed:
                  summary: A configured connection is missing from the payload
                  value:
                    connections:
                    - 'Cannot remove existing connections: (connection_id=1039, data_source="google_ads_ql"). You can only add new connections.'
                account_removed:
                  summary: A configured account is missing from the payload
                  value:
                    connections:
                    - Cannot remove accounts [301010] from connection (connection_id=1039, data_source="google_ads_ql"). You can only add new accounts.
        '401':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    detail: Not found.
