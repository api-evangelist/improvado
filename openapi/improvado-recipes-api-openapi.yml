                  summary: One source has landed, the other has not
                  value:
                    ready: false
                    sources:
                    - data_source: facebook
                      table: ads_5972_facebook_all_data
                      table_exists: false
                      extraction_ids:
                      - 21996
                    - data_source: google_ads
                      table: ads_6013_google_ads_all_data
                      table_exists: true
                      extraction_ids:
                      - 22014
                no_extraction_tables:
                  summary: The recipe reads no extraction tables
                  value:
                    ready: false
                    sources: []
        '401':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
        '403':
          description: 'The embedded API is not enabled for this agency, or the recipe belongs to another workspace, or to another agency. The three answer with different `detail` strings.

