components:
  schemas:
    AutomatedRecipeUpdateRequest:
      type: object
      description: Request body for updating automated recipe configuration
      required:
      - data_sources
      - connections
      properties:
        data_sources:
          type: array
          minItems: 1
          items:
            type: string
          description: List of data source names to include
        connections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomatedRecipeConnection'
          description: List of connections with accounts
        sync_from_date:
          type: string
          format: date
          description: Start date for data synchronization (YYYY-MM-DD)
    AutomatedRecipeDetail:
      type: object
      description: Detailed automated recipe with full configuration
      properties:
        recipe_id:
          type: string
          description: Unique recipe identifier (numeric string)
        template_id:
          type: integer
          description: ID of the template this recipe was created from
        datatable_id:
          type:
          - integer
          - 'null'
          description: Associated data table ID (null if not yet created)
        title:
          type: string
          description: Recipe title
        state:
          type: string
          enum:
          - Extracting Data
          - Building Dependencies
          - Ready to work
          - Failed
          description: 'Current recipe state. `Ready to work` means the last build was built on the extractions that delivered; extractions that could not deliver on their own or in time were left out, so rows of some accounts can be missing. See Build automated recipe.

            '
        data_sources:
          type: array
          items:
            type: string
          description: List of configured data source names
        allowed_data_sources:
          type: array
          items:
            type: string
          description: List of allowed data source names for this recipe
        connections:
          type: array
          items:
            $ref: '#/components/schemas/AutomatedRecipeConnection'
          description: List of configured connections
        sync_from_date:
          type:
          - string
          - 'null'
          format: date
          description: Start date for data synchronization
        last_build_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Last time the recipe''s setup row changed. Despite the name it is not a build stamp: it moves when the configuration is written and on most build state transitions, but not when POST /build/ is accepted and not when a build failure is recorded. Do not use it to decide whether, or when, a build ran.

            '
        error:
          $ref: '#/components/schemas/AutomatedRecipeBuildError'
        created_at:
          type: string
          format: date-time
          description: Recipe creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Recipe last update timestamp
    AutomatedRecipeResetupResponse:
      type: object
      description: Response from a reset operation
      properties:
        status:
          type: string
          enum:
          - reset
          description: Reset operation status
        recipe_id:
          type: string
          description: ID of the recipe that was reset
    PaginatedAutomatedRecipeList:
      type: object
      description: Paginated list of automated recipes
      properties:
        count:
          type: integer
          description: Total number of recipes
        next:
          type:
          - string
          - 'null'
          description: URL to the next page
        previous:
          type:
          - string
          - 'null'
          description: URL to the previous page
        results:
          type: array
          items:
            $ref: '#/components/schemas/AutomatedRecipe'
    AutomatedRecipeSourceExtractions:
      type: object
      description: One extraction table an automated recipe reads, and the data source it comes from
      properties:
        data_source:
          type: string
          description: Data source name, e.g. `facebook`
        table:
          type: string
          description: Name of the extraction table in the workspace destination
        table_exists:
          type: boolean
          description: Whether that table exists in the destination right now
        extraction_ids:
          type: array
          description: 'Extractions the last build used for this data source - the ones it created and the existing ones it reused, including any it did not wait for. Repeated on every table of the same data source, and empty before the first build.

            '
          items:
            type: integer
    AutomatedRecipeBuildError:
      type:
      - object
      - 'null'
      description: 'Why the last build failed. `null` unless the most recent build failed - the field is cleared when the configuration is written, when a build starts and when a build succeeds. This is the only machine-readable place the failure reason appears: POST /build/ has already returned by the time a build fails.

        '
      properties:
        message:
          type: string
          description: Human-readable reason, stripped of internal identifiers
        stage:
          type:
          - string
          - 'null'
          enum:
          - extraction
          - transformation_build
          - final_build
          - null
          description: Which phase of the build failed. Null on failures recorded without a stage.
        data_source:
          type:
          - string
          - 'null'
          description: Always null today - the public error carries no build context. Reserved.
    AutomatedRecipeExtractions:
      type: object
      description: The extraction tables an automated recipe reads, and whether they exist yet
      properties:
        ready:
          type: boolean
          description: 'True when every table in `sources` exists in the destination. Not a sign that every account has delivered - see the recipe `state`.

            '
        sources:
          type: array
          description: 'One entry per extraction table the recipe reads, sorted by table name. A data source with more than one table appears once per table, so `data_source` is not unique - key this list by `table`. Empty when the recipe''s cells reference no extraction tables.

            '
          items:
            $ref: '#/components/schemas/AutomatedRecipeSourceExtractions'
    AutomatedRecipeCreateResponse:
      type: object
      description: Response after creating an automated recipe
      properties:
        recipe_id:
          type: string
          description: Unique recipe identifier (numeric string)
        template_id:
          type: integer
          description: ID of the template this recipe was created from
        title:
          type: string
          description: Recipe title
        state:
          type: string
          enum:
          - Extracting Data
          - Building Dependencies
          - Ready to work
          - Failed
          description: 'Initial recipe state, always "Extracting Data". It is the model default written at creation and does not mean that anything is configured or running yet.

            '
        datatable_id:
          type:
          - integer
          - 'null'
          description: 'ID of the output data table. Resolve the physical table name with GET /api/v3/data-tables/{data_table_id} rather than deriving it from the recipe title.

            '
    ErrorResponse:
      type: object
      description: Error response object
      properties:
        detail:
          type: string
          description: Error message
      examples:
      - no_auth:
          value:
            detail: You do not have permission to perform this action.
      - invalid_request:
          value:
            detail: Invalid request
      - not_uniq_name:
          value:
            detail: Workspace with this title already exists
    AutomatedRecipeTemplate:
      type: object
      description: Automated recipe template object
      properties:
        id:
          type: integer
          description: Template ID
        title:
          type: string
          description: Template title
        description:
          type: string
          description: Template description
        data_sources:
          type: array
          items:
            $ref: '#/components/schemas/AutomatedRecipeTemplateDataSource'
          description: List of data sources used by this template
        created_at:
          type: string
          format: date-time
          description: Template creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Template last update timestamp
    AutomatedRecipe:
      type: object
      description: Automated recipe object
      properties:
        recipe_id:
          type: string
          description: Unique recipe identifier (numeric string)
        template_id:
          type: integer
          description: ID of the template this recipe was created from
        template_title:
          type: string
          description: Title of the source template
        title:
          type: string
          description: Recipe title
        state:
          type: string
          enum:
          - Extracting Data
          - Building Dependencies
          - Ready to work
          - Failed
          description: 'Current recipe state. `Ready to work` means the last build was built on the extractions that delivered; extractions that could not deliver on their own or in time were left out, so rows of some accounts can be missing. See Build automated recipe.

            '
        workspace_id:
          type: integer
          description: Workspace ID
        created_at:
          type: string
          format: date-time
          description: Recipe creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Recipe last update timestamp
    AutomatedRecipeTemplateOutputColumn:
      type: object
      description: One column of the table this template produces.
      properties:
        name:
          type: string
          description: Column name in the output table
        type:
          type: string
          enum:
          - string
          - number
          - bool
          - date
          - datetime
          description: Physical column type
        user_kind:
          type: string
          enum:
          - dimension
          - metric
          - date_key
          description: 'How the column is used in reporting. Derived from `type`: string and datetime are dimensions, number and bool are metrics, date is the date key.

            '
    Recipe:
      type: object
      description: Recipe object
      properties:
        id:
          type: integer
          description: Recipe ID
        title:
          type: string
          description: Recipe title
      examples:
      - recipe:
          value:
            id: 1
            title: Recipe 1
    AutomatedRecipeTemplateDetail:
      type: object
      description: Detailed automated recipe template with tree structure
      properties:
        id:
          type: integer
          description: Template ID
        title:
          type: string
          description: Template title
        description:
          type: string
          description: Template description
        data_sources:
          type: array
          items:
            $ref: '#/components/schemas/AutomatedRecipeTemplateDataSource'
          description: List of data sources used by this template
        level:
          type: integer
          description: Depth of this template in its own tree; 0 for a template you can deploy
        children:
          type: array
          description: 'Templates this one depends on, nested recursively. A recipe created from this template builds every node in the tree.

            '
          items:
            $ref: '#/components/schemas/AutomatedRecipeTemplateTreeNode'
        output_columns:
          type:
          - array
          - 'null'
          description: 'Schema of the table this template produces, available before you deploy anything. `null` when the template''s output schema cannot be read - treat it as "unknown", not as "no columns".

            '
          items:
            $ref: '#/components/schemas/AutomatedRecipeTemplateOutputColumn'
        dependencies_count:
          type: integer
          description: Number of dependencies in the template
        created_at:
          type: string
          format: date-time
          description: Template creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Template last update timestamp
    AutomatedRecipeTemplateDataSource:
      type: object
      description: Data source reference in automated recipe template
      properties:
        name:
          type: string
          description: Data source identifier
        title:
          type: string
          description: Data source display name
    PaginatedAutomatedRecipeTemplateList:
      type: object
      description: Paginated list of automated recipe templates
      properties:
        count:
          type: integer
          description: Total number of templates
        next:
          type:
          - string
          - 'null'
          description: URL to the next page
        previous:
          type:
          - string
          - 'null'
          description: URL to the previous page
        results:
          type: array
          items:
            $ref: '#/components/schemas/AutomatedRecipeTemplate'
    AutomatedRecipeCreateError:
      type: object
      description: 'Error response of Create automated recipe. Besides `detail`, two of the failure modes return the identifiers of the objects that already hold the slot.

        '
      properties:
        detail:
          type: string
          description: Error message
        existing_recipe_ids:
          type: array
          description: 'Present when a recipe from the same template already exists in this workspace (one recipe per template per workspace). Lists the recipes that already exist - the list can hold more than one id. Treat this response as "already deployed" rather than as a failure, and reuse one of the returned recipes. The `detail` advises calling `resetup`: that is POST /api/v3/automated-recipes/{recipe_id}/resetup/, which recreates one of these recipes from the current version of the template.

            '
          items:
            type: string
        conflicting_recipe_ids:
          type: array
          description: 'Present when the output table name derived from the template is already taken in this workspace. Lists the recipes holding that name.

            '
          items:
            type: string
    AutomatedRecipeConnectionAccount:
      type: object
      description: 'One ad account inside a connection. Note that `id` is Improvado''s internal account id and is scoped to the workspace - it is not the account id of the advertising platform.

        '
      required:
      - id
      properties:
        id:
          type: integer
          minimum: 1
          description: 'Internal account id, required. Resolve it per workspace with GET /api/v3/connections/{connection_id}/accounts - the same platform account has a different `id` in every workspace. In a request body this must be an object member - sending a bare string in place of the object returns 400 "Invalid data. Expected a dictionary, but got str."

            '
        account_id:
          type: string
          description: 'External account identifier as the platform knows it, for example "act_500105056677763". Optional, and the only identifier that is stable across workspaces - join on it when you deploy one template to many workspaces.

            '
    AutomatedRecipeConnection:
      type: object
      description: Connection configuration for automated recipe
      required:
      - connection_id
      - connection_data_source
      - accounts
      properties:
        connection_id:
          type: integer
          minimum: 1
          description: 'Connection id, scoped to the workspace. The same connector has a different `connection_id` in every workspace - resolve it per workspace with GET /api/v3/datasources/{datasource_name}/connections.

            '
        connection_data_source:
          type: string
          description: Data source name for this connection
        accounts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomatedRecipeConnectionAccount'
          description: List of accounts for this connection. Must not be empty.
    AutomatedRecipeTemplateTreeNode:
      type: object
      description: 'A template in the dependency tree. The detail response is itself the root node: it carries `level` and `children` directly rather than nesting them under a wrapper.

        '
      properties:
        id:
          type: integer
          description: Template ID
        title:
          type: string
          description: Template title
        level:
          type: integer
          description: Depth in the tree, 0 for the template you requested
        parent_id:
          type: integer
          description: 'Parent template ID. Present on every node inside `children`; the root object of the detail response carries no `parent_id` key at all.

            '
        children:
          type: array
          description: Direct children of this node, nested recursively to any depth
          items:
            $ref: '#/components/schemas/AutomatedRecipeTemplateTreeNode'
    AutomatedRecipeBuildResponse:
      type: object
      description: Response from build operation
      properties:
        status:
          type: string
          enum:
          - building
          - error
          description: Build operation status
        message:
          type: string
          description: Human-readable status message
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    tokenAuth:
      type: http
      scheme: bearer
      bearerFormat: Bearer
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: dts_session_id
      description: Cookie authentication. When using this method, the HTTP_X_IM_WORKSPACE_ID header must be included with the workspace_id (integer) value.
