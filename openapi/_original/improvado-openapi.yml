  /api/v3/datasources/{datasource_name}/external-auth-links:
    post:
      operationId: api_v3_datasource_external_auth_links_create
      summary: Generate external authentication links
      description: >
        Generates one-time links that let an external user (for example, the end
        client of an agency)

        authenticate a data source connection with their own credentials and
        select which accounts to

        grant — without having access to the workspace. This is the API
        equivalent of the platform UI

        action "Request credentials from another user".


        One link is generated per email in `to_emails`; the email identifies the
        external user.

        Links are single-use, expire after 14 days, and can be revoked.


        **Who the link comes from.** An API token does not identify a person, so
        pass `requested_by`

        with the email of the user the link is sent on behalf of. That user is
        shown as the sender on

        the link page and in the invitation email, and receives the confirmation
        email once the

        external user creates the connection. `requested_by` must be an active
        user of your agency

        who is a member of the workspace or an owner of the agency; otherwise
        the request fails with

        `400` and no links are created. Without `requested_by`, the link page
        and the invitation

        show your whitelabel title, and no confirmation email is sent.


        > **Important:** Requires the agency feature flag for external
        authentication links

        > (contact Improvado to enable it). The endpoint returns `403` when the
        flag is disabled.
      tags:
        - Data source connections
      parameters:
        - in: path
          name: datasource_name
          schema:
            type: string
          required: true
          description: Data source name
          examples:
            external_auth_links_create:
              value:
                datasource_name: google_ads
            wrong_datasource_name:
              value:
                datasource_name: wrong_name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalAuthLinksCreateRequest"
            examples:
              create_links:
                value:
                  to_emails:
                    - client@example.com
                  send_email: true
              create_links_on_behalf_of_a_user:
                value:
                  to_emails:
                    - client@example.com
                  send_email: true
                  requested_by: account.manager@agency.com
      responses:
        "201":
          description: External authentication links generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalAuthLinksCreateResponse"
              examples:
                created:
                  value:
                    links:
                      - email: client@example.com
                        link: https://app.improvado.io/login#token=8f14e45fceea167a5a36dedd4bea2543
                        expires_at: 2026-07-28T12:00:00Z
                    failed_emails: []
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_email:
                  value:
                    to_emails:
                      - Enter a valid email address.
                wrong_datasource_name:
                  value:
                    detail: Data source does not exist
                requested_by_not_allowed:
                  value:
                    detail: requested_by must be an active user of this workspace or an owner of the
                      agency
                requested_by_not_an_email:
                  value:
                    requested_by:
                      - Enter a valid email address.
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
        "403":
          description: External authentication links are not enabled for this agency.
            Contact Improvado to enable the feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                feature_disabled:
                  value:
                    detail: Functionality of creating connection external auth link is not available
                      for agency
      security:
        - bearerAuth: []
        - cookieAuth: []
    get:
      operationId: api_v3_datasource_external_auth_links_list
      summary: List external authentication links
      description: >
        Lists the external authentication links generated for this data source
        in the current

        workspace, newest first. Each link carries its current status:
        `not_used`, `used`,

        `expired`, or `revoked_manually`. An unknown `datasource_name` yields an
        empty list.
      tags:
        - Data source connections
      parameters:
        - in: path
          name: datasource_name
          schema:
            type: string
          required: true
          description: Data source name
          examples:
            external_auth_links_list:
              value:
                datasource_name: google_ads
        - in: query
          name: page
          schema:
            type: integer
          required: false
          description: Page number
        - in: query
          name: page_size
          schema:
            type: integer
            default: 100
            maximum: 1000
          required: false
          description: Number of items per page (max 1000)
      responses:
        "200":
          description: External authentication links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedExternalAuthLinkList"
              examples:
                external_auth_links_list:
                  value:
                    count: 1
                    next: null
                    previous: null
                    results:
                      - id: 42
                        data_source: google_ads
                        data_source_title: Google Ads
                        status: not_used
                        created_at: 2026-07-14T12:00:00Z
                        sent_to_email: client@example.com
                        sender: user@agency.com
                        revoked_at: null
                        revoked_by: ""
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - bearerAuth: []
        - cookieAuth: []
  /api/v3/datasources/{datasource_name}/external-auth-links/{id}/revoke:
    post:
      operationId: api_v3_datasource_external_auth_links_revoke
      summary: Revoke an external authentication link
      description: >
        Revokes a not-yet-used external authentication link so it can no longer
        be used to

        authenticate. Idempotent — revoking an already-revoked link returns
        `200` with the

        existing revocation data. Returns `400` if the link was already used or
        has expired.
      tags:
        - Data source connections
      parameters:
        - in: path
          name: datasource_name
          schema:
            type: string
          required: true
          description: Data source name
          examples:
            external_auth_link_revoke:
              value:
                datasource_name: google_ads
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: External authentication link ID
          examples:
            external_auth_link_revoke:
              value:
                id: 42
      responses:
        "200":
          description: Link revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalAuthLinkListItem"
              examples:
                external_auth_link_revoke:
                  value:
                    id: 42
                    data_source: google_ads
                    data_source_title: Google Ads
                    status: revoked_manually
                    created_at: 2026-07-14T12:00:00Z
                    sent_to_email: client@example.com
                    sender: user@agency.com
                    revoked_at: 2026-07-15T09:30:00Z
                    revoked_by: user@agency.com
        "400":
          description: Link already used or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                already_used:
                  value:
                    detail: External auth link already used
                expired:
                  value:
                    detail: External auth link expired
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
        "404":
          description: Link not found — the ID does not exist within this data source and
            workspace (including an unknown `datasource_name`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  value:
                    detail: Not found.
                wrong_datasource_name:
                  value:
                    detail: Not found.
      security:
        - bearerAuth: []
        - cookieAuth: []
