        > **Important:** `event_types` must contain identifiers returned by `GET
        /api/v3/webhook_event_types/`

        > (e.g. `load_completed`, `transformation_completed`). Unknown event
        names are accepted by the

        > request but no deliveries will be sent for them — always source the
        names from the event types

        > endpoint rather than hard-coding them.
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointCreateRequest"
            examples:
              create_endpoint:
                value:
                  url: https://customer.example.com/improvado/webhooks
                  event_types:
                    - load_completed
                    - transformation_completed
      responses:
        "201":
          description: Webhook endpoint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointDetail"
              examples:
                created:
                  value:
                    id: 42
                    url: https://customer.example.com/improvado/webhooks
                    secret: 1f9e4b3a8c2d6e0f7a5b9c1d3e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f
                    status: unverified
                    consecutive_failures: 0
                    subscriptions:
                      - id: 100
                        event_type_name: load_completed
                        is_active: true
                        created_at: 2026-04-25T10:15:00Z
                      - id: 101
                        event_type_name: transformation_completed
                        is_active: true
                        created_at: 2026-04-25T10:15:00Z
                    created_at: 2026-04-25T10:15:00Z
                    updated_at: 2026-04-25T10:15:00Z
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_url:
                  value:
                    url:
                      - Enter a valid URL.
        "401":
          description: Authentication credentials were not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Embedded API is not enabled for this agency, or workspace header is
            missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
  /api/v3/webhook_endpoints/{id}/:
    get:
      operationId: api_v3_webhook_endpoints_retrieve
      summary: Get a webhook endpoint
      description: Retrieve detailed information about a webhook endpoint, including
        its current subscriptions and signing secret.
      tags:
        - Webhooks
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Webhook endpoint ID
      responses:
        "200":
          description: Webhook endpoint detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointDetail"
        "401":
          description: Authentication credentials were not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Webhook endpoint not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
    patch:
      operationId: api_v3_webhook_endpoints_partial_update
      summary: Update a webhook endpoint
      description: >
        Partially update a webhook endpoint. Either field may be omitted.


        - Setting `event_types` **replaces** the full list of subscriptions for
        this endpoint.

        - Updating either field resets the endpoint status to `unverified`; you
        must call `verify` again before the endpoint will receive events.
      tags:
        - Webhooks
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Webhook endpoint ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointUpdateRequest"
            examples:
              update_url:
                value:
                  url: https://customer.example.com/improvado/webhooks/v2
              replace_subscriptions:
                value:
                  event_types:
                    - load_completed
      responses:
        "200":
          description: Webhook endpoint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication credentials were not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Webhook endpoint not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
    delete:
      operationId: api_v3_webhook_endpoints_destroy
      summary: Delete a webhook endpoint
      description: Permanently delete a webhook endpoint and all of its subscriptions.
        Pending and in-flight deliveries for this endpoint are abandoned.
      tags:
        - Webhooks
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Webhook endpoint ID
      responses:
        "204":
          description: Deleted
        "401":
          description: Authentication credentials were not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Webhook endpoint not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
  /api/v3/webhook_endpoints/{id}/verify/:
    post:
      operationId: api_v3_webhook_endpoints_verify
      summary: Verify a webhook endpoint
      description: >
        Trigger ownership verification of the endpoint URL.


        Improvado sends a `GET` request to the endpoint URL with the headers:


        - `X-Improvado-Verify-Token` — the endpoint's signing secret

        - `X-Improvado-Challenge` — a one-time random token


        The receiver must respond with HTTP 200 and the value of
        `X-Improvado-Challenge` as the response body.

        On success, the endpoint transitions to `active`. On failure (non-200
        status, mismatching body, or

        connection error), the endpoint remains `unverified` and a 400 is
        returned.
      tags:
        - Webhooks
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Webhook endpoint ID
      responses:
        "200":
          description: Endpoint verified successfully (status is now `active`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointDetail"
        "400":
          description: Verification failed (unreachable URL, non-200 response, or
            challenge mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                challenge_mismatch:
                  value:
                    detail: Challenge response did not match
                unreachable:
                  value:
                    detail: Failed to reach endpoint. Please check the URL and try again.
                non_200_response:
                  value:
                    detail: Endpoint returned status 500, expected 200
        "401":
          description: Authentication credentials were not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Webhook endpoint not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
  /api/v3/webhook_endpoints/{id}/regenerate_secret/:
    post:
      operationId: api_v3_webhook_endpoints_regenerate_secret
      summary: Rotate the signing secret
      description: >
        Generate a new signing secret for the endpoint. The previous secret is
        invalidated immediately and

        the endpoint is reset to `unverified` status, so the endpoint must be
        re-verified before it will

        receive further events. Update your receiver to use the new secret
        before re-verification.
      tags:
        - Webhooks
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Webhook endpoint ID
      responses:
        "200":
          description: Secret rotated; the new secret is in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointDetail"
        "401":
          description: Authentication credentials were not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Webhook endpoint not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
  /api/v3/webhook_event_types/:
    get:
      operationId: api_v3_webhook_event_types_list
      summary: List available webhook event types
      description: List event types that can be subscribed to via `event_types` when
        creating or updating a webhook endpoint.
      tags:
        - Webhooks
      responses:
        "200":
          description: List of supported event types
          content:
