            template cannot be deployed. `bad_request` is the catch-all code for
            a 4xx that has no code of its own, so the same envelope can arrive
            with another 4xx status, for example 415.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                validation_error:
                  summary: A field of the body is invalid
                  value:
                    code: validation_error
                    message: The request is invalid.
                    details:
                      fields:
                        - field: title
                          code: max_length
                          message: Ensure this field has no more than 255 characters.
                malformed_request:
                  summary: The body is not valid JSON
                  value:
                    code: malformed_request
                    message: The request body is not valid JSON.
                    details: {}
                template_not_found:
                  summary: No such template for this agency
                  value:
                    code: template_not_found
