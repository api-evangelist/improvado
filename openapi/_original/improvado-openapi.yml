      summary: Get a recipe
      description: >
        Returns one recipe with the configuration it holds and what the last
        build did with it. This is the operation to poll after starting a build:
        repeat it until `state` is `ready_to_work` or `failed`.


        `ready_to_work` means built, not built completely. A build runs on the
        extractions that delivered, so check `degraded` and `sources` as well:
        `degraded: true` says something was left out, `not_delivered_reasons`
        says why in one line, and `sources` gives the breakdown per data source.
        `error` is filled in if and only if `state` is `failed`.


        A recipe that was created but never configured comes back with an empty
        `data_sources`, `last_build_at: null` and `state: extracting_data`.
        Configure it before you build it.
