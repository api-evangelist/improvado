  /api/v3.1/connections/{connection_id}/accounts/:
    get:
      operationId: api_v3_1_connection_accounts_list
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl 'https://embedded.improvado.io/api/v3.1/connections/187/accounts/?page_size=100' \
              -H "Authorization: Bearer $TOKEN"
      summary: List connection accounts (v3.1)
      description: >
        Lists the accounts of one connection in the workspace your token belongs
        to, sorted by `id`. Use it to pick the accounts a recipe extracts from.


        The `id` values returned here are the ones `PUT
        /api/v3.1/automated-recipes/{recipe_id}/` accepts in
        `connections[].accounts[]`. Only accounts with `is_active: true` can be
        used there; the others are rejected with `account_unavailable`.


        The trailing slash is mandatory on this path, unlike the v3 accounts
        operation.


        The page holds 100 accounts by default and 100 at most; `next` and
        `previous` are full v3.1 URLs.
      tags:
        - Accounts
      parameters:
        - in: path
          name: connection_id
          schema:
            type: integer
          required: true
          description: Connection identifier, as returned by the connection list.
          examples:
            connection_accounts_v31:
              value: 187
        - in: query
          name: search
          schema:
            type: string
          description: >
            Case-insensitive substring of the account title. A value made only
            of digits also matches the account whose `id` is exactly that
            number. An empty or blank value applies no filter and is not
            rejected, unlike `search` on the recipe template list.
          required: false
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: >
            Page number, starting at 1. A page beyond the last one is rejected
            with 400 `invalid_query_parameter`, not answered with an empty list.
          required: false
        - in: query
          name: page_size
          schema:
            type: integer
            default: 100
            maximum: 100
          description: >
            Accounts per page, from 1 to 100. A larger value is rejected with
            400 `invalid_query_parameter`; it is not silently capped.
          required: false
      responses:
        "200":
          description: One page of connection accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionAccountPageV31"
              examples:
                connection_accounts_page:
                  summary: Two accounts of one connection
                  value:
                    count: 2
                    next: null
                    previous: null
                    results:
                      - id: 90412
                        title: Northwind - Brand
                        connection_id: 187
                        datasource_name: facebook
                        is_active: true
                        enabled_for_embedded_extraction: true
                        currency: USD
                        additional_params: {}
