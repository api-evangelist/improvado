          source: |
            curl -X POST 'https://embedded.improvado.io/api/v3.1/automated-recipes/12647075758935484548/build/' \
              -H "Authorization: Bearer $TOKEN"
      summary: Start a recipe build
      description: >
        Starts a build of a configured recipe and answers 202 straight away with
        the recipe, whose `last_build_at` is the moment the build started. The
        request has no body.


        The build runs in the background. Poll `GET
        /api/v3.1/automated-recipes/{recipe_id}/` until `state` is
        `ready_to_work` or `failed`. There is no hard limit on how long a build
        takes, but in practice it finishes within 120 minutes; if there is still
        no outcome well after that, contact support with the `x-im-trace-id` of
        one of your requests.


        `ready_to_work` means built, not built completely: a build runs on the
        extractions that delivered, so read `degraded` and `sources` as well. A
        recipe that has not been configured with `PUT` cannot be built and
        answers 409 `recipe_not_configured`. Starting a second build while one
        is running answers 409 `build_already_running`.


        Use this operation again after a failed build, once the reason in
        `error` has been dealt with, and to pick up data that arrived late.
