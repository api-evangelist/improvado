        - description
        - is_system
        - is_internal
        - layers
        - user_count
    RoleListResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
      required:
        - roles
    RoleWriteRequest:
      type: object
      description: Payload for creating or updating a custom role.
      properties:
        title:
          type: string
          description: Role title. Must be non-empty and unique within the agency.
        description:
          type: string
          description: Optional description.
        layers:
          type: object
          description: Permissions grouped by product layer. Use codes from `GET
            /api/v3/roles/permissions`.
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - title
        - layers
    CreateRoleResponse:
      type: object
