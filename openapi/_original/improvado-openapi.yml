                    detail: You do not have permission to perform this action.
                wrong_workspace:
                  summary: The recipe is not in the workspace of the request
                  value:
                    detail: You do not have permission to read this notebook. Please contract your
                      workspace owner.
                wrong_agency:
                  summary: The recipe belongs to another agency
                  value:
                    detail: You do not have permission to edit this notebook. Please contract your
                      workspace owner.
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  value:
                    detail: Not found.
