    put:
      operationId: api_v3_1_automated_recipes_update
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X PUT 'https://embedded.improvado.io/api/v3.1/automated-recipes/12647075758935484548/' \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{
                    "data_sources": ["facebook", "google_ads"],
                    "connections": [
                      {"connection_id": 33120, "connection_data_source": "facebook",
                       "accounts": [{"id": 918204}, {"id": 918205}]},
                      {"connection_id": 33199, "connection_data_source": "google_ads",
                       "accounts": [{"id": 927710}]}
                    ],
                    "sync_from_date": "2026-01-01"
                  }'
      summary: Configure a recipe
      description: >
        Gives a recipe the data sources, connections and accounts it builds
        from. **This step is mandatory**: a recipe created through the API holds
        no configuration, and a build started before it answers 409
        `recipe_not_configured`.


        The body is the **full set**, not a delta: send every data source,
        connection and account the recipe should have, including the ones it
        already has. Take `connection_id` from `GET
        /api/v3/datasources/{datasource_name}/connections` and every account
        `id` from `GET /api/v3.1/connections/{connection_id}/accounts/` of this
        same workspace, and use only accounts with `is_active: true` - anything
        else is rejected with 400 `account_unavailable`.


        **Configuration only grows.** Data sources, connections and accounts can
        be added, and none of them can be taken away: a body that leaves one out
        is rejected with 409 and the matching `*_removal_not_allowed` code. **An
        account cannot be removed from a recipe at all**, by this operation or
        by any other, and deleting the recipe does not remove it either. If the
        data of an account has to be taken out of a result, contact support.


        A successful call answers 200 with the recipe as it now stands, so the
        response can be compared with what was sent. It changes neither `state`
        nor `error` and starts no build; `POST .../build/` does that.
      tags:
        - Automated Recipes
      parameters:
        - in: path
          name: recipe_id
          schema:
            type: string
          required: true
          description: Recipe identifier, as returned when the recipe was created. A
            string of digits.
          examples:
            recipe_configure:
              value: "12647075758935484548"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data_sources
                - connections
              properties:
                data_sources:
                  type: array
                  description: >
                    Every data source the recipe reads, by name. Cannot be
                    empty, and every name has to be one of the recipe's
                    `allowed_data_sources`. A data source already configured has
                    to stay in the list.
                  items:
                    type: string
                connections:
                  type: array
                  description: >
                    Every connection the recipe reads, with its accounts. Cannot
                    be empty. Each `connection_data_source` has to appear in
                    `data_sources`, the pair of `connection_id` and
                    `connection_data_source` has to be unique in the list, and
                    every data source added by this call needs at least one
                    connection here.
                  items:
                    type: object
                    required:
                      - connection_id
                      - connection_data_source
                      - accounts
                    properties:
                      connection_id:
                        type: integer
                        description: Connection identifier in this workspace.
                      connection_data_source:
                        type: string
                        description: Data source name of that connection, for example `facebook`.
                      accounts:
                        type: array
                        description: >
                          The accounts of that connection the recipe reads.
                          Cannot be empty. Every account already configured has
                          to stay in the list.
                        items:
                          type: object
                          required:
                            - id
                          properties:
                            id:
                              type: integer
                              description: >
                                Account identifier from `GET
                                /api/v3.1/connections/{connection_id}/accounts/`
                                of this workspace, with `is_active: true`.
                sync_from_date:
                  type:
                    - string
                    - "null"
                  format: date
                  description: >
                    The first date the recipe collects data from. Omit it or
                    send `null` to leave the date the recipe already has
                    unchanged.
            examples:
              configure_recipe:
                value:
                  data_sources:
                    - facebook
                    - google_ads
                  connections:
                    - connection_id: 33120
                      connection_data_source: facebook
                      accounts:
                        - id: 918204
                        - id: 918205
                    - connection_id: 33199
                      connection_data_source: google_ads
                      accounts:
                        - id: 927710
                  sync_from_date: 2026-01-01
              add_an_account:
                summary: Adding one account - the accounts already configured are sent again
                value:
                  data_sources:
                    - facebook
                  connections:
                    - connection_id: 33120
                      connection_data_source: facebook
                      accounts:
                        - id: 918204
                        - id: 918205
                        - id: 918301
      responses:
        "200":
          description: The recipe as it now stands, with the configuration this call saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeV31"
              examples:
                recipe_configured:
                  summary: A configured recipe that has not been built yet
                  value:
                    recipe_id: "12647075758935484548"
                    template_id: 4021
                    template_title: Paid media spend by campaign
                    title: Paid media spend by campaign
                    workspace_id: 5120
                    state: extracting_data
                    degraded: false
                    not_delivered_reasons: []
                    error: null
                    datatable_id: 88214
                    last_build_at: null
                    created_at: 2026-09-17T12:03:55Z
                    updated_at: 2026-09-17T12:09:41Z
                    data_sources:
                      - facebook
                      - google_ads
                    allowed_data_sources:
                      - facebook
                      - google_ads
                    connections:
                      - connection_id: 33120
                        connection_data_source: facebook
                        accounts:
                          - id: 918204
                          - id: 918205
                      - connection_id: 33199
                        connection_data_source: google_ads
                        accounts:
                          - id: 927710
                    sync_from_date: 2026-01-01
