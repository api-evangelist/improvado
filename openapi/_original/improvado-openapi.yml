  /api/v3.1/automated-recipes/{recipe_id}/extractions/:
    get:
      operationId: api_v3_1_automated_recipes_extractions
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl 'https://embedded.improvado.io/api/v3.1/automated-recipes/12647075758935484548/extractions/' \
              -H "Authorization: Bearer $TOKEN"
      summary: Check recipe extraction tables
      description: >
        Lists the extraction tables the recipe reads and says whether each of
        them exists in the destination of the workspace right now. The check
        runs against the destination on every call.


        This answers "were the tables created", not "is the data ready".
        Readiness is the `state` of the recipe together with `degraded` and
        `sources`; a table can exist and still hold nothing useful. A data
        source whose extractions write into more than one table appears once per
        table, so key `tables` by `table`, not by `data_source`.


        Use it when a build failed on missing data: if `all_tables_exist` is
        `false`, the extractions have not written anything yet and another build
        will fail the same way; if it is `true`, another build is worth
        starting.
      tags:
        - Automated Recipes
      parameters:
        - in: path
          name: recipe_id
          schema:
            type: string
          required: true
          description: Recipe identifier, as returned when the recipe was created. A
            string of digits.
          examples:
            recipe_extractions:
              value: "12647075758935484548"
      responses:
        "200":
          description: The extraction tables of the recipe and whether they exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeExtractionTablesV31"
              examples:
                tables_missing:
                  summary: One table is still missing, so the recipe is not ready to build
                  value:
                    all_tables_exist: false
                    tables:
                      - data_source: facebook
                        table: paid_media_spend_28340_facebook_all_data
                        table_exists: true
                        extraction_ids:
                          - 5512043
                          - 5512044
                      - data_source: google_ads
                        table: paid_media_spend_28341_google_ads_all_data
                        table_exists: false
                        extraction_ids:
