    ExtractTemplatePreviewRequest:
      type: object
      description: Request payload for extraction template data preview.
      properties:
        connection_id:
          type: integer
          description: Connection ID to use for the preview.
          examples:
            - 52955
        custom_settings:
          type: object
          additionalProperties: true
          description: Custom settings for the extraction.
          examples:
            - time_granularity: week
              week_start_day: monday
              sync_historical_data: 2025-09-27
              lookback_window: default
              custom_refresh_window: 1
              pivot: COMPANY
        fields:
          type: array
          items:
            type: string
          description: List of fields to include in the preview.
          examples:
            - - date
              - input:pivot
              - pivotValues
              - approximateMemberReach
        dynamic_fields:
          type: array
          items:
            type: string
          description: List of dynamic fields to include.
          examples:
            - []
        accounts:
          type: array
          items:
            type: string
          description: List of account IDs.
          examples:
            - - "507446188"
        custom_filters:
          nullable: true
          description: Custom filters to apply. Null if no filters.
          examples:
            - null
    ExtractTemplatePreviewResponse:
      type: object
      description: Response containing preview data for an extraction template.
      properties:
        data:
          type: object
          properties:
            dataSource:
              type: array
              description: Array of data rows returned by the preview.
              items:
                type: object
                additionalProperties: true
                properties:
                  key:
                    type: string
                description: >
                  A single data row. Contains dynamic fields depending on the
                  template configuration. The "key" property is always present.
            columns:
              type: array
              description: Column metadata describing the data fields.
              items:
                type: object
                properties:
                  title:
                    type: string
                    description: Human-readable column title.
                  dataIndex:
                    type: string
                    description: Key used to look up the value in each dataSource row.
                  key:
                    type: string
                    description: Unique column identifier.
    ExtractTemplateValidationRequest:
      type: object
      description: Request payload for extraction template settings validation.
      required:
        - accounts
      properties:
        accounts:
          type: array
          minItems: 1
          items:
            type: integer
          description: >
            Embedded account IDs to validate against the template. Must be
            non-empty and all accounts must belong to a single connection.
          examples:
            - - 100500
              - 100501
        template_settings:
          type: object
          description: Proposed template settings to validate. Optional.
          properties:
            fields:
              type: array
              items:
                type: string
              description: List of fields to validate.
              examples:
                - - date
                  - campaign.name
                  - metrics.clicks
                  - metrics.impressions
            additional_params:
              type: object
              additionalProperties: true
              description: Additional extraction parameters / custom settings.
              examples:
                - time_granularity: day
            dynamic_fields:
              type:
                - array
                - "null"
              items:
                type: string
              description: List of dynamic fields. Null if not used.
            custom_filters:
              type:
                - object
                - "null"
              additionalProperties: true
              description: Custom filters to apply. Null if no filters.
            sync_historical_data:
              type:
                - string
                - "null"
              format: date
              description: Start date for historical data backfill (ISO date format, e.g.
                "2024-01-15"). Null if not set.
    ExtractTemplateRetrieveResponse:
      type: object
      description: Compact representation of an extraction template.
      properties:
        id:
          type: integer
          description: Extraction template ID.
          examples:
            - 1
        datasource_name:
          type: string
          description: Data source name.
          examples:
            - act_on
        is_wide_template:
          type: boolean
          description: Whether the template is a wide report template.
          examples:
            - true
    ExtractTemplateValidationResponse:
      type: object
      description: Result of extraction template settings validation.
      properties:
        detail:
          type: string
          description: Validation error details. Empty string if no errors.
          examples:
            - ""
        incompatible:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: >
            Map of incompatible fields to the list of incompatibility reasons.
            Empty object if all fields are compatible.
          examples:
            - {}
    MigrateWideExtractRequest:
      type: object
      description: Request payload for migrating a wide report extract.
      required:
        - migrated_from_extraction_id
        - template_settings
      properties:
        migrated_from_extraction_id:
          type: integer
          description: ID of the source wide report extract being migrated.
          examples:
            - 1443619
        template_id:
          type: integer
          description: Template ID. Resolved from the source extract when omitted.
          examples:
            - 421
        account:
          type: integer
          description: Account ID. Resolved from the source extract when omitted.
          examples:
            - 2330268667
        data_table_title:
          type: string
          description: Title of the new data table. Generated automatically when empty.
          examples:
            - ""
        template_settings:
          type: object
          description: >
            Template settings for the new extract. May be an empty object —
            every omitted field is pre-filled from the source extract.
          properties:
            fields:
              type: array
              items:
                type: string
              description: List of fields including the changed dimensions.
              examples:
                - - date
                  - campaign.name
                  - metrics.clicks
            additional_params:
              type: object
              additionalProperties: true
              description: Additional extraction parameters.
            scheduling:
              type: array
              items:
                $ref: "#/components/schemas/Scheduling"
            sync_historical_data:
              type:
                - string
                - "null"
              description: Start date for historical data backfill (date in ISO format like
                "2025-01-01").
            dynamic_fields:
              type: array
              items:
                type: string
              description: List of dynamic fields.
            hashed_fields:
              type:
                - array
                - "null"
              items:
                type: string
              description: List of hashed fields.
            custom_filters:
              type:
                - object
                - "null"
              additionalProperties: true
              description: Custom filters to apply. Null if no filters.
    CustomSettingOptionsRequest:
      type: object
      description: Request payload for loading dynamic custom setting options.
      required:
        - template_id
        - connection_id
        - account_ids
        - custom_setting_name
      properties:
        template_id:
          type: integer
          description: Extraction template ID whose custom setting is being resolved.
          examples:
            - 10430
        connection_id:
          type: integer
          description: Connection ID used to resolve credentials and scope accounts.
          examples:
            - 20595
        account_ids:
          type: array
          minItems: 1
          description: >
            Remote account IDs from the source platform, scoped by
            `connection_id`. These are the same string account IDs used by
            extraction template preview.
          items:
            type: string
          examples:
            - - "47924620"
        custom_setting_name:
          type: string
          description: Custom setting name from the extraction template.
          examples:
            - form_guids
        search_query:
          type: string
          description: Optional case-insensitive search query applied to loaded options.
          default: ""
          examples:
            - contact
        page:
          type: integer
          minimum: 1
          description: Page number for paginated options.
          default: 1
          examples:
            - 1
        page_size:
          type: integer
          minimum: 1
          maximum: 1000
          description: Number of options to return per account.
          default: 50
          examples:
            - 50
    CustomSettingOption:
      type: object
      description: A single selectable custom setting option.
      properties:
        value:
          type: string
          description: Value that should be submitted as the custom setting value.
          examples:
            - 801130ad-d745-450a-a974-741b704cbd58
        label:
          type: string
          description: Human-readable option label.
          examples:
            - New contact us form
        description:
          type:
            - string
            - "null"
          description: Optional extra text that can be shown in the UI.
          examples:
            - HUBSPOT
    CustomSettingOptionsAccountResult:
      type: object
      description: >
        Custom setting options resolved for one account. Pagination follows the
        standard paginated-response shape (`count`, `next`, `previous`,
        `results`). Search is applied locally over the cached entity-report
        options before pagination.
      properties:
        account_id:
          type: string
          description: Remote account ID from the request.
          examples:
            - "47924620"
        count:
          type: integer
          description: Total number of options after the search filter is applied.
          examples:
            - 1
        next:
          type:
            - string
            - "null"
          description: Next page number as a string, or null if this is the last page.
          examples:
            - null
        previous:
          type:
            - string
            - "null"
          description: Previous page number as a string, or null if this is the first page.
          examples:
            - null
        results:
          type: array
          description: Page of selectable options for this account.
          items:
            $ref: "#/components/schemas/CustomSettingOption"
        search_applied:
          type: boolean
          description: Whether a non-empty search query was applied.
          examples:
            - true
    CustomSettingOptionsResponse:
      type: object
      description: Response containing dynamic custom setting options per account.
      properties:
        custom_setting_name:
          type: string
          description: Custom setting name from the request.
          examples:
            - form_guids
        results:
          type: array
          items:
            $ref: "#/components/schemas/CustomSettingOptionsAccountResult"
    Role:
      type: object
      description: Workspace role (system or agency-custom).
      properties:
        id:
          type: integer
          description: Role ID
        title:
