    post:
      operationId: api_v3_1_automated_recipes_create
      x-codeSamples:
        - lang: shell
          label: cURL
          source: >
            curl -X POST
            'https://embedded.improvado.io/api/v3.1/automated-recipes/' \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"template_id": 4021, "title": "Paid media spend by campaign"}'
      summary: Create a recipe
      description: >
        Creates a recipe from a template in the workspace the request is
        authenticated for. The recipe is created **empty** - no data sources, no
        connections, no accounts - so the next call has to be `PUT
        /api/v3.1/automated-recipes/{recipe_id}/`. Starting a build before that
        answers 409 `recipe_not_configured`.


        **One recipe per template per workspace.** A second create from the same
        template answers 409 `recipe_already_exists` and names the recipes that
        already exist. Do not create recipes from one template in one workspace
        in parallel: the second call loses the race and gets the same answer.


        `title` names the recipe and nothing else. It is optional and at most
        255 characters; if it is missing, `null`, empty or only spaces, the
        template supplies the default name. **The name of the output table is
        derived from the title of the template at the moment the recipe is
        created**, never from `title` in this body, and the recipe keeps that
        name for good: renaming the template later changes the table name only
        for recipes deployed after the rename. To read the physical name, take
        `datatable_id` from this response and call `GET
        /api/v3/data-tables/{data_table_id}`, then read `sql_name`.
      tags:
        - Automated Recipes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - template_id
              properties:
                template_id:
                  type: integer
                  description: >
                    Identifier of the template to deploy, as returned by the
                    template list. It has to belong to your agency and be
                    deployable through the API; anything else answers 400
                    `template_not_found`.
                title:
                  type:
                    - string
                    - "null"
                  maxLength: 255
                  description: >
                    Name of the recipe, at most 255 characters. Omit it, or send
                    `null`, an empty string or only spaces, to let the template
                    name the recipe. It has no effect on the name of the output
                    table.
            examples:
              create_recipe:
                value:
                  template_id: 4021
                  title: Paid media spend by campaign
              create_recipe_without_title:
                summary: Let the template supply the name
                value:
                  template_id: 4021
      responses:
        "201":
          description: >
            The recipe was created. It holds no configuration yet, so
            `data_sources`, `connections` and `sources` are empty and
            `last_build_at` is `null`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeV31"
              examples:
                recipe_created:
                  summary: A recipe as it comes back from create
                  value:
