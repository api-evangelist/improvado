  /api/v3/extract-template/{template_id}/validation/:
    post:
      operationId: api_embedded_v3_extract_template_validation_create
      summary: Validate extraction template settings
      description: >
        Validates the proposed combination of fields, custom settings and
        accounts against the given extraction template before creating or
        migrating an extract. Use this endpoint as a pre-flight check — for
        example, before creating an extract or calling the migrate-wide
        endpoint.


        Accounts are referenced by their embedded account IDs and must all
        belong to a single connection. The connection is resolved automatically
        from the provided accounts.
      tags:
        - Extraction templates
      parameters:
        - in: path
          name: template_id
          schema:
            type: integer
          required: true
          description: A unique integer value identifying this Extraction template.
          examples:
            valid:
              value: 1
      requestBody:
        description: Extraction template settings to validate
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractTemplateValidationRequest"
            examples:
              valid:
                value:
                  accounts:
                    - 100500
                    - 100501
                  template_settings:
                    fields:
                      - date
                      - campaign.name
                      - metrics.clicks
                      - metrics.impressions
                    additional_params:
                      time_granularity: day
                    dynamic_fields: []
                    custom_filters: null
                    sync_historical_data: 2024-01-15
      responses:
        "200":
          description: >
            Validation result. An empty `detail` and empty `incompatible` mean
            the settings are valid. Incompatible field combinations are returned
            in `incompatible`; other validation errors (e.g. bad custom
            settings) are returned in `detail`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTemplateValidationResponse"
              examples:
                valid:
                  value:
                    detail: ""
                    incompatible: {}
                incompatible_fields:
                  value:
                    detail: ""
                    incompatible:
                      metrics.clicks:
                        - reason1
                        - reason2
                custom_settings_error:
                  value:
                    detail: 'Got errors during validation: time_granularity got wrong value "foo"'
                    incompatible: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accounts_from_different_connections:
                  value:
                    detail: All accounts must belong to a single connection
                missing_accounts:
                  value:
                    detail: Accounts 99999999 do not exist
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  value:
                    detail: You do not have permission to perform this action.
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  value:
                    detail: Template not found
      security:
        - bearerAuth: []
        - cookieAuth: []
  /api/v3/datasources/{datasource_name}/custom_setting_options/:
    post:
      operationId: api_embedded_v3_custom_setting_options_create
      summary: Load custom setting options
      description: >
        Returns selectable options for a custom extraction setting that is
        backed by source entities. Use this endpoint when an extraction template
        exposes a `select` custom setting with dynamic `source` metadata and the
        UI needs to populate its choices for one or more accounts.

        Account IDs in the request are remote account IDs from the source
        platform (the same string IDs used by extraction template preview),
        scoped by the provided `connection_id`. Search and pagination are
        applied over the loaded option list by Improvado, so source APIs do not
        need to support filtering or paging.
      tags:
        - Extraction templates
      parameters:
        - in: path
          name: datasource_name
          schema:
            type: string
          required: true
          description: Data source name.
          examples:
            hubspot:
              value: hubspot
      requestBody:
        description: Custom setting options request.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomSettingOptionsRequest"
            examples:
              hubspot_forms:
                value:
                  template_id: 10430
                  connection_id: 20595
                  account_ids:
                    - "47924620"
                  custom_setting_name: form_guids
                  search_query: contact
                  page: 1
                  page_size: 50
      responses:
        "200":
          description: Custom setting options grouped by account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomSettingOptionsResponse"
              examples:
                hubspot_forms:
                  value:
                    custom_setting_name: form_guids
                    results:
                      - account_id: "47924620"
                        count: 1
                        next: null
                        previous: null
                        results:
                          - value: 801130ad-d745-450a-a974-741b704cbd58
                            label: New contact us form
                            description: HUBSPOT
                        search_applied: true
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bad_request:
                  value:
                    detail: Custom setting options are available only for LES templates
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  value:
                    detail: You do not have permission to perform this action.
        "408":
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                timeout:
                  value:
                    detail: Custom setting options loading timed out. Please narrow the request or
                      try again later.
      security:
        - bearerAuth: []
        - cookieAuth: []
