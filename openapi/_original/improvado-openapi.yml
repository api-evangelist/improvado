        workspace_id:
          type: integer
        workspace_title:
          type: string
      required:
        - user_id
        - name
        - email
        - workspace_id
        - workspace_title
    RoleUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/RoleUser"
      required:
        - users
    ErrorResponse:
      type: object
      description: Error response object
      properties:
        detail:
          type: string
          description: Error message
      examples:
        - no_auth:
            value:
              detail: You do not have permission to perform this action.
        - invalid_request:
            value:
              detail: Invalid request
        - not_uniq_name:
            value:
              detail: Workspace with this title already exists
    AutomatedRecipeTemplateDataSource:
      type: object
      description: Data source reference in automated recipe template
      properties:
        name:
          type: string
          description: Data source identifier
        title:
          type: string
          description: Data source display name
    AutomatedRecipeTemplate:
      type: object
      description: Automated recipe template object
      properties:
        id:
          type: integer
          description: Template ID
        title:
          type: string
          description: Template title
        description:
          type: string
          description: Template description
        data_sources:
          type: array
          items:
            $ref: "#/components/schemas/AutomatedRecipeTemplateDataSource"
          description: List of data sources used by this template
        created_at:
          type: string
          format: date-time
          description: Template creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Template last update timestamp
    PaginatedAutomatedRecipeTemplateList:
      type: object
      description: Paginated list of automated recipe templates
      properties:
        count:
          type: integer
          description: Total number of templates
        next:
          type:
            - string
            - "null"
          description: URL to the next page
        previous:
          type:
            - string
            - "null"
          description: URL to the previous page
        results:
          type: array
          items:
            $ref: "#/components/schemas/AutomatedRecipeTemplate"
    AutomatedRecipeTemplateTreeNode:
      type: object
      description: >
        A template in the dependency tree. The detail response is itself the
        root node: it carries `level` and `children` directly rather than
        nesting them under a wrapper.
      properties:
        id:
          type: integer
          description: Template ID
        title:
          type: string
          description: Template title
        level:
          type: integer
          description: Depth in the tree, 0 for the template you requested
        parent_id:
          type: integer
          description: >
            Parent template ID. Present on every node inside `children`; the
            root object of the detail response carries no `parent_id` key at
            all.
        children:
          type: array
          description: Direct children of this node, nested recursively to any depth
          items:
            $ref: "#/components/schemas/AutomatedRecipeTemplateTreeNode"
    AutomatedRecipeTemplateOutputColumn:
      type: object
      description: One column of the table this template produces.
      properties:
        name:
          type: string
          description: Column name in the output table
        type:
          type: string
          enum:
            - string
            - number
            - bool
            - date
            - datetime
          description: Physical column type
        user_kind:
          type: string
          enum:
            - dimension
            - metric
            - date_key
          description: >
            How the column is used in reporting. Derived from `type`: string and
            datetime are dimensions, number and bool are metrics, date is the
            date key.
    AutomatedRecipeTemplateDetail:
      type: object
      description: Detailed automated recipe template with tree structure
      properties:
        id:
          type: integer
          description: Template ID
        title:
          type: string
          description: Template title
        description:
          type: string
          description: Template description
        data_sources:
          type: array
          items:
            $ref: "#/components/schemas/AutomatedRecipeTemplateDataSource"
          description: List of data sources used by this template
        level:
          type: integer
          description: Depth of this template in its own tree; 0 for a template you can
            deploy
        children:
          type: array
          description: >
            Templates this one depends on, nested recursively. A recipe created
            from this template builds every node in the tree.
          items:
            $ref: "#/components/schemas/AutomatedRecipeTemplateTreeNode"
        output_columns:
          type:
            - array
            - "null"
          description: >
            Schema of the table this template produces, available before you
            deploy anything. `null` when the template's output schema cannot be
            read - treat it as "unknown", not as "no columns".
          items:
            $ref: "#/components/schemas/AutomatedRecipeTemplateOutputColumn"
        dependencies_count:
          type: integer
          description: Number of dependencies in the template
        created_at:
          type: string
          format: date-time
          description: Template creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Template last update timestamp
    AutomatedRecipe:
      type: object
      description: Automated recipe object
      properties:
        recipe_id:
          type: string
          description: Unique recipe identifier (numeric string)
        template_id:
          type: integer
          description: ID of the template this recipe was created from
        template_title:
          type: string
          description: Title of the source template
        title:
          type: string
          description: Recipe title
        state:
          type: string
          enum:
            - Extracting Data
            - Building Dependencies
            - Ready to work
            - Failed
          description: >
            Current recipe state. `Ready to work` means the last build was built
            on the extractions that delivered; extractions that could not
            deliver on their own or in time were left out, so rows of some
            accounts can be missing. See Build automated recipe.
        workspace_id:
          type: integer
          description: Workspace ID
        created_at:
          type: string
          format: date-time
          description: Recipe creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Recipe last update timestamp
    PaginatedAutomatedRecipeList:
      type: object
      description: Paginated list of automated recipes
      properties:
        count:
          type: integer
          description: Total number of recipes
        next:
          type:
            - string
            - "null"
          description: URL to the next page
        previous:
          type:
            - string
            - "null"
          description: URL to the previous page
        results:
          type: array
          items:
            $ref: "#/components/schemas/AutomatedRecipe"
    AutomatedRecipeCreateResponse:
      type: object
      description: Response after creating an automated recipe
      properties:
        recipe_id:
          type: string
          description: Unique recipe identifier (numeric string)
        template_id:
          type: integer
          description: ID of the template this recipe was created from
        title:
          type: string
          description: Recipe title
        state:
          type: string
          enum:
            - Extracting Data
            - Building Dependencies
            - Ready to work
            - Failed
          description: >
            Initial recipe state, always "Extracting Data". It is the model
            default written at creation and does not mean that anything is
            configured or running yet.
        datatable_id:
          type:
            - integer
            - "null"
          description: >
            ID of the output data table. Resolve the physical table name with
            GET /api/v3/data-tables/{data_table_id} rather than deriving it from
            the recipe title.
    AutomatedRecipeCreateError:
      type: object
      description: >
        Error response of Create automated recipe. Besides `detail`, two of the
        failure modes return the identifiers of the objects that already hold
        the slot.
      properties:
        detail:
          type: string
          description: Error message
        existing_recipe_ids:
          type: array
          description: >
            Present when a recipe from the same template already exists in this
            workspace (one recipe per template per workspace). Lists the recipes
            that already exist - the list can hold more than one id. Treat this
            response as "already deployed" rather than as a failure, and reuse
            one of the returned recipes. The `detail` advises calling `resetup`:
            that is POST /api/v3/automated-recipes/{recipe_id}/resetup/, which
            recreates one of these recipes from the current version of the
            template.
          items:
            type: string
        conflicting_recipe_ids:
          type: array
          description: >
            Present when the output table name derived from the template is
            already taken in this workspace. Lists the recipes holding that
            name.
          items:
            type: string
    AutomatedRecipeConnectionAccount:
      type: object
      description: >
        One ad account inside a connection. Note that `id` is Improvado's
        internal account id and is scoped to the workspace - it is not the
        account id of the advertising platform.
      required:
        - id
      properties:
        id:
          type: integer
          minimum: 1
          description: >
            Internal account id, required. Resolve it per workspace with GET
            /api/v3/connections/{connection_id}/accounts - the same platform
            account has a different `id` in every workspace. In a request body
            this must be an object member - sending a bare string in place of
            the object returns 400 "Invalid data. Expected a dictionary, but got
            str."
        account_id:
          type: string
          description: >
            External account identifier as the platform knows it, for example
            "act_500105056677763". Optional, and the only identifier that is
            stable across workspaces - join on it when you deploy one template
            to many workspaces.
    AutomatedRecipeConnection:
      type: object
      description: Connection configuration for automated recipe
      required:
        - connection_id
        - connection_data_source
        - accounts
      properties:
        connection_id:
          type: integer
          minimum: 1
          description: >
            Connection id, scoped to the workspace. The same connector has a
            different `connection_id` in every workspace - resolve it per
            workspace with GET
            /api/v3/datasources/{datasource_name}/connections.
        connection_data_source:
          type: string
          description: Data source name for this connection
        accounts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AutomatedRecipeConnectionAccount"
          description: List of accounts for this connection. Must not be empty.
    AutomatedRecipeBuildError:
      type:
        - object
        - "null"
      description: >
        Why the last build failed. `null` unless the most recent build failed -
        the field is cleared when the configuration is written, when a build
        starts and when a build succeeds. This is the only machine-readable
        place the failure reason appears: POST /build/ has already returned by
        the time a build fails.
      properties:
        message:
          type: string
          description: Human-readable reason, stripped of internal identifiers
        stage:
          type:
            - string
            - "null"
          enum:
            - extraction
            - transformation_build
            - final_build
            - null
          description: Which phase of the build failed. Null on failures recorded without
            a stage.
        data_source:
          type:
            - string
            - "null"
          description: Always null today - the public error carries no build context.
            Reserved.
    AutomatedRecipeDetail:
      type: object
      description: Detailed automated recipe with full configuration
      properties:
        recipe_id:
          type: string
          description: Unique recipe identifier (numeric string)
        template_id:
          type: integer
          description: ID of the template this recipe was created from
        datatable_id:
          type:
            - integer
            - "null"
          description: Associated data table ID (null if not yet created)
        title:
          type: string
          description: Recipe title
        state:
          type: string
          enum:
            - Extracting Data
            - Building Dependencies
            - Ready to work
            - Failed
          description: >
            Current recipe state. `Ready to work` means the last build was built
            on the extractions that delivered; extractions that could not
            deliver on their own or in time were left out, so rows of some
            accounts can be missing. See Build automated recipe.
        data_sources:
          type: array
          items:
            type: string
          description: List of configured data source names
        allowed_data_sources:
          type: array
          items:
            type: string
          description: List of allowed data source names for this recipe
        connections:
          type: array
          items:
            $ref: "#/components/schemas/AutomatedRecipeConnection"
          description: List of configured connections
        sync_from_date:
          type:
            - string
            - "null"
          format: date
          description: Start date for data synchronization
        last_build_at:
          type:
            - string
            - "null"
          format: date-time
          description: >
            Last time the recipe's setup row changed. Despite the name it is not
            a build stamp: it moves when the configuration is written and on
            most build state transitions, but not when POST /build/ is accepted
            and not when a build failure is recorded. Do not use it to decide
            whether, or when, a build ran.
        error:
          $ref: "#/components/schemas/AutomatedRecipeBuildError"
        created_at:
          type: string
          format: date-time
          description: Recipe creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Recipe last update timestamp
    AutomatedRecipeUpdateRequest:
      type: object
      description: Request body for updating automated recipe configuration
      required:
        - data_sources
        - connections
      properties:
        data_sources:
          type: array
          minItems: 1
          items:
            type: string
          description: List of data source names to include
        connections:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AutomatedRecipeConnection"
          description: List of connections with accounts
        sync_from_date:
          type: string
          format: date
          description: Start date for data synchronization (YYYY-MM-DD)
    AutomatedRecipeBuildResponse:
      type: object
      description: Response from build operation
      properties:
        status:
          type: string
          enum:
            - building
            - error
          description: Build operation status
        message:
          type: string
          description: Human-readable status message
    AutomatedRecipeExtractions:
      type: object
      description: The extraction tables an automated recipe reads, and whether they
        exist yet
      properties:
        ready:
          type: boolean
          description: >
            True when every table in `sources` exists in the destination. Not a
            sign that every account has delivered - see the recipe `state`.
        sources:
          type: array
          description: >
            One entry per extraction table the recipe reads, sorted by table
            name. A data source with more than one table appears once per table,
            so `data_source` is not unique - key this list by `table`. Empty
            when the recipe's cells reference no extraction tables.
          items:
            $ref: "#/components/schemas/AutomatedRecipeSourceExtractions"
    AutomatedRecipeSourceExtractions:
      type: object
      description: One extraction table an automated recipe reads, and the data source
        it comes from
      properties:
        data_source:
          type: string
          description: Data source name, e.g. `facebook`
        table:
          type: string
          description: Name of the extraction table in the workspace destination
        table_exists:
          type: boolean
          description: Whether that table exists in the destination right now
        extraction_ids:
          type: array
          description: >
            Extractions the last build used for this data source - the ones it
            created and the existing ones it reused, including any it did not
            wait for. Repeated on every table of the same data source, and empty
            before the first build.
          items:
            type: integer
    AutomatedRecipeResetupResponse:
      type: object
      description: Response from a reset operation
      properties:
        status:
          type: string
          enum:
            - reset
          description: Reset operation status
        recipe_id:
          type: string
          description: ID of the recipe that was reset
    ErrorEnvelope:
      type: object
      description: >
        The error body of every v3.1 automated recipe operation and of the v3.1
        connection accounts operation. All three fields are always present. See
        [Errors](/errors) for the full catalogue of codes.
      properties:
        code:
          type: string
          description: Machine-readable error code. Branch on this, never on the message.
        message:
          type: string
          description: Human-readable text. Wording may change; it is not part of the
            contract.
        details:
          type: object
          description: >
            Always present, always an object. Its shape depends on the code;
            codes that carry no extra data return an empty object. See
            [Errors](/errors).
      required:
        - code
        - message
        - details
      examples:
        - not_found:
            value:
              code: not_found
              message: Recipe not found.
              details: {}
        - invalid_query_parameter:
            value:
              code: invalid_query_parameter
              message: A query parameter has an invalid value.
              details:
                parameter: state
                allowed_values:
                  - extracting_data
                  - building_dependencies
                  - ready_to_work
                  - failed
    RecipeTemplateV31:
      type: object
      description: >
        A recipe template as it appears in the v3.1 template list. A template is
        the blueprint a recipe is deployed from; it belongs to your agency and
        the same `id` can be deployed in every workspace of that agency.
      properties:
        id:
          type: integer
          description: Template identifier. Pass it as `template_id` when you create a
            recipe.
        title:
          type: string
          description: >
            Template name. It can be changed in the interface, and the name in
            force when a recipe is created decides the name of that recipe's
            output table.
        description:
          type: string
          description: Template description, as entered in the interface. Can be empty.
        data_sources:
          type: array
          description: >
            Data sources this template supports. The `data_sources` you send
            when you configure a recipe must be taken from this list.
          items:
            type: object
            properties:
              name:
                type: string
                description: Data source name, for example `facebook`. Use this value in
                  requests.
              title:
                type: string
                description: Display name of the data source.
        categories:
          type: array
          description: >
            Categories the template is filed under in the interface, in display
            order. Empty when the template has none.
          items:
            type: object
            properties:
              name:
                type: string
                description: Category name.
              title:
                type: string
                description: Display name of the category.
        origin:
          type: string
          enum:
            - improvado
            - agency
          description: >
            Who the template comes from. `improvado` - a template we provide;
            `agency` - a template your agency created by promoting one of its
            own recipes. Agency templates are the ones the interface shows as
            custom. New values can be added, so tolerate unknown ones.
        build_mode:
          type: string
          enum:
            - progressive
            - atomic
          description: >
            How a recipe from this template builds when one data source delivers
            no data. `progressive` - that data source is left out, the rest is
            built and the recipe becomes `ready_to_work` with `degraded: true`;
            if every data source fails, the recipe fails. `atomic` - a single
            failing data source fails the whole recipe. In both modes individual
            accounts that did not deliver never fail the recipe on their own.
            New values can be added, so tolerate unknown ones.
        created_at:
          type: string
          format: date-time
          description: When the template was created.
        updated_at:
          type: string
          format: date-time
          description: When the template was last changed.
    RecipeTemplateDetailV31:
      type: object
      description: >
        A single recipe template with its dependency tree and the schema of the
        table it produces. Everything in the list item is here as well.
      properties:
        id:
          type: integer
          description: Template identifier. Pass it as `template_id` when you create a
            recipe.
        title:
          type: string
          description: >
            Template name. It can be changed in the interface, and the name in
            force when a recipe is created decides the name of that recipe's
            output table.
        description:
          type: string
          description: Template description, as entered in the interface. Can be empty.
        data_sources:
          type: array
          description: >
            Data sources this template supports. The `data_sources` you send
            when you configure a recipe must be taken from this list.
          items:
            type: object
            properties:
              name:
                type: string
                description: Data source name, for example `facebook`. Use this value in
                  requests.
              title:
                type: string
                description: Display name of the data source.
        categories:
          type: array
          description: >
            Categories the template is filed under in the interface, in display
            order. Empty when the template has none.
          items:
            type: object
            properties:
              name:
                type: string
                description: Category name.
              title:
                type: string
                description: Display name of the category.
        origin:
          type: string
          enum:
            - improvado
            - agency
          description: >
            Who the template comes from. `improvado` - a template we provide;
            `agency` - a template your agency created by promoting one of its
            own recipes. Agency templates are the ones the interface shows as
            custom. New values can be added, so tolerate unknown ones.
        build_mode:
          type: string
          enum:
            - progressive
            - atomic
          description: >
            How a recipe from this template builds when one data source delivers
            no data. `progressive` - that data source is left out, the rest is
            built and the recipe becomes `ready_to_work` with `degraded: true`;
            if every data source fails, the recipe fails. `atomic` - a single
            failing data source fails the whole recipe. In both modes individual
            accounts that did not deliver never fail the recipe on their own.
            New values can be added, so tolerate unknown ones.
        level:
          type: integer
          description: Depth of this template in its own tree; 0 for a template you can
            deploy.
        children:
          type: array
          description: >
            Templates this one is built on, nested to any depth. A recipe
            created from this template builds every node of the tree.
          items:
            $ref: "#/components/schemas/AutomatedRecipeTemplateTreeNode"
        dependencies_count:
          type: integer
          description: How many templates this one depends on, counted over the whole tree.
        output_columns:
          type: array
          description: >
            Columns of the table a recipe from this template produces, available
            before you deploy anything. An empty list means the schema could not
            be read - treat it as unknown, not as "no columns".
          items:
            $ref: "#/components/schemas/AutomatedRecipeTemplateOutputColumn"
        created_at:
          type: string
          format: date-time
          description: When the template was created.
        updated_at:
          type: string
          format: date-time
          description: When the template was last changed.
    RecipeTemplatePageV31:
      type: object
      description: One page of recipe templates.
      properties:
        count:
          type: integer
          description: Total number of templates matching the request.
        next:
          type:
            - string
            - "null"
          description: Full URL of the next page, or `null` on the last page.
        previous:
          type:
            - string
            - "null"
          description: Full URL of the previous page, or `null` on the first page.
        results:
          type: array
          description: Templates on this page.
          items:
            $ref: "#/components/schemas/RecipeTemplateV31"
    RecipeBuildErrorV31:
      type:
        - object
        - "null"
      description: >
        Why a build failed. On a recipe this is not `null` if and only if
        `state` is `failed`; on an entry of `sources` it is not `null` if and
        only if that entry's `status` is `failed`. Build error codes are a
        namespace of their own, separate from the codes of HTTP error responses
        - a few names appear in both. The catalogue is on the [Errors](/errors)
        page.
      properties:
        code:
          type: string
          description: >
            Machine-readable build error code, for example `no_data_delivered`
            or `sql_object_not_found`. Branch on this, never on the message. New
            codes can be added, so tolerate unknown ones.
        message:
          type: string
          description: >
            Public human-readable text: a fixed sentence for our own codes, and
            the cleaned-up message of the database for SQL failures. It never
            carries raw internal output, and its wording is not part of the
            contract.
        stage:
          type:
            - string
            - "null"
          enum:
            - extraction
            - transformation_build
            - final_build
            - null
          description: >
            Which phase of the build failed: `extraction` while data was being
            collected, `transformation_build` while an intermediate step was
            built, `final_build` while the output table was built. `null` when
            the failure was recorded without a phase.
        data_source:
          type:
            - string
            - "null"
          description: >
            The data source this failure belongs to, or `null` when it belongs
            to no single one. Inside `sources` it always matches that entry's
            `data_source`.
        occurred_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the failure was recorded, or `null` when no time was stored
            with it.
        details:
          type: object
          description: >
            Extra data for this code, always an object; `{}` for codes that
            carry none. See [Errors](/errors) for the shape per code.
    RecipeSourceV31:
      type: object
      description: >
        What the last build did with one data source of the recipe. There is one
        entry for every data source in the recipe's `data_sources`.
      properties:
        data_source:
          type: string
          description: Data source name, for example `facebook`.
        status:
          type: string
          enum:
            - queued
            - extracting
            - building
            - ready
            - failed
            - not_built
          description: >
            How this data source ended up in the last build. `queued` - waiting
            to start; `extracting` - collecting data; `building` - building its
            tables; `ready` - built; `failed` - it did not build, see `error`;
            `not_built` - it was not part of the last build, because it was
            added to the configuration afterwards or because the recipe has
            never been built. Run a build to include it. New values can be
            added, so tolerate unknown ones.
        error:
          $ref: "#/components/schemas/RecipeBuildErrorV31"
        not_delivered_count:
          type: integer
          description: >
            How many extractions of this data source did not make it into the
            last build. This is the full number; `not_delivered` lists at most
            100 of them.
        not_delivered:
          type: array
          description: >
            The extractions that did not make it into the last build, ordered by
            `account_id` and capped at 100 entries per data source. An empty
            list means everything this data source was waiting for delivered.
          items:
            type: object
            properties:
              extraction_id:
                type: integer
                description: >
                  The extraction that did not deliver. Look it up in the
                  extractions API of the same workspace.
              account_id:
                type: integer
                description: >
                  The account the extraction belongs to. This is the same `id`
                  you sent in `connections[].accounts[]` when you configured the
                  recipe.
              reason:
                type: string
                enum:
                  - connection_unavailable
                  - account_disabled
                  - permission_denied
                  - extraction_failing
                  - report_type_deprecated
                  - paused
                  - not_running
                  - timed_out
                  - unknown
                description: >
                  Why it did not deliver. `connection_unavailable` - the
                  connection has to be reconnected; `account_disabled` - the
                  account is switched off; `permission_denied` - access to the
                  account was withdrawn on the platform; `extraction_failing` -
                  the extraction keeps failing on the platform;
                  `report_type_deprecated` - the platform retired this report;
                  `paused` - the extraction is paused; `not_running` - a reused
                  extraction is not running; `timed_out` - it did not deliver
                  within the window the build waits; `unknown` - none of the
                  above. What to do about each is in [Deploying
                  recipes](/recipes). New values can be added, so tolerate
                  unknown ones.
    RecipeListItemV31:
      type: object
      description: >
        A recipe as it appears in the v3.1 recipe list. The recipe detail
        returns every field below and adds the configuration and the
        per-data-source breakdown.
      properties:
        recipe_id:
          type: string
          description: Recipe identifier. A string, even though it is made of digits.
        template_id:
          type: integer
          description: The template this recipe was created from.
        template_title:
          type: string
          description: Current name of that template.
        title:
          type: string
          description: >
            Recipe name. When you create a recipe without a title, the template
            supplies the default.
        workspace_id:
          type: integer
          description: The workspace this recipe lives in.
        state:
          type: string
          enum:
            - extracting_data
            - building_dependencies
            - ready_to_work
            - failed
          description: >
            Where the recipe stands. `extracting_data` - data is being
            collected; `building_dependencies` - the tables are being built;
            `ready_to_work` - the last build finished and the output table can
            be queried; `failed` - the last build failed, see `error`.
            `ready_to_work` means built, not built completely: it is built from
            the extractions that delivered, and how complete that is shown by
            `degraded` and `sources`. New values can be added, so tolerate
            unknown ones.
        degraded:
          type:
            - boolean
            - "null"
          description: >
            Whether the last build was incomplete. Only meaningful while `state`
            is `ready_to_work`: in every other state, a failed recipe and a
            running build included, it is `false`. `true` - the build left
            something out, either a whole data source or some extractions; see
            `not_delivered_reasons` and `sources`. `false` - everything in the
            build delivered. `null` - the completeness of the last build is
            unknown because that build ran before version 3.1.
        not_delivered_reasons:
          type: array
          description: >
            The distinct reasons behind an incomplete last build, sorted and
            deduplicated across all data sources, so that you can triage a fleet
            of recipes from the list alone. Empty when `degraded` is `false` or
            `null`.
          items:
            type: string
            enum:
              - connection_unavailable
              - account_disabled
              - permission_denied
              - extraction_failing
              - report_type_deprecated
              - paused
              - not_running
              - timed_out
              - unknown
              - source_failed
            description: >
              The same values as `sources[].not_delivered[].reason`, plus
              `source_failed`, which means a whole data source dropped out of
              the build - look at `sources[].error` for that one. What to do
              about each reason is in [Deploying recipes](/recipes). New values
              can be added, so tolerate unknown ones.
        error:
          $ref: "#/components/schemas/RecipeBuildErrorV31"
        datatable_id:
          type:
            - integer
            - "null"
          description: >
            The recipe's output data table, or `null` while none is registered.
            Resolve the physical table name with GET
            /api/v3/data-tables/{data_table_id} instead of deriving it from a
            title.
        last_build_at:
          type:
            - string
            - "null"
          format: date-time
          description: >
            When the last build of this recipe was started, no matter what
            started it. `null` means the recipe has never been built. For
            recipes last built before version 3.1 this is an approximation: the
            time the recipe record last changed, which is often the end of that
            build rather than its start.
        created_at:
          type: string
          format: date-time
          description: When the recipe was created.
        updated_at:
          type: string
          format: date-time
          description: >
            When the recipe itself last changed. It says nothing about builds -
            for those use `last_build_at` and `state`.
    RecipeV31:
      type: object
      description: >
        A single recipe with its configuration and the outcome of its last
        build. A strict superset of the list item.
      properties:
        recipe_id:
          type: string
          description: Recipe identifier. A string, even though it is made of digits.
        template_id:
          type: integer
          description: The template this recipe was created from.
        template_title:
          type: string
          description: Current name of that template.
        title:
          type: string
          description: >
            Recipe name. When you create a recipe without a title, the template
            supplies the default.
        workspace_id:
          type: integer
          description: The workspace this recipe lives in.
        state:
          type: string
          enum:
            - extracting_data
            - building_dependencies
            - ready_to_work
            - failed
          description: >
            Where the recipe stands. `extracting_data` - data is being
            collected; `building_dependencies` - the tables are being built;
            `ready_to_work` - the last build finished and the output table can
            be queried; `failed` - the last build failed, see `error`.
            `ready_to_work` means built, not built completely: it is built from
            the extractions that delivered, and how complete that is shown by
            `degraded` and `sources`. New values can be added, so tolerate
            unknown ones.
        degraded:
          type:
            - boolean
            - "null"
          description: >
            Whether the last build was incomplete. Only meaningful while `state`
            is `ready_to_work`: in every other state, a failed recipe and a
            running build included, it is `false`. `true` - the build left
            something out, either a whole data source or some extractions; see
            `not_delivered_reasons` and `sources`. `false` - everything in the
            build delivered. `null` - the completeness of the last build is
            unknown because that build ran before version 3.1.
        not_delivered_reasons:
          type: array
          description: >
            The distinct reasons behind an incomplete last build, sorted and
            deduplicated across all data sources. Empty when `degraded` is
            `false` or `null`.
          items:
            type: string
            enum:
              - connection_unavailable
              - account_disabled
              - permission_denied
              - extraction_failing
              - report_type_deprecated
              - paused
              - not_running
              - timed_out
              - unknown
              - source_failed
            description: >
              The same values as `sources[].not_delivered[].reason`, plus
              `source_failed`, which means a whole data source dropped out of
              the build - look at `sources[].error` for that one. What to do
              about each reason is in [Deploying recipes](/recipes). New values
              can be added, so tolerate unknown ones.
        error:
          $ref: "#/components/schemas/RecipeBuildErrorV31"
        datatable_id:
          type:
            - integer
            - "null"
          description: >
            The recipe's output data table, or `null` while none is registered.
            Resolve the physical table name with GET
            /api/v3/data-tables/{data_table_id} instead of deriving it from a
            title.
        last_build_at:
          type:
            - string
            - "null"
          format: date-time
          description: >
            When the last build of this recipe was started, no matter what
            started it. `null` means the recipe has never been built. For
            recipes last built before version 3.1 this is an approximation: the
            time the recipe record last changed, which is often the end of that
            build rather than its start.
        created_at:
          type: string
          format: date-time
          description: When the recipe was created.
        updated_at:
          type: string
          format: date-time
          description: >
            When the recipe itself last changed. It says nothing about builds -
            for those use `last_build_at` and `state`.
        data_sources:
          type: array
          description: >
            Data source names the recipe is configured for, sorted. Empty on a
            recipe that has been created but not configured yet.
          items:
            type: string
        allowed_data_sources:
          type: array
          description: >
            Data source names the template allows, sorted. Everything in
            `data_sources` has to come from this list.
          items:
            type: string
        connections:
          type: array
          description: >
            The connections and accounts the recipe reads. This is the full set
            the recipe holds; configuring a recipe always sends the full set,
            and nothing can be taken away from it.
          items:
            type: object
            properties:
              connection_id:
                type: integer
                description: >
                  The connection, as numbered in this workspace. The same
                  connector has a different `connection_id` in every workspace.
              connection_data_source:
                type: string
                description: Data source this connection belongs to, for example `facebook`.
              accounts:
                type: array
                description: The accounts of this connection that the recipe reads.
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: >
                        Account identifier, the one the v3.1 connection accounts
                        operation returns.
        sync_from_date:
          type: string
          format: date
          description: >
            The date the recipe collects data from. Always set in a response,
            even though it may be omitted from a configuration request.
        sources:
          type: array
          description: >
            What the last build did with each configured data source. One entry
            per name in `data_sources`.
          items:
            $ref: "#/components/schemas/RecipeSourceV31"
    RecipePageV31:
      type: object
      description: One page of recipes.
      properties:
        count:
          type: integer
          description: Total number of recipes matching the request.
        next:
          type:
            - string
            - "null"
          description: Full URL of the next page, or `null` on the last page.
        previous:
          type:
            - string
            - "null"
          description: Full URL of the previous page, or `null` on the first page.
        results:
          type: array
          description: Recipes on this page.
          items:
            $ref: "#/components/schemas/RecipeListItemV31"
    RecipeExtractionTablesV31:
      type: object
      description: >
        The extraction tables a recipe reads and whether they exist in your
        workspace destination yet. This answers "were the tables created", not
        "is the data ready".
      properties:
        all_tables_exist:
          type: boolean
          description: >
            `true` only when `tables` is not empty and every table in it exists
            right now. It does not mean the data is complete: for that read the
            recipe's `state`, `degraded` and `sources`.
        tables:
          type: array
          description: >
            One entry per extraction table the recipe reads. A data source with
            more than one table appears once per table, so key this list by
            `table`, not by `data_source`. Empty when the recipe reads no
            extraction tables yet.
          items:
            type: object
            properties:
              data_source:
                type: string
                description: Data source name, for example `facebook`.
              table:
                type: string
                description: Name of the extraction table in the workspace destination.
              table_exists:
                type: boolean
                description: Whether that table exists in the destination right now.
              extraction_ids:
                type: array
                description: >
                  The extractions the last build used for this data source - the
                  ones it created and the existing ones it reused. Empty before
                  the first build.
                items:
                  type: integer
    ConnectionAccountV31:
      type: object
      description: >
        One account of a connection in the workspace of your token. This is the
        operation to take account identifiers from when you configure a recipe.
      properties:
        id:
          type: integer
          description: >
            Account identifier. This is the only identifier a v3.1 recipe
            accepts in `connections[].accounts[].id`, and it is specific to this
            workspace.
        title:
          type: string
          description: Account name.
        connection_id:
          type: integer
          description: The connection this account belongs to.
        datasource_name:
          type: string
          description: Data source of the connection, for example `facebook`.
        is_active:
          type: boolean
          description: >
            Whether the account is switched on. Only accounts with `is_active:
            true` can be put in a recipe; the rest are rejected when you
            configure one.
        enabled_for_embedded_extraction:
          type: boolean
          description: Whether this account is enabled for extraction through the embedded
            API.
        currency:
          type:
            - string
            - "null"
          description: Currency of the account, or `null` when it has none.
        additional_params:
          type: object
          description: >
            Extra account settings, as set through the accounts update
            operation. `{}` when there are none.
        created_at:
          type: string
          format: date-time
          description: When the account was created.
        updated_at:
          type: string
          format: date-time
          description: When the account was last changed.
    ConnectionAccountPageV31:
      type: object
      description: One page of connection accounts.
      properties:
        count:
          type: integer
          description: Total number of accounts matching the request.
        next:
          type:
            - string
            - "null"
          description: Full URL of the next page, or `null` on the last page.
        previous:
          type:
            - string
            - "null"
          description: Full URL of the previous page, or `null` on the first page.
        results:
          type: array
          description: Accounts on this page.
          items:
            $ref: "#/components/schemas/ConnectionAccountV31"
    WebhookSubscription:
      type: object
      description: A subscription that links a webhook endpoint to a specific event type.
      properties:
        id:
          type: integer
          description: Subscription ID
        event_type_name:
          type: string
          description: Name of the event type this subscription receives
        is_active:
          type: boolean
          description: Whether the subscription is active
        created_at:
          type: string
          format: date-time
          description: When the subscription was created
    WebhookEndpointListItem:
      type: object
      description: Compact webhook endpoint representation used in list responses.
      properties:
        id:
          type: integer
          description: Webhook endpoint ID
        url:
          type: string
          format: uri
          description: Receiver URL
        status:
          type: string
          enum:
            - unverified
            - active
          description: >
            Endpoint lifecycle status. `unverified` endpoints do not receive
            event deliveries.
        consecutive_failures:
          type: integer
          description: Number of consecutive failed deliveries since the last successful
            delivery
        subscriptions_count:
          type: integer
          description: Number of event types this endpoint is subscribed to
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEndpointDetail:
      type: object
      description: >
        Full webhook endpoint representation, including the signing secret and
        the list of subscriptions.


        The `secret` is used to compute the `X-Improvado-Signature` header
        (HMAC-SHA256) on every event delivery

        and as the verification token during the verify flow. Treat it as
        sensitive and store it securely.
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        secret:
          type: string
          description: 64-character hex signing secret
        status:
          type: string
          enum:
            - unverified
            - active
        consecutive_failures:
          type: integer
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/WebhookSubscription"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaginatedWebhookEndpointList:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
            - string
            - "null"
        previous:
          type:
            - string
            - "null"
        results:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpointListItem"
