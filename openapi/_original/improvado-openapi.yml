                        schedules:
                          - days: 1
                            hours: 1
                            minutes: 1
                            interval: daily
                            timezone: UTC
                            lookback_window:
                              name: 1 day
                        status: active
                        last_update: 2021-01-01T00:00:00Z
                        error_text: Error text
                        uploaded_rows_count: 1
      security:
        - bearerAuth: []
        - cookieAuth: []
    post:
      parameters: []
      operationId: api_v3_load_create
      summary: Create a load
      description: >
        Creates a new load. A load creation request is composed of Data Table
        and Destination Connection data.


        **Validation rules:**

        - When `run_policy` is `"schedule"`, `schedules` must contain at least
        one entry.

        - When `run_policy` is `"after extraction"`, `schedules` must be empty
        or omitted.
      tags:
        - Loads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data_table_id
                - destination_connection_id
                - destination_table
                - run_policy
              properties:
                data_table_id:
                  type: integer
                  description: Data Table ID
                destination_connection_id:
                  type: string
                  format: uuid
                  description: Destination Connection ID (UUID)
                destination_table:
                  type: string
                  description: Destination Table
                run_policy:
                  type: string
                  enum:
                    - after extraction
                    - schedule
                  description: >
                    When the load runs:

                    - `after extraction` — runs automatically after the related
                    extract finishes.

                    - `schedule` — runs on the recurring schedule(s) defined in
                    `schedules`.
                schedules:
                  type: array
                  description: Required when `run_policy` is `schedule`. Must be empty or omitted
                    when `run_policy` is `after extraction`.
                  items:
                    $ref: "#/components/schemas/Scheduling"
                load_historical_data:
                  type: boolean
                  default: false
                  description: When `true`, the initial load run will backfill historical data for
                    the data table.
            examples:
              load_create:
                value:
                  data_table_id: 1
                  destination_connection_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  destination_table: table_1
                  run_policy: after extraction
                  load_historical_data: true
              load_create_scheduled:
                value:
                  data_table_id: 1
                  destination_connection_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  destination_table: table_1
                  run_policy: schedule
                  schedules:
                    - days: 0
                      hours: 9
                      minutes: 30
                      interval: day
                      timezone: UTC
                  load_historical_data: false
      responses:
        "200":
          description: Create a Load
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Load"
              examples:
                load_create:
                  value:
                    id: 1
                    data_table:
                      id: 1
                      title: Table 1
                      datasource_name: google_sheets
                    destination_connection:
                      id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      title: Destination Connection 1
                      destination_name: google_sheets
                    destination_table: table_1
                    run_policy: after extraction
                    schedules: []
                    status: active
                    last_update: 2021-01-01T00:00:00Z
                    error_text: ""
                    uploaded_rows_count: 0
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - bearerAuth: []
        - cookieAuth: []
