    put:
      operationId: api_v3_destination_connection_update_params
      summary: Update connection parameters
      description: >
        Update the title and/or connection parameters of an existing destination
        connection.


        `connection_params` is merged at field level: only the fields present in
        the payload are

        updated, omitted fields keep their current values. To change a single
        setting, send just

        that field — e.g. `{"connection_params": {"partition_by": "by_month"}}`.


        Notes:


        - Unknown field names are rejected with `400`.

        - Secret fields cannot be updated one at a time — if any secret field is
        present in the
          payload, all required secret fields must be sent together. For `s3` that means
          `aws_access_key_id`, `aws_secret_access_key` and `encryption_key` always travel as a
          trio (keep `encryption_key: "stub"` unless you use a customer-managed KMS key).
          Omit secret fields entirely to keep the stored values.
        - `improvado_assume_role_arn` and `improvado_assume_role_externalid` are
        managed by
          Improvado and cannot be changed through this endpoint.
        - A successful update resets the connection status and triggers a
        connection re-check.


        See the create endpoint for the full list of `connection_params` fields
        per destination.
      tags:
        - Destination connections
      parameters:
        - in: path
          name: destination_name
          schema:
            type: string
          required: true
          description: Destination name
          examples:
            destination_connection_update:
              value:
                destination_name: s3
            wrong_destination_name:
              value:
                destination_name: wrong_name
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Destination Connection ID
          examples:
            destination_connection_update:
              value:
                id: 1
            wrong_destination_name:
              value:
                id: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Connection title
                connection_params:
                  type: object
                  description: >
                    Connection params to change. Merged at field level with the
                    stored parameters — omitted fields keep their current
                    values.
            examples:
              partial_update:
                summary: Change a single parameter
                value:
                  connection_params:
                    partition_by: by_month
              s3_aws_credentials:
                summary: Rotate S3 AWS credentials
                value:
                  title: Destination Connection 1
                  connection_params:
                    connection_option: aws_credentials
                    aws_access_key_id: test
                    aws_secret_access_key: test
                    encryption_key: stub
              s3_role_chaining:
                summary: Switch S3 connection to role chaining
                value:
                  connection_params:
                    connection_option: role_chaining
                    assume_role_arn: arn:aws:iam::123456789012:role/improvado-access
              wrong_destination_name:
                value:
                  title: Destination Connection 1
                  connection_params: {}
      responses:
        "200":
          description: Update a Connection
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                wrong_destination_name:
                  value:
                    detail: Invalid request
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - bearerAuth: []
        - cookieAuth: []
