openapi: 3.1.1
info:
  title: Improvado Embedded API v3
  version: 3.0.0
  description: >
    Improvado Embedded API V3 provides programmatic access to data extraction,
    transformation, and loading capabilities.


    ## Authentication


    This API supports multiple authentication methods depending on the endpoint:


    ### Basic Authentication

    Used for workspace-agnostic operations such as:

    - Creating access tokens (`POST /api/v3/token`)

    - Listing workspaces (`GET /api/v3/workspaces`)

    - Managing workspaces (`POST /api/v3/workspaces`, `GET
    /api/v3/workspaces/{id}`, `PUT /api/v3/workspaces/{id}`)

    - Getting iframe URLs (`POST /api/v3/get_iframe_url`)

    - Listing available recipes (`GET /api/v3/recipes/`)

    etc.


    **Format**: `Authorization: Basic <base64(username:password)>`


    ### Bearer Token Authentication

    Used for workspace-scoped operations after obtaining a token from
    `/api/v3/token`. The token is scoped to a specific workspace.


    **Format**: `Authorization: Bearer <token>`


    ### Cookie Authentication

    Alternative to Bearer token for browser-based integrations. When using
    cookie authentication, you must include the workspace ID in the request
    header.


    **Cookie**: `dts_session_id=<session_token>`


    **Required Header**: `X-IM-WORKSPACE-ID: <workspace_id>`


    ## Workspace Scoping


    Most API operations are workspace-scoped. After authenticating with Basic
    Auth, obtain a workspace-specific token using `POST /api/v3/token` with the
    desired `workspace_id`. This token provides access only to resources within
    that workspace, ensuring isolation between different customers or projects.


    ## Errors


    The automated recipe operations under `/api/v3.1/automated-recipe*` and

    `GET /api/v3.1/connections/{connection_id}/accounts/` return errors as

    `{"code": "...", "message": "...", "details": {...}}`. Branch on `code`,
    never on the

    message text. See [Errors](/errors) for the catalogue of codes and the shape
    of `details`.


    All other operations return errors as `{"detail": "error description"}`.
servers:
  - url: https://embedded.improvado.io
tags:
  - name: Authentication
    description: >
      Authentication and authorization endpoints for the Improvado Embedded API.


      Authentication supports Basic Auth (username:password) for initial token
      creation, then Bearer tokens for workspace-scoped operations.
  - name: Data sources
    x-zudoku-collapsed: true
    description: >
      Browse and configure available data sources for extraction.


      Data sources represent the marketing platforms, advertising networks,
      analytics tools, and other systems

      from which Improvado can extract data (e.g., Google Ads, Facebook Ads,
      Salesforce).
  - name: Data source connections
    x-zudoku-collapsed: true
    description: >
      Manage connections to data sources for authentication and data access.


      Connections handle authentication with data sources and maintain the
      credentials needed for data extraction.

      Connections are typically created through the iframe UI, where users can:

      - Provide username/password credentials

      - Complete OAuth flows

      - Configure additional connection parameters


      Connection lifecycle:

      1. Create connection via iframe (provides OAuth or credential input)

      2. Validate connection status

      3. Use connection to create extracts

      4. Monitor connection health and refresh tokens as needed
  - name: Accounts
    x-zudoku-collapsed: true
    description: >
      Manage connection accounts from which data is extracted.


      Accounts represent specific accounts within a data source platform.

      Each account is associated with a connection and can have multiple
      extracts configured to pull data from it.
  - name: Extraction templates
    x-zudoku-collapsed: true
    description: >
      Work with predefined templates that define what data to extract from a
      data source.


      Extract templates are blueprints that specify:

      - Available fields from a data source

      - Default extraction settings and parameters

      - Supported date ranges and filters


      Global templates are created and maintained by Improvado. When you create
      an extract, you select a template

      and optionally customize its settings for your specific use case.
  - name: Extracts
    x-zudoku-collapsed: true
    description: >
      Create and manage data extraction orders that pull data from connected
      sources.


      An extract represents a configured instance of data extraction with
      specific settings:

      - Which connection and account to extract from

      - Which extract template to use

      - Custom field selections and filters

      - Schedule and date range configuration

      - Where to store the extracted data (data table)


      Extract workflow:

      1. Create extract with desired configuration

      2. Extraction runs automatically on schedule or on-demand

      3. Data is stored in the associated data table

      4. Monitor extraction status and history
  - name: Data tables
    x-zudoku-collapsed: true
    description: >
      Manage data tables where extracted data is stored and organized.


      Data tables serve as centralized storage for extracted data. All
      extractions created from the same extract template

      are stored in the same data table, providing a unified view of your data.
      Data tables are also used as sources

      when configuring loads to destinations.
  - name: Destinations
    x-zudoku-collapsed: true
    description: >
      Manage available destination options where Improvado can load your data.


      Destinations represent the target systems where extracted and transformed
      data is loaded, including:

      - Data warehouses (Snowflake, BigQuery, Redshift)

      - Databases (PostgreSQL, MySQL)

      - File storage (S3, Google Cloud Storage)

      - Business intelligence tools
  - name: Destination connections
    x-zudoku-collapsed: true
    description: >
      Configure and manage connections to destinations for data loading.


      Destination connections define how and where data should be loaded within
      a destination system.

      They include:

      - Authentication credentials for the destination

      - Target configuration (database, schema, table naming patterns)

      - Load behavior settings (append, replace, upsert)

      - Path and formatting rules


      Destination connections are created and modified through the iframe UI to
      securely handle credentials.
  - name: Loads
    x-zudoku-collapsed: true
    description: >
      Configure and manage data loading from data tables to destinations.


      Load orders define the rules and settings for how data moves from
      Improvado's data tables

      to your destination systems. This includes:

      - Source data table selection

      - Destination connection and target location

      - Load schedule and frequency

      - Data transformation and mapping rules

      - Load mode (full refresh, incremental, etc.)


      Loads ensure your data is automatically synchronized from Improvado to
      your destination on the schedule you define.
  - name: iframe
    x-zudoku-collapsed: true
    description: >
      Generate secure iframe URLs for embedded UI components.


      iframe endpoints provide secure, embeddable UI components for:

      - Creating and managing data source connections (OAuth flows, credential
      input)

      - Configuring destination connections

      - Managing connection settings and permissions


      These IFrames handle sensitive operations like authentication in a secure,
      pre-built UI that you can

      embed directly into your application.
  - name: Roles
    x-zudoku-collapsed: true
    description: >
      Manage custom workspace roles and inspect the available permission
      catalog.


      Each agency ships with a fixed set of system roles (Workspace Admin,
      Editor, Viewer, Data Manager,

      Data Load Manager, Data Analyst). On top of these you can define **custom
      roles** scoped to the

      agency and assign them to users in any workspace.


      Capabilities:

      - List system + custom roles (each role carries its assigned
      `user_count`).

      - Fetch the curated permission catalog: a stable, ordered list of product
      layers with
        permissions, including human-readable `title` and `description` for each entry.
      - Create, rename, edit, and delete custom roles. System roles are
      read-only.

      - List users currently assigned to a role for impact preview.


      Delete semantics: deleting a custom role atomically reassigns every user
      holding it to the

      system **Viewer** role; the response returns `reassigned_users_count`.


      All Roles endpoints require an agency-chief Basic Auth credential and the
      `can_use_embedded_api`

      flag enabled for the agency.
  - name: Workspaces
    x-zudoku-collapsed: true
    description: >
      Manage workspaces that provide isolated environments for organizing
      resources.


      Workspaces are fundamental to multi-tenancy in Improvado's Embedded API.
      Each workspace provides complete

      isolation of resources including connections, extracts, data tables, and
      loads.


      Use workspaces to:

      - Separate resources for different customers or projects

      - Maintain data isolation and security boundaries

      - Control access through workspace-scoped tokens

      - Organize resources by environment (dev, staging, production)


      **Important**: Access tokens are scoped to a specific workspace. A token
      for one workspace cannot access

      resources in another workspace, ensuring strict isolation between tenants.
  - name: Recipes
    x-zudoku-collapsed: true
    description: >
      Work with pre-built recipes that automate common data pipeline workflows.


      Recipes are templated workflows that combine multiple API operations into
      reusable patterns.

      They simplify common tasks like:

      - Setting up end-to-end data pipelines (source → extract → load →
      destination)

      - Configuring multiple related extracts at once

      - Applying best-practice configurations


      Recipes accelerate implementation by providing proven patterns for common
      use cases.


      **Automated recipes have moved to v3.1.** They are documented under

      [Automated Recipes](/api/automated-recipes), which is where new
      integrations should start.

      The `/api/v3/automated-recipe-templates/` and `/api/v3/automated-recipes/`
      operations in

      this tag are deprecated. They keep working until they are switched off,
      and we will

      announce the date in advance. See [Moving recipes to
      v3.1](/recipes-migration) for what

      changes between the two versions, and [Deploying recipes](/recipes) for
      the current flow.


      **Two operations in this tag are not automated recipes and are not
      deprecated:**

      `List agency recipes` (`GET /api/v3/recipes/`) and `Enable recipe in a
      workspace`

      (`POST /api/v3/workspaces/{id}/recipes`). They use Basic authentication,
      work with the

      recipes available to your agency rather than with automated recipes, and
      have no v3.1

      replacement.
  - name: Automated Recipes
    x-zudoku-collapsed: true
    description: >
      Deploy and operate automated recipes through the v3.1 API.


      An automated recipe turns a template into a SQL view in your workspace
      destination,

      built from the extractions the template needs.


      **Deploying a recipe takes four calls, in this order:**


      1. `GET /api/v3.1/automated-recipe-templates/` - pick a template.

      2. `POST /api/v3.1/automated-recipes/` - create the recipe. It is created
      empty.

      3. `PUT /api/v3.1/automated-recipes/{recipe_id}/` - supply data sources,
      connections
         and accounts. **This step is mandatory.**
      4. `POST /api/v3.1/automated-recipes/{recipe_id}/build/` - start the
      build, then poll
         `GET /api/v3.1/automated-recipes/{recipe_id}/` until `state` is `ready_to_work`
         or `failed`.

      Every path ends with a slash; a `301` means the slash is missing from your
      URL.

      With a bearer token the workspace is the one the token was issued for;
      with cookie

      authentication, send the workspace id in the `X-IM-WORKSPACE-ID` header.

      All errors use one envelope - see [Errors](/errors).


      See the [Deploying recipes](/recipes) guide for the full flow.
  - name: Webhooks
    x-zudoku-collapsed: true
    description: >
      Manage webhook endpoints that receive event notifications from Improvado.


      Webhooks let your application react to platform events (extraction
      completion, load completion, etc.)

      in near real time, without polling. Each endpoint is workspace-scoped and
      subscribes to one or more

      event types.


      Lifecycle:

      1. **Register** an endpoint with the URL of your receiver and the event
      types you care about.
         Improvado returns an `id` and a `secret`, and the endpoint is created in `unverified` status.
      2. **Verify** ownership by calling the verify action. Improvado sends a
      GET request to your URL with
         `X-Improvado-Verify-Token` and `X-Improvado-Challenge` headers. Your receiver must respond with HTTP 200
         and the challenge value as the response body. After successful verification the endpoint moves to `active`.
      3. **Receive events.** Improvado POSTs JSON payloads `{id, type,
      timestamp, data}` to your URL.
         Each request is signed with HMAC-SHA256 in the `X-Improvado-Signature` header (using the endpoint's
         secret) and includes `X-Improvado-Idempotency-Key` for safe retry handling.
      4. **Rotate the secret** at any time. Rotation invalidates the previous
      secret immediately and resets the
         endpoint to `unverified` until you re-verify.

      Failed deliveries are retried up to four times with backoff `[0s, 2s, 5s,
      10s]`. Receivers should aim to

      respond within a few seconds and return 2xx for successful processing.
paths:
  /api/v3/token:
    post:
      operationId: api_v3_token_create
      summary: Create a token
      description: Creates and returns new access token for operating against
        workspace resources.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id:
                  type: integer
                  description: Workspace ID
            examples:
              token_create:
                value:
                  workspace_id: 1
              wrong_credentials:
                value:
                  wrong_field: value
      responses:
        "200":
          description: Create a Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Token
              examples:
                token_create:
                  value:
                    token: token
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                wrong_credentials:
                  value:
                    detail: Invalid credentials
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - basicAuth: []
  /api/v3/workspaces:
    get:
      operationId: api_v3_workspaces_list
      summary: List workspaces
      description: Get a list of workspaces
      tags:
        - Workspaces
      responses:
        "200":
          description: Get a list of Workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkspaceList"
              examples:
                workspaces_list:
                  value:
                    count: 2
                    next: null
                    previous: null
                    results:
                      - id: 1
                        title: Workspace 1
                      - id: 2
                        title: Workspace 2
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - basicAuth: []
    post:
      operationId: api_v3_workspaces_create
      summary: Create a workspace
      description: Create a workspace
      tags:
        - Workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Workspace title
            examples:
              workspace_create:
                value:
                  title: Workspace 1
      responses:
        "201":
          description: Create a Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
              examples:
                workspace_create:
                  value:
                    id: 1
                    title: Workspace 1
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - basicAuth: []
  /api/v3/workspaces/{id}:
    get:
      operationId: api_v3_workspaces_retrieve
      summary: Get a workspace
      description: Get a workspace
      parameters:
        - in: path
          name: id
          description: Workspace ID
          schema:
            type: integer
          required: true
          examples:
            workspace_retrieve:
              value:
                id: 1
      tags:
        - Workspaces
      responses:
        "200":
          description: Get a Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
              examples:
                workspace_retrieve:
                  value:
                    id: 1
                    title: Workspace 1
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - basicAuth: []
    put:
      operationId: api_v3_workspaces_update
      summary: Update a workspace
      description: Update a workspace
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Workspace ID
          examples:
            workspace_update:
              value: 1
            missing_title:
              value: 1
            not_uniq_name:
              value: 1
      tags:
        - Workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Workspace title
            examples:
              workspace_update:
                value:
                  title: Workspace 1
              missing_title:
                value:
                  wrong_field: Workspace 1
              not_uniq_name:
                value:
                  title: Workspace 1
      responses:
        "200":
          description: Update a Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
              examples:
                workspace_update:
                  value:
                    id: 1
                    title: Workspace 1
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_title:
                  value:
                    detail: Invalid request
                not_uniq_name:
                  value:
                    detail: Workspace with this title already exists
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - basicAuth: []
  /api/v3/workspaces/{id}/dashboards:
    get:
      operationId: api_v3_workspaces_dashboards_list
      summary: List workspace dashboards
      description: Get a list of available dashboards for a given workspace. Only
        returns dashboards with TYPE=DATA. Only includes dashboards with enabled
        recipes for the specified workspace.
      parameters:
        - in: path
          name: id
          description: Workspace ID
          schema:
            type: integer
          required: true
          examples:
            workspace_dashboards_list:
              value:
                id: 1
      tags:
        - Workspaces
      responses:
        "200":
          description: Get a list of available dashboards for a given workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dashboard"
              examples:
                dashboards_list:
                  value:
                    - dashboard_id: 02299ae0-425f-4e67-b88f-d75d4d039f04
                      title: Cross Channel Dashboard
                      data_name: cross_channel
                    - dashboard_id: 11111ae0-425f-44w2-b88f-d75d4d039f04
                      title: Joined Ads Dashboard
                      data_name: joined_ads
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                wrong_auth:
                  value:
                    detail: Error Message
        "404":
          description: Workspace Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                workspace_not_found:
                  value:
                    detail: Error Message
      security:
        - basicAuth: []
  /api/v3/workspaces/{id}/recipes:
    post:
      operationId: api_v3_workspace_enable_recipe
      x-codeSamples:
        - lang: shell
          label: cURL
          source: >
            curl -X POST
            'https://embedded.improvado.io/api/v3/workspaces/1/recipes' \
              -u "$IMPROVADO_USER:$IMPROVADO_PASSWORD" \
              -H 'Content-Type: application/json' \
              -d '{"recipe_id": 1}'
      summary: Enable recipe in a workspace
      description: Enables a specific recipe for a given workspace
      parameters:
        - in: path
          name: id
          description: Workspace ID
          schema:
            type: integer
          required: true
          examples:
            workspace_enable_recipe:
              value:
                id: 1
      tags:
        - Recipes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipe_id:
                  type: integer
                  description: Recipe ID
            examples:
              workspace_enable_recipe:
                value:
                  recipe_id: 1
      responses:
        "204":
          description: Recipe is enabled
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                wrong_auth:
                  value:
                    detail: Error Message
        "403":
          description: Recipe pipeline is disabled for agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                recipe_pipeline_disabled:
                  value:
                    detail: Error Message
        "404":
          description: Workspace or Recipe Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                workspace_or_recipe_not_found:
                  value:
                    detail: Error Message
      security:
        - basicAuth: []
  /api/v3/get_iframe_url:
    post:
      operationId: api_v3_get_iframe_url
      summary: Get iframe URL
      description: |
        Iframe allows to embed Improvado’s mechanism of creating datasource and destination connections in a safe way (including credentials passing). Datasources and destinations have different connection flows and attributes, Improvado handles this and has embedded all supported flows into iframe. In order to create a new connection within Improvado; call Get iframe url API, embed the iframe into your website so your customers can sign in to a datasource or setup destination connection parameters. After that you will be able to extract and load data using created connections.

        ### Account selection

        By default the iframe creates the connection as soon as the user authorizes, and that connection syncs every account the credentials give access to.

        Append `show_account_selection=True` to the returned URL to split the flow into two steps instead:

        1. **Authorization** — the user signs in to the data source. No connection is created yet.
        2. **Account selection** — the accounts reachable with those credentials are listed, and the user either syncs all of them or picks specific ones. The connection is created from that choice.

        The `ConnectionCreated` message is posted to the parent window only after the second step, so the connection always exists by the time your page is notified.

        Add the parameter yourself — this endpoint does not emit it:

        ```
        https://embedded.improvado.io/api/v3/iframe/?code=<str>&type=datasource&name=jira&show_account_selection=True
        ```

        Not every data source can list accounts before the connection exists. Where it cannot, the iframe falls back to the default single-step flow and the parameter has no effect.

        ### Authentication method

        Some data sources offer more than one way to authenticate, for example OAuth through Improvado's app and OAuth through your own app ("Bring Your Own App"). When a data source has several methods, the iframe shows a chooser above the authorization form, with the data source's default method preselected. Each method has its own form fields and OAuth flow.

        Append `use_default_auth=True` to the returned URL to hide the chooser and always use the default method:

        ```
        https://embedded.improvado.io/api/v3/iframe/?code=<str>&type=datasource&name=spotify_ads&use_default_auth=True
        ```

        Data sources with a single method never show the chooser, with or without the parameter.
      tags:
        - iframe
      parameters:
        - in: query
          name: show_connectors_list
          schema:
            type: boolean
          description: Shows list of connected connections in iframe (optional parameter)
          required: false
          examples:
            get_iframe_url:
              value:
                show_connectors_list: true
        - in: query
          name: show_datasources
          schema:
            type: boolean
          description: Shows list of all available data sources for connection (optional
            parameter)
          required: false
          examples:
            get_iframe_url:
              value:
                show_datasources: true
        - in: query
          name: show_accounts
          schema:
            type: boolean
          description: Allows to open page for each connection and enable/disable accounts
            within (optional parameter)
          required: false
          examples:
            get_iframe_url:
              value:
                show_accounts: true
        - in: query
          name: show_accounts_only_on_auth
          schema:
            type: boolean
          description: Automatically opens page for a connection after authorization. Only
            works if `show_accounts=False`. (optional parameter)
          required: false
          examples:
            get_iframe_url:
              value:
                show_accounts_only_on_auth: true
        - in: query
          name: use_default_auth
          schema:
            type: boolean
          description: Hides the authentication method chooser and always uses the data
            source's default method. See "Authentication method" above.
            (optional parameter)
          required: false
          examples:
            get_iframe_url:
              value:
                use_default_auth: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id:
                  type: integer
                  description: Workspace ID
                type:
                  type: string
                  description: defines whether you want to create a destination connection or
                    datasource connection. Allowed values are destination or
                    datasource (optional parameter)
                name:
                  type: string
                  description: string identifier of datasource or destination you want to connect
                    to (optional parameter)
            examples:
              get_iframe_url:
                value:
                  workspace_id: 1
                  type: datasource
                  name: google_sheets
              bad_request:
                value:
                  workspace_id: 1
                  type: wrong_type
                  name: non-existing datasource
      responses:
        "200":
          description: Get iframe URL
          content:
            application/json:
              schema:
