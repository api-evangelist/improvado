    Scheduling:
      type: object
      description: Scheduling object
      properties:
        days:
          type: integer
          minimum: 0
          description: >
            Day offset within the interval, starting from 0. The valid range
            depends on `interval`:

            - `hour`, `day` — must be 0

            - `week` — 0–6 (day of week)

            - `month` — 0–30 (day of month)
        hours:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour at which the run will start (0–23)
        minutes:
          type: integer
          minimum: 0
          maximum: 59
          description: Minute of hour at which the run will start (0–59)
        interval:
          type: string
          enum:
            - hour
            - day
            - week
            - month
          description: |
            Frequency at which the run will be performed:
            - `hour` — every hour
            - `day` — once per day
            - `week` — once per week
            - `month` — once per month
        timezone:
          type: string
          default: UTC
          description: IANA timezone name (e.g. `UTC`, `America/New_York`) the schedule is
            interpreted in.
        recurrence:
          type: integer
          default: 1
          description: How often the schedule repeats within the interval. Defaults to 1.
        lookback_window:
          type: object
          description: >
            Defines the period data will be extracted for. Applies to extract
            schedules only — ignored for load schedules.
          properties:
            name:
              type: string
              enum:
                - default
                - live
                - max
              description: |
                Lookback window preset:
                - `default` — past 30 days from the day of extract
                - `live` — past 1 day from the day of extract
                - `max` — past 60 days from the day of extract
      examples:
        - scheduling:
            value:
              days: 1
              hours: 1
              minutes: 1
              interval: day
              timezone: UTC
              lookback_window:
                name: default
    Field:
      type: object
      description: Field object
      properties:
        title:
          type: string
          description: Field title
        name:
          type: string
          description: Field name
        user_kind:
          type: string
          description: Field kind
        user_type:
          type: string
          description: Field type
        selected:
          type: boolean
          description: Is the field selected
        can_edit:
          type: boolean
          description: Can the field be edited
        sql_name:
          type: string
          description: Sql Name of a Field
        format:
          type: string
          description: >
            Hint on how the value is meant to be rendered — not a storage
            contract. Metrics fall back to `float` whenever a data source does
            not declare a format explicitly, so `float` does not imply the value
            is fractional, and no decimal precision is guaranteed: values are
            passed through exactly as the data source returns them, without
            rounding. New formats may be added over time, so treat an
            unrecognised value as an unformatted string rather than failing.
          enum:
            - string
            - float
            - integer
            - iso_8601_date
            - currency
            - percent
            - duration
            - url
            - image_url
          examples:
            - float
        is_dynamic:
          type: boolean
          description: Is the field dynamic
      examples:
