    post:
      operationId: api_v3_destination_connection_create
      summary: Create a connection
      description: >
        Create a destination connection of a given type.


        The set of `connection_params` fields depends on the destination. For
        `s3`:


        - `connection_option` — authentication method: `aws_credentials`
        (default), `bucket_policy`, or `role_chaining`

        - `aws_access_key_id`, `aws_secret_access_key` — AWS credentials;
        required only for `aws_credentials` (secret fields)

        - `assume_role_arn` — customer IAM role ARN; required only for
        `role_chaining`

        - `improvado_assume_role_arn`, `improvado_assume_role_externalid` —
        managed by Improvado and returned read-only; use them to build the trust
        policy on the customer side for `role_chaining`

        - `aws_default_region` — AWS region code, e.g. `eu-west-1`

        - `bucket_name`, `folder`, `filename` — target location; `filename`
        supports templates like `{{ filename }}-{{ YYYY }}-{{ MM }}-{{ DD }}`

        - `file_format` (`parquet` | `csv` | `csv_gzip` | `csv_gz` | `json` |
        `json_gzip` | `json_gz` | `avro`), `separator`, `partition_by` (`by_day`
        | `by_month`)

        - `max_file_size_mb` — optional chunking limit (45–100000); requires
        `{{chunk_id}}` in `filename` and `file_format: parquet`

        - `encryption` (`no_storage_encryption` | `sse_s3` | `sse_kms` |
        `sse_kms_with_customer_managed_key`), `encryption_key` — required secret
        field: the KMS key id when using `sse_kms_with_customer_managed_key`,
        the literal placeholder `stub` for every other encryption option

        - `use_load_by_accounts` — split delivered files by account
      tags:
        - Destination connections
      parameters:
        - in: path
          name: destination_name
          schema:
            type: string
          required: true
          description: Destination name
          examples:
            destination_connection_create:
              value:
                destination_name: google_sheets
            wrong_destination_name:
              value:
                destination_name: wrong_name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Connection title
                create_load_for_new_tables:
                  type: boolean
                  description: Create load for new tables
                destination_name:
                  type: string
                  description: Destination name
                connection_params:
                  type: object
                  description: Connection params
            examples:
              s3_aws_credentials:
                summary: S3 with AWS credentials
                value:
                  title: Destination Connection 1
                  create_load_for_new_tables: true
                  destination_name: s3
                  connection_params:
                    connection_option: aws_credentials
                    aws_access_key_id: test
                    aws_secret_access_key: test
                    aws_default_region: eu-west-1
                    bucket_name: test-bucket
                    folder: test-folder
                    filename: "{{ filename }}-{{ YYYY }}-{{ MM }}-{{ DD }}"
                    file_format: parquet
                    separator: ","
                    partition_by: by_day
                    encryption: sse_s3
                    encryption_key: stub
                    use_load_by_accounts: false
              s3_role_chaining:
                summary: S3 with cross-account IAM role chaining
                value:
                  title: Destination Connection 2
                  create_load_for_new_tables: true
                  destination_name: s3
                  connection_params:
                    connection_option: role_chaining
                    assume_role_arn: arn:aws:iam::123456789012:role/improvado-access
                    aws_default_region: eu-west-1
                    bucket_name: test-bucket
                    folder: test-folder
                    filename: "{{ filename }}-{{ YYYY }}-{{ MM }}-{{ DD }}"
                    file_format: parquet
                    separator: ","
                    partition_by: by_day
                    encryption: sse_s3
                    encryption_key: stub
                    use_load_by_accounts: false
              wrong_destination_name:
                value:
                  title: Destination Connection 1
                  create_load_for_new_tables: true
                  destination_name: wrong_name
                  connection_params: {}
      responses:
        "201":
          description: Create a Connection
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                wrong_destination_name:
                  value:
                    detail: Invalid request
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - bearerAuth: []
        - cookieAuth: []
