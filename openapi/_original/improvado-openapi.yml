    ExternalAuthLinksCreateRequest:
      type: object
      required:
        - to_emails
      properties:
        to_emails:
          type: array
          minItems: 1
          maxItems: 100
          description: >
            Email addresses of the external users to generate links for. One
            link is generated

            per email; the email identifies the external user.
          items:
            type: string
            format: email
        send_email:
          type: boolean
          default: true
          description: >
            When `true` (default), Improvado also emails the generated link to
            each recipient.

            Set to `false` to deliver the links yourself.
        requested_by:
          type: string
          format: email
          description: >
            Email of the user the links are sent on behalf of. Must be an active
            user of your agency

            who is a member of the workspace or an owner of the agency; any
            other value is rejected

            with `400`. The user is shown as the sender on the link page and in
            the invitation email,

            and receives the confirmation email once the connection is created.
            The confirmation is

            skipped if the user has lost access to the workspace by then.


            When omitted, the link page and the invitation show your whitelabel
            title instead of a

            person, and no confirmation email is sent.
          examples:
            - account.manager@agency.com
    ExternalAuthLink:
      type: object
      description: A generated external authentication link
      properties:
        email:
          type: string
          format: email
          description: Email of the external user the link was generated for
        link:
          type: string
          format: uri
          description: One-time authentication link to share with the external user
        expires_at:
          type: string
          format: date-time
          description: Timestamp when the link expires (14 days after creation)
      required:
        - email
        - link
        - expires_at
    ExternalAuthLinkListItem:
      type: object
      description: An external authentication link with its current status
      properties:
        id:
          type: integer
          description: External authentication link ID
        data_source:
          type: string
          description: Data source name
        data_source_title:
          type: string
          description: Human-readable data source title
        status:
          type: string
          enum:
            - not_used
            - used
            - expired
            - revoked_manually
          description: Current status of the link
        created_at:
          type: string
          format: date-time
          description: When the link was generated
        sent_to_email:
          type: string
          format: email
          description: Email of the external user the link was generated for
        sender:
          type: string
          format: email
          description: Email of the user who generated the link
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the link was revoked, if it was
        revoked_by:
          type: string
          description: Email of the user who revoked the link; empty string if not revoked
    PaginatedExternalAuthLinkList:
      type: object
      properties:
        count:
          type: integer
          description: Number of external authentication links
        next:
          type: string
          description: URL to the next page
        previous:
          type: string
          description: URL to the previous page
        results:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAuthLinkListItem"
    ExternalAuthLinksCreateResponse:
      type: object
      properties:
        links:
          type: array
          description: Generated links, one per successfully processed email
          items:
            $ref: "#/components/schemas/ExternalAuthLink"
        failed_emails:
          type: array
          description: Emails for which link creation failed
          items:
            type: string
            format: email
      required:
        - links
        - failed_emails
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    tokenAuth:
      type: http
      scheme: bearer
      bearerFormat: Bearer
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: dts_session_id
      description: Cookie authentication. When using this method, the
        HTTP_X_IM_WORKSPACE_ID header must be included with the workspace_id
        (integer) value.
