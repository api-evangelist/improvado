        Triggers the build process for an automated recipe. The recipe will transition through states (Extracting Data -> Building Dependencies -> Ready to work or Failed).

        A 200 confirms that the build was started, not that it will succeed. The output table name is checked again for every table the recipe creates, immediately before each one is created, so a name that was free at start can be taken by the time the build reaches it. Such a failure arrives asynchronously: the recipe moves to `Failed` and the reason is in the `error` field of GET /api/v3/automated-recipes/{recipe_id}/.

        The build waits for the extractions of the recipe and turns `Ready to work` on the ones that delivered. An extraction counts as delivered once one of its runs has completed, while the historical backfill may still be loading. Extractions that cannot deliver on their own - paused, or reused by a rebuild with nothing running - are not waited for, and the others only up to a limit; the ones left out can be missing from the output. A build with nothing to build from - no extraction delivered, or none for one extract template - fails.
      tags:
        - Recipes
      parameters:
        - in: path
          name: recipe_id
          schema:
            type: string
          required: true
          description: Automated recipe ID (numeric string)
          examples:
            build_recipe:
              value: "12647075758935484548"
      responses:
        "200":
          description: Build started successfully
          content:
            application/json:
              schema:
