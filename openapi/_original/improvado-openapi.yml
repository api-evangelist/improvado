      description: >-
        Allows to manually run data load into customer’s destination.

        Optionally provide `date_from` and `date_to` in the request body to run
        the load

        for a specific date range. Both fields must be provided together.

        Date range is ignored for loads by accounts.
      tags:
        - Loads
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Load ID
          examples:
            load_run:
              value:
                id: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date_from:
                  type: string
                  format: date
                  description: Start date for the load run (YYYY-MM-DD). Must be used together
                    with date_to.
                  examples:
                    - 2024-01-01
                date_to:
                  type: string
                  format: date
                  description: End date for the load run (YYYY-MM-DD). Must be used together with
                    date_from.
                  examples:
                    - 2024-01-31
            examples:
              with_date_range:
                summary: Run load for a specific date range
                value:
                  date_from: 2024-01-01
                  date_to: 2024-01-31
              without_date_range:
                summary: Run load without date range (default behavior)
                value: {}
      responses:
        "204":
          description: Run a Load
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
