              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEventType"
              examples:
                event_types_list:
                  value:
                    - event_name: load_completed
                    - event_name: load_started
                    - event_name: transformation_completed
                    - event_name: transformation_started
                    - event_name: extraction_created
                    - event_name: extraction_paused
        "401":
          description: Authentication credentials were not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
  /api/v3/roles/:
    get:
      operationId: api_v3_roles_list
      summary: List roles
      description: >
        Returns every role visible to the agency: non-internal system roles

        (Workspace Admin, Editor, Viewer, etc.) plus all agency-scoped custom
        roles.

        Each entry carries `user_count` — the number of users currently assigned
        to that role.
      tags:
        - Roles
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
              examples:
                roles_list:
                  value:
                    roles:
                      - id: 12
                        title: Workspace Admin
                        description: Full access across all product layers, including admin actions.
                        is_system: true
                        is_internal: false
                        user_count: 4
                        layers:
                          extract:
                            - view
                            - create
                            - update
                            - delete
                          admin:
                            - view
                            - create
                            - update
                            - delete
                            - manage_roles
                            - manage_users
                      - id: 87
                        title: Marketing Analyst
                        description: Builds marketing reports and dashboards.
                        is_system: false
                        is_internal: false
                        user_count: 5
                        layers:
                          dashboards:
                            - view
                            - create
                            - edit
                          extract:
                            - view
        "401":
          description: Authentication credentials were not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Agency does not have embedded API enabled, or caller is not an
            agency chief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - basicAuth: []
    post:
      operationId: api_v3_roles_create
      summary: Create a custom role
      description: >
        Creates a new agency-scoped custom role. The role's title must be unique
        within the agency

        and every `(layer, permission)` pair must come from the catalog (`GET
        /api/v3/roles/permissions`).
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleWriteRequest"
            examples:
              create_role:
                value:
                  title: Marketing Analyst
                  description: Builds marketing reports and dashboards.
                  layers:
                    dashboards:
                      - view
                      - create
                      - edit
                    extract:
                      - view
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRoleResponse"
              examples:
                created:
                  value:
                    id: 87
        "400":
          description: Invalid payload (empty title, unknown layer/permission, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A role with the same title already exists in this agency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - basicAuth: []
  /api/v3/roles/permissions:
    get:
      operationId: api_v3_roles_permissions_catalog
      summary: Permissions catalog
      description: >
        Curated catalog of product layers and the permissions that can be
        granted on each.

        Stable display order; `title`/`description` are human-readable and safe
        to render directly.
      tags:
        - Roles
      responses:
        "200":
          description: Catalog of layers and permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionsCatalogResponse"
              examples:
                catalog:
                  value:
                    layers:
                      - code: extract
                        title: Extract
                        description: Extracting data from connected sources.
                        permissions:
                          - code: view
                            title: View Extract
                            description: See extract resources without modifying them.
                          - code: create
                            title: Create in Extract
                            description: Create new extract resources.
                      - code: admin
                        title: Admin
                        description: "Workspace administration: users, roles, billing visibility."
                        permissions:
                          - code: manage_roles
                            title: Manage roles
                            description: Create, edit, and delete custom roles for the workspace.
        "401":
          description: Authentication credentials were not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - basicAuth: []
  /api/v3/roles/{role_id}:
    get:
      operationId: api_v3_roles_retrieve
      summary: Get a role
      description: >
        Returns one role. Visible to the agency only if it's a non-internal
        system role

        or an agency-scoped custom role belonging to the calling agency.
      tags:
        - Roles
      parameters:
        - in: path
          name: role_id
          required: true
          description: Role ID
          schema:
            type: integer
      responses:
        "200":
          description: Role detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - basicAuth: []
    patch:
      operationId: api_v3_roles_partial_update
      summary: Update a custom role
      description: >
        Update an agency-scoped custom role's title, description, and permission
        set.

        System roles are read-only and cannot be modified.
      tags:
        - Roles
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleWriteRequest"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: System roles cannot be modified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another role in this agency already uses this title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - basicAuth: []
    delete:
      operationId: api_v3_roles_destroy
      summary: Delete a custom role
      description: >
        Delete an agency-scoped custom role. **Users currently assigned to it
        are atomically

        reassigned to the system Viewer role**; the response returns how many
        were moved.

        System roles cannot be deleted.
      tags:
        - Roles
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role deleted; affected users reassigned to Viewer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRoleResponse"
              examples:
                deleted:
                  value:
                    reassigned_users_count: 5
        "403":
          description: System roles cannot be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - basicAuth: []
  /api/v3/roles/{role_id}/users:
    get:
      operationId: api_v3_roles_users_list
      summary: List users assigned to a role
      description: >
        Returns the users currently holding the role, with their workspace
        assignment.

        Useful for impact preview before editing or deleting the role.
      tags:
        - Roles
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Users assigned to the role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleUsersResponse"
              examples:
                users:
                  value:
                    users:
                      - user_id: 42
                        name: Anna Petrova
                        email: anna.petrova@example.com
                        workspace_id: 1
                        workspace_title: Marketing
                      - user_id: 51
                        name: Ben Carter
                        email: ben.carter@example.com
                        workspace_id: 2
                        workspace_title: Sales Ops
        "404":
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - basicAuth: []
components:
  parameters:
    WorkspaceIdHeader:
      name: X-IM-WORKSPACE-ID
      in: header
      description: Workspace ID headers is required when using cookie authentication
      required: false
      schema:
        type: integer
  schemas:
    Workspace:
      type: object
      description: Workspace object
      properties:
        id:
          type: integer
          description: Workspace ID
        title:
          type: string
          description: Workspace title
      examples:
        - workspace:
            value:
              id: 1
              title: Workspace 1
    PaginatedWorkspaceList:
      type: object
      properties:
        count:
          type: integer
          description: Number of workspaces
        next:
          type: string
          description: URL to the next page
        previous:
          type: string
          description: URL to the previous page
        results:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
      examples:
        - workspaces_list:
            value:
              count: 2
              next: null
              previous: null
              results:
                - id: 1
                  title: Workspace 1
                - id: 2
                  title: Workspace 2
    Recipe:
      type: object
      description: Recipe object
      properties:
        id:
          type: integer
          description: Recipe ID
        title:
          type: string
          description: Recipe title
      examples:
        - recipe:
            value:
              id: 1
              title: Recipe 1
    Dashboard:
      type: object
      description: Dashboard object
      properties:
        dashboard_id:
          type: string
          description: Dashboard ID
        title:
          type: string
          description: Dashboard title
        data_name:
          type: string
          description: Dashboard Data Type
      examples:
        - dashboard:
            value:
              dashboard_id: 02299ae0-425f-4e67-b88f-d75d4d039f04
              title: Cross Channel Dashboard
              data_name: cross_channel
    DataSource:
      type: object
      description: Data source object
      properties:
        name:
          type: string
          description: string identifier of datasource
        title:
          type: string
          description: Data source title
        icons:
          type: object
          properties:
            res_300x200:
              type: string
              description: URL to the 300x200 icon
            res_40x40:
              type: string
              description: URL to the 40x40 icon
            res_20x20:
              type: string
              description: URL to the 20x20 icon
        categories:
          type: array
          items:
            type: string
          description: List of categories that the data source belongs to
      examples:
        - datasource:
            value:
              name: google_sheets
              title: Google Sheets
              icons:
                res_300x200: https://example.com/icon_300x200.png
                res_40x40: https://example.com/icon_40x40.png
                res_20x20: https://example.com/icon_20x20.png
              categories:
                - Google
                - Spreadsheets
    PaginatedDataSourceList:
      type: object
      properties:
        count:
          type: integer
          description: Number of datasources
        next:
          type: string
          description: URL to the next page
        previous:
          type: string
          description: URL to the previous page
        results:
          type: array
          items:
            $ref: "#/components/schemas/DataSource"
      examples:
        - datasources_list:
            value:
              count: 2
              next: null
              previous: null
              results:
                - name: google_sheets
                  title: Google Sheets
                  icons:
                    res_300x200: https://example.com/icon_300x200.png
                    res_40x40: https://example.com/icon_40x40.png
                    res_20x20: https://example.com/icon_20x20.png
                - name: google_ads
                  title: Google Ads
                  icons:
                    res_300x200: https://example.com/icon_300x200.png
                    res_40x40: https://example.com/icon_40x40.png
                    res_20x20: https://example.com/icon_20x20.png
    Connection:
      type: object
      description: Connection object
      properties:
        id:
          type: integer
          description: Connection ID
        uid:
          type: string
          description: Connection UID
        title:
          type: string
          description: Connection title
        datasource_name:
          type: string
          description: Data source name
        status:
          type: string
          description: Connection status
        created_at:
          type: string
          description: Connection creation date
        updated_at:
          type: string
          description: Connection update date
        accounts_number:
          type: integer
          description: Total number of accounts available on this connection (excluding
            accounts disabled on the data source side).
        enabled_for_extraction_accounts_number:
          type: integer
          description: Number of accounts on this connection that are selected for
            extraction. Use this to detect connections that have no accounts
            enabled and prompt the user to select at least one before setting up
            extractions or loads.
        accounts_status:
          type: string
          description: Accounts status
        update_accounts_last_successed:
          type: string
          description: Last successful accounts update date
        update_accounts_was_successfull:
          type: boolean
          description: Was the last accounts update successful
      examples:
        - connection:
            value:
              id: 1
              uid: 12345678-1234-5678-1234-567812345678
              title: Connection 1
              datasource_name: google_sheets
              status: active
              created_at: 2021-01-01T00:00:00Z
              updated_at: 2021-01-01T00:00:00Z
              accounts_number: 5
              enabled_for_extraction_accounts_number: 3
              accounts_status: active
              update_accounts_last_successed: 2021-01-01T00:00:00Z
              update_accounts_was_successfull: true
    PaginatedConnectionsList:
      type: object
      description: connection list
      properties:
        count:
          type: integer
          description: Number of connections
        next:
          type: string
          description: URL to the next page
        previous:
          type: string
          description: URL to the previous page
        results:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
      examples:
        - connections_list:
            value:
              count: 2
              next: null
              previous: null
              results:
                - id: 1
                  uid: 12345678-1234-5678-1234-567812345678
                  title: Connection 1
                  datasource_name: google_sheets
                  status: active
                  created_at: 2021-01-01T00:00:00Z
                  updated_at: 2021-01-01T00:00:00Z
                  accounts_number: 5
                  enabled_for_extraction_accounts_number: 3
                  accounts_status: active
                  update_accounts_last_successed: 2021-01-01T00:00:00Z
                  update_accounts_was_successfull: true
                - id: 2
                  uid: 12345678-1234-5678-1234-567812345678
                  title: Connection 2
                  datasource_name: google_ads
                  status: active
                  created_at: 2021-01-01T00:00:00Z
                  updated_at: 2021-01-01T00:00:00Z
                  accounts_number: 4
