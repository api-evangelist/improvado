  /api/v3/extracts/migrate-wide:
    post:
      operationId: api_v3_extract_migrate_wide
      summary: Migrate a wide report extract
      description: >
        Migrates a wide report extract with changed dimensions to a new extract
        with a new data table. The new extract is linked to the source extract
        and the source extract is paused; its data and data table remain
        queryable. Every omitted `template_settings` field is pre-filled from
        the source extract, so only the settings being changed need to be
        passed. `template_id` and `account` are resolved from the source extract
        when omitted; a data table title is generated when `data_table_title` is
        empty.
      tags:
        - Extracts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrateWideExtractRequest"
            examples:
              extract_migrate_wide:
                value:
                  template_id: 421
                  account: 2330268667
                  migrated_from_extraction_id: 1443619
                  data_table_title: ""
                  template_settings:
                    fields:
                      - date
                      - campaign.name
                      - metrics.clicks
              minimal:
                value:
                  migrated_from_extraction_id: 1443619
                  template_settings:
                    fields:
                      - date
                      - campaign.name
                      - metrics.clicks
      responses:
        "200":
          description: The newly created extract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extract"
              examples:
                extract_migrate_wide:
                  value:
                    id: 1443620
                    title: Extract 1
                    connection_id: 2047
                    account_id: 2330268667
                    account_name: Account 1
                    template:
                      id: 421
                      title: Extract Template 1
                      datasource_name: facebook
                      data_class: daily
                      is_wide_template: true
                    data_table:
                      id: 2
                      name: table_2
                      title: facebook_insights_new
                    fields:
                      - title: Field 1
                        name: field_1
                        user_kind: dimension
                        user_type: string
                        selected: true
                        can_edit: true
                        sql_name: field_1
                        format: string
                        is_dynamic: false
                    created_at: 2021-01-01T00:00:00Z
                    last_sync: In progress...
                    status: syncing
                    error_text: ""
                    schedules_limit: 10
                    scheduling:
                      - days: 1
                        hours: 1
                        minutes: 1
                        interval: day
                        timezone: UTC
                        lookback_window:
                          name: default
                    additional_params:
                      - type: string
                        name: param_1
                        required: true
                        title: Param 1
                        description: Param 1 description
                        params: {}
                        initial_value: value
                    sync_historical_data: 2025-01-01
        "400":
          description: Bad Request - Invalid request parameters, the source extract is not
            a wide report or dimensions were not changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_wide:
                  value:
                    detail: Extract is not a wide report extract
                dimensions_not_changed:
                  value:
                    detail: New fields do not differ from the source extract fields
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not_found:
                  value:
                    detail: Extract not found
      security:
        - bearerAuth: []
        - cookieAuth: []
