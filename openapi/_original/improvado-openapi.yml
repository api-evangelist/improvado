    post:
      operationId: api_v3_datasource_extract_templates_create
      summary: Create an extraction template
      description: >
        Create a custom (agency-level) extraction template based on a parent
        global template.


        For wide report templates (parent has `allow_to_select_dimensions` or
        `is_created_from_wide`),

        a `connection_id` is required and the selected fields are validated
        against the DSAS API.


        Required RBAC permission: `EXTRACT.CREATE`.
      tags:
        - Extraction templates
      parameters:
        - in: path
          name: datasource_name
          schema:
            type: string
          required: true
          description: Datasource name
          examples:
            create_template:
              value: act_on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractTemplateCreateRequest"
            examples:
              basic_template:
                summary: Create a basic template
                value:
                  parent_id: 123
                  title: My Custom Template
                  description: Custom template for daily extraction
                  fields:
                    - impressions
                    - clicks
                    - spend
                  scheduling:
                    - hours: 6
                      minutes: 0
                      timezone: UTC
                      interval: day
                      lookback_window:
                        name: default
                  additional_params: {}
              wide_template:
                summary: Create a wide report template (requires connection_id)
                value:
                  parent_id: 456
                  title: Wide Report Template
                  description: Wide template with custom dimensions
                  fields:
                    - campaign_name
                    - impressions
                    - clicks
                  scheduling:
                    - hours: 8
                      minutes: 0
                      timezone: America/New_York
                      interval: day
                      lookback_window:
                        name: default
                  additional_params: {}
                  connection_id: 789
                  hashed_fields:
                    - campaign_name
      responses:
        "201":
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTemplate"
              examples:
                created_template:
                  value:
                    id: 100
                    title: My Custom Template
                    description: Custom template for daily extraction
                    data_class: daily
                    datasource_name: act_on
                    schedules_limit: 1
                    scheduling:
                      - hours: 6
                        minutes: 0
                        timezone: UTC
                        interval: day
                        lookback_window:
                          name: default
                    fields:
                      - title: Impressions
                        name: impressions
                        user_kind: metric
                        user_type: integer
                        selected: true
                        can_edit: true
                        sql_name: impressions
                        format: integer
                        is_dynamic: false
                    additional_params: []
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_fields:
                  summary: Missing required fields
                  value:
                    parent_id:
                      - This field is required.
                    title:
                      - This field is required.
                invalid_parent:
                  summary: Invalid parent template
                  value:
                    detail: Parent template with id=999 does not exist
                wrong_datasource:
                  summary: Parent belongs to different datasource
                  value:
                    detail: Parent template does not belong to the specified datasource
                wide_no_connection:
                  summary: Wide template without connection_id
                  value:
                    connection_id: Required for wide report templates
                incompatible_fields:
                  summary: Incompatible fields for wide template
                  value:
                    detail: Fields are incompatible
                    incompatible_fields:
                      field_a:
                        - field_b
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
      security:
        - bearerAuth: []
        - cookieAuth: []
