        Rebuilds the recipe from the template it was created from, and starts the build. Every recipe in the dependency tree is snapshotted first, then their cells are dropped and recreated from the current template.

        This is how a fix made to a template reaches the recipes already deployed from it. The existing configuration - data sources, connections, accounts, sync_from_date - is preserved, and unlike a configuration PUT the build does not have to be triggered separately afterwards.

        Takes no request body. A 200 means the reset was accepted and the build was started, not that the build will succeed - as with POST /build/, a failure arrives asynchronously in the `error` field of the recipe detail.
      tags:
        - Recipes
      parameters:
        - in: path
          name: recipe_id
          schema:
            type: string
          required: true
          description: Automated recipe ID (numeric string)
          examples:
            recipe_resetup:
              value: "12647075758935484548"
      responses:
        "200":
          description: Recipe reset from its template and the build started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomatedRecipeResetupResponse"
              examples:
                reset:
                  value:
                    status: reset
                    recipe_id: "12647075758935484548"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicate_table_name:
                  summary: The output table name is taken by another recipe
                  value:
                    detail: This table name is already used. Please, change the table name
                build_in_progress:
                  summary: A build is already running for this recipe
                  value:
                    detail: Workflow already started
        "401":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_auth:
                  value:
                    detail: You do not have permission to perform this action.
        "403":
          description: >
            The embedded API is not enabled for this agency, or the recipe
