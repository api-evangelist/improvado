        Creates an automated recipe from a template. The recipe is created
        **empty** - no data sources, no connections, no accounts - so the next
        call must be PUT /api/v3/automated-recipes/{recipe_id}/.


        **Only one recipe per template per workspace.** A second create from the
        same template returns 400 with `existing_recipe_ids`; treat that as
        "already deployed" and reuse one of the returned recipes.


