        is_system:
          type: boolean
          description: True for built-in Improvado-managed roles. Read-only — cannot be
            edited or deleted.
        is_internal:
          type: boolean
          description: True for internal-only roles (impersonation, guest viewers). These
            are never listed in the API.
        layers:
          type: object
          description: Permissions grouped by product layer. Layer codes match `code` in
            the permissions catalog.
          additionalProperties:
            type: array
