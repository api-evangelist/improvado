                  items:
                    type: string
                connections:
                  type: array
                  description: 'Every connection the recipe reads, with its accounts. Cannot be empty. Each `connection_data_source` has to appear in `data_sources`, the pair of `connection_id` and `connection_data_source` has to be unique in the list, and every data source added by this call needs at least one connection here.

                    '
                  items:
                    type: object
                    required:
                    - connection_id
                    - connection_data_source
                    - accounts
                    properties:
                      connection_id:
                        type: integer
                        description: Connection identifier in this workspace.
                      connection_data_source:
                        type: string
                        description: Data source name of that connection, for example `facebook`.
                      accounts:
                        type: array
                        description: 'The accounts of that connection the recipe reads. Cannot be empty. Every account already configured has to stay in the list.

                          '
                        items:
                          type: object
                          required:
                          - id
                          properties:
                            id:
                              type: integer
                              description: 'Account identifier from `GET /api/v3.1/connections/{connection_id}/accounts/` of this workspace, with `is_active: true`.

                                '
                sync_from_date:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: 'The first date the recipe collects data from. Omit it or send `null` to leave the date the recipe already has unchanged.

                    '
            examples:
              configure_recipe:
                value:
                  data_sources:
                  - facebook
                  - google_ads
                  connections:
                  - connection_id: 33120
                    connection_data_source: facebook
                    accounts:
                    - id: 918204
                    - id: 918205
                  - connection_id: 33199
                    connection_data_source: google_ads
                    accounts:
                    - id: 927710
                  sync_from_date: 2026-01-01
              add_an_account:
                summary: Adding one account - the accounts already configured are sent again
                value:
                  data_sources:
                  - facebook
                  connections:
                  - connection_id: 33120
                    connection_data_source: facebook
                    accounts:
                    - id: 918204
                    - id: 918205
                    - id: 918301
