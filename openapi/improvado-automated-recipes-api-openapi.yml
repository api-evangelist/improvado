      summary: Configure a recipe
      description: 'Gives a recipe the data sources, connections and accounts it builds from. **This step is mandatory**: a recipe created through the API holds no configuration, and a build started before it answers 409 `recipe_not_configured`.


        The body is the **full set**, not a delta: send every data source, connection and account the recipe should have, including the ones it already has. Take `connection_id` from `GET /api/v3/datasources/{datasource_name}/connections` and every account `id` from `GET /api/v3.1/connections/{connection_id}/accounts/` of this same workspace, and use only accounts with `is_active: true` - anything else is rejected with 400 `account_unavailable`.


        **Configuration only grows.** Data sources, connections and accounts can be added, and none of them can be taken away: a body that leaves one out is rejected with 409 and the matching `*_removal_not_allowed` code. **An account cannot be removed from a recipe at all**, by this operation or by any other, and deleting the recipe does not remove it either. If the data of an account has to be taken out of a result, contact support.


        A successful call answers 200 with the recipe as it now stands, so the response can be compared with what was sent. It changes neither `state` nor `error` and starts no build; `POST .../build/` does that.'
