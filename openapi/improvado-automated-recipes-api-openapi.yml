      summary: Check recipe extraction tables
      description: 'Lists the extraction tables the recipe reads and says whether each of them exists in the destination of the workspace right now. The check runs against the destination on every call.


        This answers "were the tables created", not "is the data ready". Readiness is the `state` of the recipe together with `degraded` and `sources`; a table can exist and still hold nothing useful. A data source whose extractions write into more than one table appears once per table, so key `tables` by `table`, not by `data_source`.


        Use it when a build failed on missing data: if `all_tables_exist` is `false`, the extractions have not written anything yet and another build will fail the same way; if it is `true`, another build is worth starting.'
