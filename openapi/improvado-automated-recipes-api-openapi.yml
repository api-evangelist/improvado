    AutomatedRecipeTemplateOutputColumn:
      type: object
      description: One column of the table this template produces.
      properties:
        name:
          type: string
          description: Column name in the output table
        type:
          type: string
          enum:
          - string
          - number
          - bool
          - date
          - datetime
          description: Physical column type
        user_kind:
          type: string
          enum:
          - dimension
          - metric
          - date_key
          description: 'How the column is used in reporting. Derived from `type`: string and datetime are dimensions, number and bool are metrics, date is the date key.

            '
    RecipeBuildErrorV31:
      type:
      - object
      - 'null'
      description: 'Why a build failed. On a recipe this is not `null` if and only if `state` is `failed`; on an entry of `sources` it is not `null` if and only if that entry''s `status` is `failed`. Build error codes are a namespace of their own, separate from the codes of HTTP error responses - a few names appear in both. The catalogue is on the [Errors](/errors) page.

        '
      properties:
        code:
          type: string
          description: 'Machine-readable build error code, for example `no_data_delivered` or `sql_object_not_found`. Branch on this, never on the message. New codes can be added, so tolerate unknown ones.

            '
        message:
          type: string
          description: 'Public human-readable text: a fixed sentence for our own codes, and the cleaned-up message of the database for SQL failures. It never carries raw internal output, and its wording is not part of the contract.

            '
        stage:
          type:
          - string
          - 'null'
          enum:
          - extraction
          - transformation_build
          - final_build
          - null
          description: 'Which phase of the build failed: `extraction` while data was being collected, `transformation_build` while an intermediate step was built, `final_build` while the output table was built. `null` when the failure was recorded without a phase.

            '
        data_source:
          type:
          - string
          - 'null'
          description: 'The data source this failure belongs to, or `null` when it belongs to no single one. Inside `sources` it always matches that entry''s `data_source`.

            '
        occurred_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the failure was recorded, or `null` when no time was stored with it.
        details:
          type: object
          description: 'Extra data for this code, always an object; `{}` for codes that carry none. See [Errors](/errors) for the shape per code.

            '
    RecipeTemplateV31:
      type: object
      description: 'A recipe template as it appears in the v3.1 template list. A template is the blueprint a recipe is deployed from; it belongs to your agency and the same `id` can be deployed in every workspace of that agency.

        '
      properties:
        id:
          type: integer
          description: Template identifier. Pass it as `template_id` when you create a recipe.
        title:
          type: string
          description: 'Template name. It can be changed in the interface, and the name in force when a recipe is created decides the name of that recipe''s output table.

            '
        description:
          type: string
          description: Template description, as entered in the interface. Can be empty.
        data_sources:
          type: array
          description: 'Data sources this template supports. The `data_sources` you send when you configure a recipe must be taken from this list.

            '
          items:
            type: object
            properties:
              name:
                type: string
                description: Data source name, for example `facebook`. Use this value in requests.
              title:
                type: string
                description: Display name of the data source.
        categories:
          type: array
          description: 'Categories the template is filed under in the interface, in display order. Empty when the template has none.

            '
          items:
            type: object
            properties:
              name:
                type: string
                description: Category name.
              title:
                type: string
                description: Display name of the category.
        origin:
          type: string
          enum:
          - improvado
          - agency
          description: 'Who the template comes from. `improvado` - a template we provide; `agency` - a template your agency created by promoting one of its own recipes. Agency templates are the ones the interface shows as custom. New values can be added, so tolerate unknown ones.

            '
        build_mode:
          type: string
          enum:
          - progressive
          - atomic
          description: 'How a recipe from this template builds when one data source delivers no data. `progressive` - that data source is left out, the rest is built and the recipe becomes `ready_to_work` with `degraded: true`; if every data source fails, the recipe fails. `atomic` - a single failing data source fails the whole recipe. In both modes individual accounts that did not deliver never fail the recipe on their own. New values can be added, so tolerate unknown ones.

            '
        created_at:
          type: string
          format: date-time
          description: When the template was created.
        updated_at:
          type: string
          format: date-time
          description: When the template was last changed.
    ErrorEnvelope:
      type: object
      description: 'The error body of every v3.1 automated recipe operation and of the v3.1 connection accounts operation. All three fields are always present. See [Errors](/errors) for the full catalogue of codes.

        '
      properties:
        code:
          type: string
          description: Machine-readable error code. Branch on this, never on the message.
        message:
          type: string
          description: Human-readable text. Wording may change; it is not part of the contract.
        details:
          type: object
          description: 'Always present, always an object. Its shape depends on the code; codes that carry no extra data return an empty object. See [Errors](/errors).

            '
      required:
      - code
      - message
      - details
      examples:
      - not_found:
          value:
            code: not_found
            message: Recipe not found.
            details: {}
      - invalid_query_parameter:
          value:
            code: invalid_query_parameter
            message: A query parameter has an invalid value.
            details:
              parameter: state
              allowed_values:
              - extracting_data
              - building_dependencies
              - ready_to_work
              - failed
