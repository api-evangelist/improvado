      - Automated Recipes
      parameters:
      - in: path
        name: recipe_id
        schema:
          type: string
        required: true
        description: Recipe identifier, as returned when the recipe was created. A string of digits.
        examples:
          recipe_configure:
            value: '12647075758935484548'
      requestBody:
        required: true
        content:
