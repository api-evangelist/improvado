openapi: 3.2.0
info:
  title: Improvado Embedded API v3 Automated Recipes API
  version: 3.0.0
  description: 'Improvado Embedded API V3 provides programmatic access to data extraction, transformation, and loading capabilities.


    ## Authentication


    This API supports multiple authentication methods depending on the endpoint:


    ### Basic Authentication

    Used for workspace-agnostic operations such as:

    - Creating access tokens (`POST /api/v3/token`)

    - Listing workspaces (`GET /api/v3/workspaces`)

    - Managing workspaces (`POST /api/v3/workspaces`, `GET /api/v3/workspaces/{id}`, `PUT /api/v3/workspaces/{id}`)

    - Getting iframe URLs (`POST /api/v3/get_iframe_url`)

    - Listing available recipes (`GET /api/v3/recipes/`)

    etc.


    **Format**: `Authorization: Basic `


    ### Bearer Token Authentication

    Used for workspace-scoped operations after obtaining a token from `/api/v3/token`. The token is scoped to a specific workspace.


    **Format**: `Authorization: Bearer `


    ### Cookie Authentication

    Alternative to Bearer token for browser-based integrations. When using cookie authentication, you must include the workspace ID in the request header.


    **Cookie**: `dts_session_id=`


    **Required Header**: `X-IM-WORKSPACE-ID: `


    ## Workspace Scoping


    Most API operations are workspace-scoped. After authenticating with Basic Auth, obtain a workspace-specific token using `POST /api/v3/token` with the desired `workspace_id`. This token provides access only to resources within that workspace, ensuring isolation between different customers or projects.


    ## Errors


    The automated recipe operations under `/api/v3.1/automated-recipe*` and

    `GET /api/v3.1/connections/{connection_id}/accounts/` return errors as

    `{"code": "...", "message": "...", "details": {...}}`. Branch on `code`, never on the

    message text. See Errors for the catalogue of codes and the shape of `details`.


    All other operations return errors as `{"detail": "error description"}`.'
servers:
- url: https://embedded.improvado.io
tags:
- name: Automated Recipes
  x-zudoku-collapsed: true
  description: 'Deploy and operate automated recipes through the v3.1 API.


    An automated recipe turns a template into a SQL view in your workspace destination,

    built from the extractions the template needs.


    **Deploying a recipe takes four calls, in this order:**


    1. `GET /api/v3.1/automated-recipe-templates/` - pick a template.

    2. `POST /api/v3.1/automated-recipes/` - create the recipe. It is created empty.

    3. `PUT /api/v3.1/automated-recipes/{recipe_id}/` - supply data sources, connections

    and accounts. **This step is mandatory.**

    4. `POST /api/v3.1/automated-recipes/{recipe_id}/build/` - start the build, then poll

    `GET /api/v3.1/automated-recipes/{recipe_id}/` until `state` is `ready_to_work`

    or `failed`.


    Every path ends with a slash; a `301` means the slash is missing from your URL.

    With a bearer token the workspace is the one the token was issued for; with cookie

    authentication, send the workspace id in the `X-IM-WORKSPACE-ID` header.

    All errors use one envelope - see Errors.


    See the Deploying recipes guide for the full flow.'
paths:
  /api/v3.1/automated-recipe-templates/:
    get:
      operationId: api_v3_1_automated_recipe_templates_list
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl 'https://embedded.improvado.io/api/v3.1/automated-recipe-templates/?data_sources=facebook,google_ads' \\\n  -H \"Authorization: Bearer $TOKEN\"\n"
      summary: List recipe templates
      description: 'Lists the recipe templates your agency can deploy through the API, in catalogue order. A template belongs to the agency, not to a workspace, so the same `id` can be deployed in every workspace of the agency.


        Only templates that can be deployed through the API are returned, so this list can be shorter than the catalogue the interface shows. Templates are created and edited in the interface only; this API reads them.


        Pick a template here, then create a recipe from its `id`. The page holds 20 templates by default and 100 at most; `next` and `previous` are full v3.1 URLs.'
      tags:
      - Automated Recipes
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: 'Case-insensitive substring of the template title. An empty value is rejected with 400 `invalid_query_parameter`.

          '
        required: false
      - in: query
        name: data_sources
        schema:
          type: string
        description: 'Comma-separated data source names, for example `facebook,google_ads`. A template is returned when it supports at least one of them. An unknown name, an empty value or a bare comma is rejected with 400 `invalid_query_parameter`.

          '
        required: false
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: 'Page number, starting at 1. A page beyond the last one is rejected with 400 `invalid_query_parameter`, not answered with an empty list.

          '
        required: false
      - in: query
        name: page_size
        schema:
          type: integer
          default: 20
          maximum: 100
        description: 'Templates per page, from 1 to 100. A larger value is rejected with 400 `invalid_query_parameter`; it is not silently capped.

          '
        required: false
      responses:
        '200':
          description: One page of recipe templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeTemplatePageV31'
              examples:
                templates_page:
                  summary: First page of the catalogue
                  value:
                    count: 2
                    next: null
                    previous: null
                    results:
                    - id: 4021
                      title: Paid media spend by campaign
                      description: Daily spend, impressions and clicks from Facebook Ads and Google Ads in one table.
                      data_sources:
                      - name: facebook
                        title: Facebook Ads
                      - name: google_ads
                        title: Google Ads
                      categories:
                      - name: paid_media
                        title: Paid media
                      origin: improvado
                      build_mode: progressive
                      created_at: 2026-03-11 09:12:44+00:00
                      updated_at: 2026-08-04 16:20:03+00:00
                    - id: 4108
                      title: Email engagement weekly
                      description: ''
                      data_sources:
                      - name: mailchimp
                        title: Mailchimp
                      categories: []
                      origin: agency
                      build_mode: atomic
                      created_at: 2026-05-02 11:40:10+00:00
                      updated_at: 2026-05-02 11:40:10+00:00
        '400':
          description: 'A query parameter has a value this operation does not accept, or the request could not be processed at all. `bad_request` is the catch-all code for a 4xx that has no code of its own, so the same envelope can arrive with another 4xx status, for example 415.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid_query_parameter:
                  summary: An unknown data source was passed in the filter
                  value:
                    code: invalid_query_parameter
                    message: A query parameter has an invalid value.
                    details:
                      parameter: data_sources
                      allowed_values: []
                bad_request:
                  summary: The request could not be processed
                  value:
                    code: bad_request
                    message: The request could not be processed.
                    details: {}
        '401':
          description: The bearer token is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                authentication_failed:
                  value:
                    code: authentication_failed
                    message: 'Authentication failed: the token is missing, invalid or expired.'
                    details: {}
        '403':
          description: The caller is authenticated but this operation is not available to them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                permission_denied:
                  value:
                    code: permission_denied
                    message: This operation is not available to you.
                    details: {}
        '405':
          description: The HTTP method is not supported on this path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                method_not_allowed:
                  value:
                    code: method_not_allowed
                    message: Method not allowed.
                    details: {}
        '500':
          description: Something failed on our side. The request was not served; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                internal_error:
                  value:
                    code: internal_error
                    message: An internal error occurred.
                    details: {}
        '503':
          description: 'Temporarily unavailable. The response carries the header `Retry-After: 30`, so wait 30 seconds and repeat the request.

            '
          headers:
            Retry-After:
              description: How many seconds to wait before repeating the request. Always `30`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                service_unavailable:
                  value:
                    code: service_unavailable
                    message: The service is temporarily unavailable. Re-read the resource, then retry.
                    details: {}
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v3.1/automated-recipe-templates/{template_id}/:
    get:
      operationId: api_v3_1_automated_recipe_templates_retrieve
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl 'https://embedded.improvado.io/api/v3.1/automated-recipe-templates/4021/' \\\n  -H \"Authorization: Bearer $TOKEN\"\n"
      summary: Get a recipe template
      description: 'Returns one recipe template with the templates it is built on and the columns of the table a recipe from it produces. Use it to check a template before you deploy it: `output_columns` is available without deploying anything, and an empty `output_columns` means the schema could not be read, not that the table has no columns.


        `template_id` is an integer. A value that is not a positive integer answers 404 `not_found`, the same as a template that does not exist, belongs to another agency or cannot be deployed through the API.'
      tags:
      - Automated Recipes
      parameters:
      - in: path
        name: template_id
        schema:
          type: integer
        required: true
        description: Recipe template identifier, as returned by the template list.
        examples:
          template_detail:
            value: 4021
      responses:
        '200':
          description: The recipe template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeTemplateDetailV31'
              examples:
                template_detail:
                  value:
                    id: 4021
                    title: Paid media spend by campaign
                    description: Daily spend, impressions and clicks from Facebook Ads and Google Ads in one table.
                    data_sources:
                    - name: facebook
                      title: Facebook Ads
                    - name: google_ads
                      title: Google Ads
                    categories:
                    - name: paid_media
                      title: Paid media
                    origin: improvado
                    build_mode: progressive
                    level: 0
                    children:
                    - id: 4022
                      title: Facebook Ads base data
                      level: 1
                      parent_id: 4021
                      children: []
                    - id: 4023
                      title: Google Ads base data
                      level: 1
                      parent_id: 4021
                      children: []
                    dependencies_count: 2
                    output_columns:
                    - name: date
                      type: date
                      user_kind: date_key
                    - name: campaign_name
                      type: string
                      user_kind: dimension
                    - name: spend
                      type: number
                      user_kind: metric
                    created_at: 2026-03-11 09:12:44+00:00
                    updated_at: 2026-08-04 16:20:03+00:00
        '400':
          description: 'The request could not be processed. `bad_request` is the catch-all code for a 4xx that has no code of its own, so the same envelope can arrive with another 4xx status, for example 415.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                bad_request:
                  value:
                    code: bad_request
                    message: The request could not be processed.
                    details: {}
        '401':
          description: The bearer token is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                authentication_failed:
                  value:
                    code: authentication_failed
                    message: 'Authentication failed: the token is missing, invalid or expired.'
                    details: {}
        '403':
          description: The caller is authenticated but this operation is not available to them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                permission_denied:
                  value:
                    code: permission_denied
                    message: This operation is not available to you.
                    details: {}
        '404':
          description: 'No such template for this agency. The same answer covers a template of another agency, a template that cannot be deployed through the API and a `template_id` that is not a positive integer.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                not_found:
                  value:
                    code: not_found
                    message: Template not found.
                    details: {}
        '405':
          description: The HTTP method is not supported on this path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                method_not_allowed:
                  value:
                    code: method_not_allowed
                    message: Method not allowed.
                    details: {}
        '500':
          description: Something failed on our side. The request was not served; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                internal_error:
                  value:
                    code: internal_error
                    message: An internal error occurred.
                    details: {}
        '503':
          description: 'Temporarily unavailable. The response carries the header `Retry-After: 30`, so wait 30 seconds and repeat the request.

            '
          headers:
            Retry-After:
              description: How many seconds to wait before repeating the request. Always `30`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                service_unavailable:
                  value:
                    code: service_unavailable
                    message: The service is temporarily unavailable. Re-read the resource, then retry.
                    details: {}
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v3.1/automated-recipes/:
    get:
      operationId: api_v3_1_automated_recipes_list
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl 'https://embedded.improvado.io/api/v3.1/automated-recipes/?state=ready_to_work' \\\n  -H \"Authorization: Bearer $TOKEN\"\n"
      summary: List recipes
      description: 'Lists the automated recipes of the workspace the request is authenticated for, the most recently changed first.


        Every field you need to triage a fleet is already here: `state`, `degraded`, `not_delivered_reasons` and `error`. Read the detail of a recipe only when you need its configuration or the per-data-source breakdown.


        The page holds 20 recipes by default and 100 at most; `next` and `previous` are full v3.1 URLs.'
      tags:
      - Automated Recipes
      parameters:
      - in: query
        name: template_id
        schema:
          type: integer
        description: 'Return only the recipes deployed from this template. A value that is not a positive integer is rejected with 400 `invalid_query_parameter`.

          '
        required: false
      - in: query
        name: state
        schema:
          type: string
          enum:
          - extracting_data
          - building_dependencies
          - ready_to_work
          - failed
        description: 'Return only the recipes in this state. The value has to match one of the four snake_case states exactly; anything else, including a v3 value such as `Ready to work`, is rejected with 400 `invalid_query_parameter` and the allowed values in `details.allowed_values`.

          '
        required: false
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: 'Page number, starting at 1. A page beyond the last one is rejected with 400 `invalid_query_parameter`, not answered with an empty list.

          '
        required: false
      - in: query
        name: page_size
        schema:
          type: integer
          default: 20
          maximum: 100
        description: 'Recipes per page, from 1 to 100. A larger value is rejected with 400 `invalid_query_parameter`; it is not silently capped.

          '
        required: false
      responses:
        '200':
          description: One page of recipes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipePageV31'
              examples:
                recipes_page:
                  summary: A degraded recipe and a failed one
                  value:
                    count: 2
                    next: null
                    previous: null
                    results:
                    - recipe_id: '12647075758935484548'
                      template_id: 4021
                      template_title: Paid media spend by campaign
                      title: Paid media spend by campaign
                      workspace_id: 5120
                      state: ready_to_work
                      degraded: true
                      not_delivered_reasons:
                      - account_disabled
                      - timed_out
                      error: null
                      datatable_id: 88214
                      last_build_at: 2026-09-18 07:41:02+00:00
                      created_at: 2026-09-17 12:03:55+00:00
                      updated_at: 2026-09-18 07:41:02+00:00
                    - recipe_id: '12647075758935484711'
                      template_id: 4108
                      template_title: Email engagement weekly
                      title: Email engagement weekly
                      workspace_id: 5120
                      state: failed
                      degraded: false
                      not_delivered_reasons: []
                      error:
                        code: no_data_delivered
                        message: No data was delivered for this recipe.
                        stage: extraction
                        data_source: mailchimp
                        occurred_at: 2026-09-19 05:22:48+00:00
                        details: {}
                      datatable_id: null
                      last_build_at: 2026-09-19 04:10:00+00:00
                      created_at: 2026-09-19 03:58:31+00:00
                      updated_at: 2026-09-19 05:22:48+00:00
        '400':
          description: 'A query parameter has a value this operation does not accept, or the request could not be processed at all. `bad_request` is the catch-all code for a 4xx that has no code of its own, so the same envelope can arrive with another 4xx status, for example 415.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid_query_parameter:
                  summary: A v3 state value was passed to the filter
                  value:
                    code: invalid_query_parameter
                    message: A query parameter has an invalid value.
                    details:
                      parameter: state
                      allowed_values:
                      - extracting_data
                      - building_dependencies
                      - ready_to_work
                      - failed
                bad_request:
                  summary: The request could not be processed
                  value:
                    code: bad_request
                    message: The request could not be processed.
                    details: {}
        '401':
          description: The bearer token is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                authentication_failed:
                  value:
                    code: authentication_failed
                    message: 'Authentication failed: the token is missing, invalid or expired.'
                    details: {}
        '403':
          description: The caller is authenticated but this operation is not available to them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                permission_denied:
                  value:
                    code: permission_denied
                    message: This operation is not available to you.
                    details: {}
        '405':
          description: The HTTP method is not supported on this path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                method_not_allowed:
                  value:
                    code: method_not_allowed
                    message: Method not allowed.
                    details: {}
        '500':
          description: Something failed on our side. The request was not served; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                internal_error:
                  value:
                    code: internal_error
                    message: An internal error occurred.
                    details: {}
        '503':
          description: 'Temporarily unavailable. The response carries the header `Retry-After: 30`, so wait 30 seconds and repeat the request.

            '
          headers:
            Retry-After:
              description: How many seconds to wait before repeating the request. Always `30`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                service_unavailable:
                  value:
                    code: service_unavailable
                    message: The service is temporarily unavailable. Re-read the resource, then retry.
                    details: {}
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      operationId: api_v3_1_automated_recipes_create
      x-codeSamples:
      - lang: shell
        label: cURL
        source: "curl -X POST 'https://embedded.improvado.io/api/v3.1/automated-recipes/' \\\n  -H \"Authorization: Bearer $TOKEN\" \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"template_id\": 4021, \"title\": \"Paid media spend by campaign\"}'\n"
      summary: Create a recipe
      description: 'Creates a recipe from a template in the workspace the request is authenticated for. The recipe is created **empty** - no data sources, no connections, no accounts - so the next call has to be `PUT /api/v3.1/automated-recipes/{recipe_id}/`. Starting a build before that answers 409 `recipe_not_configured`.


        **One recipe per template per workspace.** A second create from the same template answers 409 `recipe_already_exists` and names the recipes that already exist. Do not create recipes from one template in one workspace in parallel: the second call loses the race and gets the same answer.


        `title` names the recipe and nothing else. It is optional and at most 255 characters; if it is missing, `null`, empty or only spaces, the template supplies the default name. **The name of the output table is derived from the title of the template at the moment the recipe is created**, never from `title` in this body, and the recipe keeps that name for good: renaming the template later changes the table name only for recipes deployed after the rename. To read the physical name, take `datatable_id` from this response and call `GET /api/v3/data-tables/{data_table_id}`, then read `sql_name`.'
      tags:
      - Automated Recipes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - template_id
              properties:
                template_id:
                  type: integer
                  description: 'Identifier of the template to deploy, as returned by the template list. It has to belong to your agency and be deployable through the API; anything else answers 400 `template_not_found`.

                    '
                title:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                  description: 'Name of the recipe, at most 255 characters. Omit it, or send `null`, an empty string or only spaces, to let the template name the recipe. It has no effect on the name of the output table.

                    '
            examples:
              create_recipe:
                value:
                  template_id: 4021
                  title: Paid media spend by campaign
              create_recipe_without_title:
                summary: Let the template supply the name
                value:
                  template_id: 4021
      responses:
        '201':
          description: 'The recipe was created. It holds no configuration yet, so `data_sources`, `connections` and `sources` are empty and `last_build_at` is `null`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeV31'
              examples:
                recipe_created:
                  summary: A recipe as it comes back from create
                  value:
                    recipe_id: '12647075758935484711'
                    template_id: 4021
                    template_title: Paid media spend by campaign
                    title: Paid media spend by campaign
                    workspace_id: 5120
                    state: extracting_data
                    degraded: false
                    not_delivered_reasons: []
                    error: null
                    datatable_id: 88407
                    last_build_at: null
                    created_at: 2026-09-19 03:58:31+00:00
                    updated_at: 2026-09-19 03:58:31+00:00
                    data_sources: []
                    allowed_data_sources:
                    - facebook
                    - google_ads
                    connections: []
                    sync_from_date: 2026-09-19
                    sources: []
        '400':
          description: 'The body is not valid JSON, a field of it is invalid, or the template cannot be deployed. `bad_request` is the catch-all code for a 4xx that has no code of its own, so the same envelope can arrive with another 4xx status, for example 415.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                validation_error:
                  summary: A field of the body is invalid
                  value:
                    code: validation_error
                    message: The request is invalid.
                    details:
                      fields:
                      - field: title
                        code: max_length
                        message: Ensure this field has no more than 255 characters.
                malformed_request:
                  summary: The body is not valid JSON
                  value:
                    code: malformed_request
                    message: The request body is not valid JSON.
                    details: {}
                template_not_found:
                  summary: No such template for this agency
                  value:
                    code: template_not_found
                    message: The template does not exist or cannot be deployed through the API.
                    details:
                      template_id: 4021
                bad_request:
                  summary: The request could not be processed
                  value:
                    code: bad_request
                    message: The request could not be processed.
                    details: {}
        '401':
          description: The bearer token is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                authentication_failed:
                  value:
                    code: authentication_failed
                    message: 'Authentication failed: the token is missing, invalid or expired.'
                    details: {}
        '403':
          description: The caller is authenticated but this operation is not available to them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                permission_denied:
                  value:
                    code: permission_denied
                    message: This operation is not available to you.
                    details: {}
        '405':
          description: The HTTP method is not supported on this path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                method_not_allowed:
                  value:
                    code: method_not_allowed
                    message: Method not allowed.
                    details: {}
