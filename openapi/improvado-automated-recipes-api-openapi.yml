components:
  schemas:
    AutomatedRecipeTemplateTreeNode:
      type: object
      description: 'A template in the dependency tree. The detail response is itself the root node: it carries `level` and `children` directly rather than nesting them under a wrapper.

        '
      properties:
        id:
          type: integer
          description: Template ID
        title:
          type: string
          description: Template title
        level:
          type: integer
          description: Depth in the tree, 0 for the template you requested
        parent_id:
          type: integer
          description: 'Parent template ID. Present on every node inside `children`; the root object of the detail response carries no `parent_id` key at all.

            '
        children:
          type: array
          description: Direct children of this node, nested recursively to any depth
          items:
            $ref: '#/components/schemas/AutomatedRecipeTemplateTreeNode'
    RecipeTemplateDetailV31:
      type: object
      description: 'A single recipe template with its dependency tree and the schema of the table it produces. Everything in the list item is here as well.

        '
      properties:
        id:
          type: integer
          description: Template identifier. Pass it as `template_id` when you create a recipe.
        title:
          type: string
          description: 'Template name. It can be changed in the interface, and the name in force when a recipe is created decides the name of that recipe''s output table.

            '
        description:
          type: string
          description: Template description, as entered in the interface. Can be empty.
        data_sources:
          type: array
          description: 'Data sources this template supports. The `data_sources` you send when you configure a recipe must be taken from this list.

            '
          items:
            type: object
            properties:
              name:
                type: string
                description: Data source name, for example `facebook`. Use this value in requests.
              title:
                type: string
                description: Display name of the data source.
        categories:
          type: array
          description: 'Categories the template is filed under in the interface, in display order. Empty when the template has none.

            '
          items:
            type: object
            properties:
              name:
                type: string
                description: Category name.
              title:
                type: string
                description: Display name of the category.
        origin:
          type: string
          enum:
          - improvado
          - agency
          description: 'Who the template comes from. `improvado` - a template we provide; `agency` - a template your agency created by promoting one of its own recipes. Agency templates are the ones the interface shows as custom. New values can be added, so tolerate unknown ones.

            '
        build_mode:
          type: string
          enum:
          - progressive
          - atomic
          description: 'How a recipe from this template builds when one data source delivers no data. `progressive` - that data source is left out, the rest is built and the recipe becomes `ready_to_work` with `degraded: true`; if every data source fails, the recipe fails. `atomic` - a single failing data source fails the whole recipe. In both modes individual accounts that did not deliver never fail the recipe on their own. New values can be added, so tolerate unknown ones.

            '
        level:
          type: integer
          description: Depth of this template in its own tree; 0 for a template you can deploy.
        children:
          type: array
          description: 'Templates this one is built on, nested to any depth. A recipe created from this template builds every node of the tree.

            '
          items:
            $ref: '#/components/schemas/AutomatedRecipeTemplateTreeNode'
        dependencies_count:
          type: integer
          description: How many templates this one depends on, counted over the whole tree.
        output_columns:
          type: array
          description: 'Columns of the table a recipe from this template produces, available before you deploy anything. An empty list means the schema could not be read - treat it as unknown, not as "no columns".

            '
          items:
            $ref: '#/components/schemas/AutomatedRecipeTemplateOutputColumn'
        created_at:
          type: string
          format: date-time
          description: When the template was created.
        updated_at:
          type: string
          format: date-time
          description: When the template was last changed.
    RecipeV31:
      type: object
      description: 'A single recipe with its configuration and the outcome of its last build. A strict superset of the list item.

        '
      properties:
        recipe_id:
          type: string
          description: Recipe identifier. A string, even though it is made of digits.
        template_id:
          type: integer
          description: The template this recipe was created from.
        template_title:
          type: string
          description: Current name of that template.
        title:
          type: string
          description: 'Recipe name. When you create a recipe without a title, the template supplies the default.

            '
        workspace_id:
          type: integer
          description: The workspace this recipe lives in.
        state:
          type: string
          enum:
          - extracting_data
          - building_dependencies
          - ready_to_work
          - failed
          description: 'Where the recipe stands. `extracting_data` - data is being collected; `building_dependencies` - the tables are being built; `ready_to_work` - the last build finished and the output table can be queried; `failed` - the last build failed, see `error`. `ready_to_work` means built, not built completely: it is built from the extractions that delivered, and how complete that is shown by `degraded` and `sources`. New values can be added, so tolerate unknown ones.

            '
        degraded:
          type:
          - boolean
          - 'null'
          description: 'Whether the last build was incomplete. Only meaningful while `state` is `ready_to_work`: in every other state, a failed recipe and a running build included, it is `false`. `true` - the build left something out, either a whole data source or some extractions; see `not_delivered_reasons` and `sources`. `false` - everything in the build delivered. `null` - the completeness of the last build is unknown because that build ran before version 3.1.

            '
        not_delivered_reasons:
          type: array
          description: 'The distinct reasons behind an incomplete last build, sorted and deduplicated across all data sources. Empty when `degraded` is `false` or `null`.

            '
          items:
            type: string
            enum:
            - connection_unavailable
            - account_disabled
            - permission_denied
            - extraction_failing
            - report_type_deprecated
            - paused
            - not_running
            - timed_out
            - unknown
            - source_failed
            description: 'The same values as `sources[].not_delivered[].reason`, plus `source_failed`, which means a whole data source dropped out of the build - look at `sources[].error` for that one. What to do about each reason is in [Deploying recipes](/recipes). New values can be added, so tolerate unknown ones.

              '
        error:
          $ref: '#/components/schemas/RecipeBuildErrorV31'
        datatable_id:
          type:
          - integer
          - 'null'
          description: 'The recipe''s output data table, or `null` while none is registered. Resolve the physical table name with GET /api/v3/data-tables/{data_table_id} instead of deriving it from a title.

            '
        last_build_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the last build of this recipe was started, no matter what started it. `null` means the recipe has never been built. For recipes last built before version 3.1 this is an approximation: the time the recipe record last changed, which is often the end of that build rather than its start.

            '
        created_at:
          type: string
          format: date-time
          description: When the recipe was created.
        updated_at:
          type: string
          format: date-time
          description: 'When the recipe itself last changed. It says nothing about builds - for those use `last_build_at` and `state`.

            '
        data_sources:
          type: array
          description: 'Data source names the recipe is configured for, sorted. Empty on a recipe that has been created but not configured yet.

            '
          items:
            type: string
        allowed_data_sources:
          type: array
          description: 'Data source names the template allows, sorted. Everything in `data_sources` has to come from this list.

            '
          items:
            type: string
        connections:
          type: array
          description: 'The connections and accounts the recipe reads. This is the full set the recipe holds; configuring a recipe always sends the full set, and nothing can be taken away from it.

            '
          items:
            type: object
            properties:
              connection_id:
                type: integer
                description: 'The connection, as numbered in this workspace. The same connector has a different `connection_id` in every workspace.

                  '
              connection_data_source:
                type: string
                description: Data source this connection belongs to, for example `facebook`.
              accounts:
                type: array
                description: The accounts of this connection that the recipe reads.
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: 'Account identifier, the one the v3.1 connection accounts operation returns.

                        '
        sync_from_date:
          type: string
          format: date
          description: 'The date the recipe collects data from. Always set in a response, even though it may be omitted from a configuration request.

            '
        sources:
          type: array
          description: 'What the last build did with each configured data source. One entry per name in `data_sources`.

            '
          items:
            $ref: '#/components/schemas/RecipeSourceV31'
    RecipeSourceV31:
      type: object
      description: 'What the last build did with one data source of the recipe. There is one entry for every data source in the recipe''s `data_sources`.

        '
      properties:
        data_source:
          type: string
          description: Data source name, for example `facebook`.
        status:
          type: string
          enum:
          - queued
          - extracting
          - building
          - ready
          - failed
          - not_built
          description: 'How this data source ended up in the last build. `queued` - waiting to start; `extracting` - collecting data; `building` - building its tables; `ready` - built; `failed` - it did not build, see `error`; `not_built` - it was not part of the last build, because it was added to the configuration afterwards or because the recipe has never been built. Run a build to include it. New values can be added, so tolerate unknown ones.

            '
        error:
          $ref: '#/components/schemas/RecipeBuildErrorV31'
        not_delivered_count:
          type: integer
          description: 'How many extractions of this data source did not make it into the last build. This is the full number; `not_delivered` lists at most 100 of them.

            '
        not_delivered:
          type: array
          description: 'The extractions that did not make it into the last build, ordered by `account_id` and capped at 100 entries per data source. An empty list means everything this data source was waiting for delivered.

            '
          items:
            type: object
            properties:
              extraction_id:
                type: integer
                description: 'The extraction that did not deliver. Look it up in the extractions API of the same workspace.

                  '
              account_id:
                type: integer
                description: 'The account the extraction belongs to. This is the same `id` you sent in `connections[].accounts[]` when you configured the recipe.

                  '
              reason:
                type: string
                enum:
                - connection_unavailable
                - account_disabled
                - permission_denied
                - extraction_failing
                - report_type_deprecated
                - paused
                - not_running
                - timed_out
                - unknown
                description: 'Why it did not deliver. `connection_unavailable` - the connection has to be reconnected; `account_disabled` - the account is switched off; `permission_denied` - access to the account was withdrawn on the platform; `extraction_failing` - the extraction keeps failing on the platform; `report_type_deprecated` - the platform retired this report; `paused` - the extraction is paused; `not_running` - a reused extraction is not running; `timed_out` - it did not deliver within the window the build waits; `unknown` - none of the above. What to do about each is in [Deploying recipes](/recipes). New values can be added, so tolerate unknown ones.

                  '
    RecipeExtractionTablesV31:
      type: object
      description: 'The extraction tables a recipe reads and whether they exist in your workspace destination yet. This answers "were the tables created", not "is the data ready".

        '
      properties:
        all_tables_exist:
          type: boolean
          description: '`true` only when `tables` is not empty and every table in it exists right now. It does not mean the data is complete: for that read the recipe''s `state`, `degraded` and `sources`.

            '
        tables:
          type: array
          description: 'One entry per extraction table the recipe reads. A data source with more than one table appears once per table, so key this list by `table`, not by `data_source`. Empty when the recipe reads no extraction tables yet.

            '
          items:
            type: object
            properties:
              data_source:
                type: string
                description: Data source name, for example `facebook`.
              table:
                type: string
                description: Name of the extraction table in the workspace destination.
              table_exists:
                type: boolean
                description: Whether that table exists in the destination right now.
              extraction_ids:
                type: array
                description: 'The extractions the last build used for this data source - the ones it created and the existing ones it reused. Empty before the first build.

                  '
                items:
                  type: integer
    RecipeTemplatePageV31:
      type: object
      description: One page of recipe templates.
      properties:
        count:
          type: integer
          description: Total number of templates matching the request.
        next:
          type:
          - string
          - 'null'
          description: Full URL of the next page, or `null` on the last page.
        previous:
          type:
          - string
          - 'null'
          description: Full URL of the previous page, or `null` on the first page.
        results:
          type: array
          description: Templates on this page.
          items:
            $ref: '#/components/schemas/RecipeTemplateV31'
    RecipeListItemV31:
      type: object
      description: 'A recipe as it appears in the v3.1 recipe list. The recipe detail returns every field below and adds the configuration and the per-data-source breakdown.

        '
      properties:
        recipe_id:
          type: string
          description: Recipe identifier. A string, even though it is made of digits.
        template_id:
          type: integer
          description: The template this recipe was created from.
        template_title:
          type: string
          description: Current name of that template.
        title:
          type: string
          description: 'Recipe name. When you create a recipe without a title, the template supplies the default.

            '
        workspace_id:
          type: integer
          description: The workspace this recipe lives in.
        state:
          type: string
          enum:
          - extracting_data
          - building_dependencies
          - ready_to_work
          - failed
          description: 'Where the recipe stands. `extracting_data` - data is being collected; `building_dependencies` - the tables are being built; `ready_to_work` - the last build finished and the output table can be queried; `failed` - the last build failed, see `error`. `ready_to_work` means built, not built completely: it is built from the extractions that delivered, and how complete that is shown by `degraded` and `sources`. New values can be added, so tolerate unknown ones.

            '
        degraded:
          type:
          - boolean
          - 'null'
          description: 'Whether the last build was incomplete. Only meaningful while `state` is `ready_to_work`: in every other state, a failed recipe and a running build included, it is `false`. `true` - the build left something out, either a whole data source or some extractions; see `not_delivered_reasons` and `sources`. `false` - everything in the build delivered. `null` - the completeness of the last build is unknown because that build ran before version 3.1.

            '
        not_delivered_reasons:
          type: array
          description: 'The distinct reasons behind an incomplete last build, sorted and deduplicated across all data sources, so that you can triage a fleet of recipes from the list alone. Empty when `degraded` is `false` or `null`.

            '
          items:
            type: string
            enum:
            - connection_unavailable
            - account_disabled
            - permission_denied
            - extraction_failing
            - report_type_deprecated
            - paused
            - not_running
            - timed_out
            - unknown
            - source_failed
            description: 'The same values as `sources[].not_delivered[].reason`, plus `source_failed`, which means a whole data source dropped out of the build - look at `sources[].error` for that one. What to do about each reason is in [Deploying recipes](/recipes). New values can be added, so tolerate unknown ones.

              '
        error:
          $ref: '#/components/schemas/RecipeBuildErrorV31'
        datatable_id:
          type:
          - integer
          - 'null'
          description: 'The recipe''s output data table, or `null` while none is registered. Resolve the physical table name with GET /api/v3/data-tables/{data_table_id} instead of deriving it from a title.

            '
        last_build_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the last build of this recipe was started, no matter what started it. `null` means the recipe has never been built. For recipes last built before version 3.1 this is an approximation: the time the recipe record last changed, which is often the end of that build rather than its start.

            '
        created_at:
          type: string
          format: date-time
          description: When the recipe was created.
        updated_at:
          type: string
          format: date-time
          description: 'When the recipe itself last changed. It says nothing about builds - for those use `last_build_at` and `state`.

            '
    RecipePageV31:
      type: object
      description: One page of recipes.
      properties:
