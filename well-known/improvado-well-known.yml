note: >-
  Re-probed 2026-08-13 across all four Improvado hosts. The 2026-07-19 round probed only improvado.io
  and embedded.improvado.io and found a single document (security.txt). Two further real documents
  have been found since: an agents.json discovery manifest on the marketing host, and — the significant
  one — a full RFC 8414 OAuth authorization-server metadata document on the tenant host
  report.improvado.io, which is what gates the customer MCP server. Every 200 below carries a real
  document; no HTML/SPA shell is recorded as a hit.
hosts:
- host: https://improvado.io
  documents:
  - path: /.well-known/security.txt
    status: 200
    file: improvado-security.txt
    rfc: RFC 9116
  - path: /.well-known/agents.json
    status: 200
    file: improvado-agents.json
    spec: agents.json 0.1.0
    note: >-
      Advertised in Improvado's own llms.txt ("Agents flow description: /.well-known/agents.json").
      Declares one flow, ask-question, pointing at POST https://agent.improvado.io/ask, plus a facts
      block with cited sources. This is the agents.json specification, NOT an A2A Agent Card — it has
      no protocolVersion, no capabilities object and no skills array — so it does NOT earn an
      AgentCard pointer.
  - path: /.well-known/openid-configuration
    status: 301
  - path: /.well-known/oauth-authorization-server
    status: 301
  - path: /.well-known/api-catalog
    status: 301
  - path: /.well-known/ai-plugin.json
