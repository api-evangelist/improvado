  - path: /.well-known/agent.json
    status: 404
- host: https://report.improvado.io
  note: Tenant / product host — serves the customer MCP server and its authorization server.
  documents:
  - path: /.well-known/oauth-authorization-server
    status: 200
    file: improvado-oauth-authorization-server.json
    rfc: RFC 8414
    note: >-
      Real OAuth 2.0 authorization-server metadata: issuer, authorize/token/revoke/introspect/register
      endpoints, authorization_code + refresh_token grants, PKCE S256, dynamic client registration, and
      scopes_supported [mcp:internal, mcp:customer, introspection]. Feeds scopes/improvado-scopes.yml.
  - path: /.well-known/oauth-protected-resource/experimental/agent/api/mcp-customer/v1/invoke/
    status: 200
    file: improvado-oauth-protected-resource.json
    rfc: RFC 9728
    note: >-
      Protected-resource metadata for the MCP endpoint. Discovered from the WWW-Authenticate header
      returned by the live MCP endpoint, which is the intended RFC 9728 discovery path.
  - path: /.well-known/oauth-protected-resource
    status: 404
    note: Only the path-suffixed resource-specific form is served, which is RFC 9728-correct.
  - path: /.well-known/openid-configuration
    status: 404
  - path: /.well-known/security.txt
    status: 404
  - path: /.well-known/agent-card.json
    status: 404
- host: https://embedded.improvado.io
  note: Embedded API v3 host.
  documents:
