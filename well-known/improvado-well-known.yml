  - path: /.well-known/oauth-authorization-server
    status: 404
  - path: /.well-known/agent-card.json
    status: 404
- host: https://agent.improvado.io
  note: Public Agent Ask API host. Returns a JSON 404 body for every unknown path, never an HTML shell.
  documents:
