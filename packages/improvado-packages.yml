note: >-
  Improvado ships exactly ONE first-party package across every public registry: a Python SDK for
  authoring custom pipeline workflows on Improvado's Temporal infrastructure. It is not a client
  library for the Embedded API v3 — there is no SDK for the REST API at all, and the developer docs
  give raw `requests` examples instead of pointing at one. The package was found not from the
  developer portal (which never mentions it) but from Improvado's own published Agent Skill
  `temporal-pipelines`, whose install step is `pip install --upgrade improvado-pipeline-sdk`. The full
  PyPI simple index was then swept: improvado-pipeline-sdk is the only Improvado-named project on
  PyPI. Every version and date below is read from the registry metadata endpoint.
